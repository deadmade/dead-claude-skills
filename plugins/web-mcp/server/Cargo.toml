[package]
name = "web-mcp"
version = "0.3.0"
edition = "2024"
rust-version = "1.97"
description = "Stdio MCP server for the web-mcp plugin: search, fetch and browser tools that archive everything in .web/."
license = "MIT"
publish = false

[dependencies]
rmcp = { version = "=3.5.1", features = ["server", "transport-io", "macros"] }
jiff = "0.2"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "fs", "sync", "io-util", "time"] }
url = "2"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
