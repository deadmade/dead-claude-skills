[package]
name = "web-mcp"
version = "0.3.0"
edition = "2024"
rust-version = "1.97"
description = "Stdio MCP server for the web-mcp plugin: search, fetch and browser tools that archive everything in .web/."
license = "MIT"
publish = false

[dependencies]
rmcp = { version = "=3.5.1", features = ["server", "transport-io", "macros"] }
jiff = "0.2"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "fs", "sync", "io-util", "time", "net"] }
url = "2"
anyhow = "1"
dom_smoothie = "=0.18.2"
htmd = "=0.5.6"
dom_query = "0.28"
pdf_oxide = "=0.3.78"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "gzip", "brotli"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures = { version = "0.3", default-features = false, features = ["std"] }
base64 = "0.23"

[dev-dependencies]
criterion = { version = "=0.8.2", default-features = false }
tokio = { version = "1", features = ["test-util"] }

[[bench]]
name = "extract"
harness = false

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
