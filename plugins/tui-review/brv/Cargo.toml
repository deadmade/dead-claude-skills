[package]
name = "brv"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Computes a branch's review diff and writes the cache the tui-review mod paints from."
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0.104"
unicode-width = "0.2.2"
zerocopy = { version = "0.8.62", features = ["derive"] }

[dev-dependencies]
divan = "0.1.21"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1

[[bench]]
name = "format"
harness = false
