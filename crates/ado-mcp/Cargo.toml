[package]
name = "ado-mcp"
version = "0.4.0"
edition = "2024"
rust-version = "1.97"
description = "Stdio MCP server for the mcp-azure plugin: Azure DevOps Server pull request, work item and pipeline tools."
license = "MIT"
publish = false

[dependencies]
rmcp = { version = "=3.5.1", features = ["server", "transport-io", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "sync", "time"] }
url = "2"
anyhow = "1"
base64 = "0.23"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "json"] }
rustls = { version = "0.23", default-features = false, features = ["std"] }
azure_devops_rust_api = { version = "=0.39.1", default-features = false, features = ["git", "build", "pipelines", "policy", "wit", "core", "ims", "search", "wiki"] }
azure_core = "=1.1.0"
# Already in the tree through azure_core; implementing its `Policy` needs the macro.
async-trait = "0.1"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
