[package]
name = "flow-cockpit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The flow cockpit window: shows flow runs, audits and Claude sessions through replaceable TypeScript views."

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
flow-cockpit-core = { path = "../core" }
include_dir = "0.7"
jiff = "0.2.38"
oxc_allocator = "=0.156.0"
oxc_ast = "=0.156.0"
oxc_codegen = "=0.156.0"
oxc_parser = "=0.156.0"
oxc_semantic = "=0.156.0"
oxc_span = "=0.156.0"
oxc_transformer = "=0.156.0"
serde = { version = "1", features = ["derive"] }
tauri = { version = "=2.12.5", features = [] }
ts-rs = "=12.0.1"

[lints]
workspace = true
