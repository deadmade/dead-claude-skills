[package]
name = "flow-cockpit-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Core of the flow cockpit: reads flow runs, plans, audits and build logs into typed data."

[dependencies]
jiff = "0.2.38"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1.1.8", features = ["parse", "serde"] }
ts-rs = "=12.0.1"

[lints]
workspace = true
