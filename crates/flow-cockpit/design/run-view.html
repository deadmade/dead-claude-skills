selection kept per run, run tabs laid out with\n  `display: contents`, the list opens on the first project, Activity reads only the selected session) — they keep\n  state across redraws and avoid parsing whole transcripts — costs nothing.\n- 2026-10-29, Task 8: \"Calls the build made\" lists flow.md's rulings only, as the approved design does — the ledger's\n  rulings are the same calls worded for the log and get copied into flow.md, so merging them double-counted — costs a\n  ledger ruling not yet copied being missing from the list until it is.\n- 2026-10-29, Task 8: the edits to Task 4's fixture home and `core/tests/index.rs` stand — `index.rs` was named in the\n  picks-and-fixed decision and the views' fixtures are dumped from that home — costs Task 4's fixtures carrying\n  view-only cases.\n- 2026-10-29, Task 8: each root belongs to exactly one project, its git remote's when one resolves and its folder\n  name's otherwise, and projects that still share a name show a short path tail in the list — the spec folds checkouts\n  \"by git remote, by folder name without one\", and a root listed under two projects broke that — costs the core index\n  and its tests joining Task 8's fix round.\n- 2026-10-29, Task 8: a project keeps a root only when that root's checkout is one of the project's own — roots then\n  follow the rule sessions already follow, so a worktree of one repo inside another's `.claude/worktrees/` lands in one\n  project only — costs one cached path walk per root.\n- 2026-10-29, Task 8: such a worktree belongs to the repo whose folder holds it, its documents too — that is where its\n  sessions already go, and giving it to its own repo would move sessions — costs a rare run listed under the wrong\n  project.\n- 2026-10-29, Task 9 follow-up: on Linux the app sets `WEBKIT_DISABLE_DMABUF_RENDERER=1` before the window opens,\n  unless it is already set — at the slice checkpoint the window died on the user's NVIDIA card under Wayland (\"Error\n  71 (Protocol error)\") and that variable fixed it — costs WebKitGTK's faster DMA-BUF path on every Linux machine\n  (setting it to 0 brings it back).\n- 2026-10-29, Task 10: a cut `questions` stays an array (only question and header kept, each question cut by\n  characters, trailing entries dropped) and the capture line gains `questions_cut: true` — the brief left how to cut\n  open, and a cut that left broken JSON would hide the open question from Task 11 — costs one optional field.\n- 2026-10-29, Task 10: the plugin's description, its marketplace entry and the root README name the capture hooks —\n  an opt-in user must know the plugin installs hooks, and descriptions stay true to the code — costs three more files\n  in the task.\n- 2026-10-29, Task 8d: the Build tab's task graph runs top to bottom, Task 1 at the top and the last task at the\n  bottom, with no scrollbar of its own (the user's ask once the plan grew to 20 tasks; it replaces the approved\n  mockup's left-to-right graph) — costs a taller graph column on long plans.\n\n## Deviations\n\n### Task 3 transcript fixtures are hand-written, not trimmed real ones\n\nThe plan asked for trimmed real transcripts. Copying them into the public repo was blocked, so the implementer reads\nreal transcripts only for their JSON shapes and field names and writes the fixture lines with invented text.\n\nStatus: decided 2026-10-28: hand-written in the real shape\n\n### Subagent text replies have no place in the activity model\n\nThe plan's `Text` carries no agent, so Task 3 dropped every subagent reply, final reports included; only their tool\ncalls showed.\n\nStatus: decided 2026-10-28: `Text` gains `agent: Option\u003cString>`, and subagent replies land in the turn open at their\ntime\n\n### Status never decays without a file change\n\nStatus was derived only when a project's files changed, so a run whose Claude session stopped stayed Working.\n\nStatus: decided 2026-10-28: `Index::refresh(now)` re-derives every status from cached facts without reading the disk;\nTask 6's poll calls it each tick\n\n### The approved mockup reads document format in the view\n\nThe page parses flow.md's Rulings, keeps each conductor's phase list and gate positions, and strips the\n`minor (deferred):` tag itself, against \"the document format is resolved in the core\".\n\nStatus: decided 2026-10-29: a new Task 5b before Task 6 gives the core typed `Ruling`s (flow.md and build log),\n`FlowDoc.phases` from the conductors' phase tables (checked against each SKILL.md), and untagged deferred items; the\nmockup switches to those fields\n\n### Two crates share one bindings folder\n\nThe core's export wiped the whole `bindings/` folder and its check failed on any file it didn't write, so the app's\n`ViewInfo` would break it.\n\nStatus: decided 2026-10-29: each crate owns its files; the core writes and checks only its own, and the app's check\ncovers the whole folder; `core/src/bindings.rs` joins Task 6's files\n\n### The webview writes its own data folder\n\nTauri always creates the webview's data folder (`~/.local/share/dev.deadmade.flow-cockpit/`, `%LOCALAPPDATA%` on\nWindows), incognito or not; it can be moved, not stopped. \"The app writes nothing\" didn't hold.\n\nStatus: decided 2026-10-29: accepted; the rule reads \"our code writes nothing; the webview engine keeps its own small\nfolder\"\n\n### A broken copy of a built-in view can't fall back\n\n`view_source(id)` always returns the global copy when one exists, and the built-ins live only inside the binary, so\nthe window couldn't draw the built-in under a broken copy's error.\n\nStatus: decided 2026-10-29: `view_source(id, builtin: Option\u003cbool>)`; with `true` it returns the built-in; the runtime\nuses it, views don't see it; `commands.rs` and `views.rs` join Task 7's files\n\n### Views don't know their route, and run tabs have no place\n\nThe plan's `ViewContext` had no route, so a view couldn't tell which run or doc it draws; and the approved run view\ndraws the whole window, tab bar included, with no place for `run-tab` views.\n\nStatus: decided 2026-10-29: `ViewContext` gains a read-only `route` and `tabs` (the loaded run-tab views); the run view\nputs them in its tab bar, and a selected tab's view is drawn into the run view's `data-slot=\"run-tab\"` element\n\n### Loose sessions can't be opened\n\nThe spec lists loose sessions \"so any Claude session's activity can be found\", but no route led to a session that\nbelongs to no run.\n\nStatus: decided 2026-10-29: `Route` gains `{ to: 'session', project, id }`, documented in `api.d.ts`; the activity view\ndraws it; `runtime.js`, `api.d.ts` and `runtime.test.mjs` join Task 8's files\n\n### Audit rows lack picks and fixed counts\n\nThe spec's list shows each audit's picks and how many were fixed; `AuditSummary` carried only open, closed or unknown.\n\nStatus: decided 2026-10-29: `AuditSummary` gains `picks: Option\u003cu32>` and `fixed: u32` from the parsed report\n\n### The list mixes projects, filters and runs\n\nAfter using slice 1 the user asked for projects and runs to be apart, and for a switch between flow runs and loose\nsessions. Task 8's list puts projects, status and conductor filters and the sort in one left rail beside the rows.\n\nStatus: decided 2026-10-29: the left rail keeps only Projects; the runs side gets a switch, Flow runs or Loose\nsessions (audits stay under Flow runs), a filter bar (status, conductor, sort, search) and a table with column\nheadings. Built as Task 8b, after Task 10 and before Task 11.\n\n### No way back, and a reload loses the page\n\nThe user asked for back and forward through the pages, and for a reload to keep the page. The runtime keeps the route\nin memory only, so a reload opens the list and there is no history.\n\nStatus: decided 2026-10-29: the route lives in the window's address (its hash), so the mouse's back and forward side\nbuttons move through the pages and a reload (F5 or Ctrl+R) keeps the page; no top-bar buttons or keys. A fresh start\nopens the list, and nothing is written to disk. Built as Task 8e, after the extensions (Task 8c) and lettered task ids (Task 8d).\n\n### Built-in views are compiled into the app\n\nChanging a default view needs a rebuild, a default can only be replaced, not switched off, and the views skill lives\nin a Claude Code plugin although the views belong to the app. The user wants the defaults shipped like extensions that\nanyone can disable, owned by the app so it runs on its own, not by a Claude Code plugin.\n\nStatus: decided 2026-10-29: the app gets its own extensions. An extension is a folder with one or more view files and\nan optional `style.css`, no manifest; the folder name is its id. The defaults (list, run, docs, activity) ship with\nthe app (Nix: `share/flow-cockpit/extensions`; later the Windows installer's folder); the user's go in\n`~/.config/flow-cockpit/extensions/`, and one with a default's name replaces it. All are loaded from disk and reloaded\nlive. `disabled = [\"\u003cname>\"]` in `config.toml`, read live, switches one off; the window stays read-only. The Claude\nCode plugin keeps only the views skill and the capture hooks. Built as Task 8c, after Task 8b.\n\n### Tasks added during a build don't show\n\nThe Build tab lists only plan.md's tasks, and the core reads task numbers as plain numbers, so tasks added by a\ndecision (5b, 8b, 8c, 8d, 8e) are invisible and the task card points at the wrong task while one of them is built.\n\nStatus: decided 2026-10-29: plan.md gets each added task under its lettered number, with a line naming the decision\nthat added it; the core reads ids like `8b` and orders them after 8; the flows' rules say how an added task is\nnumbered. Built as Task 8d, before back and forward (now Task 8e).\n\n### Activity freezes on a large running session\n\nThe user: Activity is slow or freezes. Every 2 s while a session runs it re-reads the whole transcript (34 MB for this\nbuild's session, about 113 MB with its 88 subagents), sends every turn with every tool input to the window and redraws\nall of it.\n\nStatus: decided 2026-10-29: the core reads only what was appended since the last read, outside the index lock; the\nwindow gets the newest 20 turns with a \"Show older turns\" button, and a tool call's input is fetched only when its\nfold opens. Measured on this session's transcript before and after. Built as Task 8f, right after the extensions' fix\nround, before Tasks 8d and 8e.\n\n### Diagrams flash when a page first opens\n\nThe user asked for the Mermaid diagrams to be drawn ahead so a page doesn't flash when it first opens. Today a diagram\nshows its source text until Mermaid has drawn it, then jumps to the drawing; only a redraw of a diagram already drawn\nis instant.\n\nStatus: decided 2026-10-29: the window draws diagrams ahead, in idle time: on start the task graphs and document\ndiagrams of the shown project's unfinished runs, and on opening a run the rest of that run's documents. A diagram not\ndrawn yet shows a quiet placeholder of the right size instead of its source; the source shows only when drawing fails.\nDrawings are kept in memory only (nothing written to disk). Built as Task 8g, after Task 8e.\n\n## Follow-ups\n\n- **Headless browsers break on this machine** (seen 2026-10-28 in Task 5; the user asked to fix it later):\n  - The Chrome that agent-browser installs (Chrome for Testing) doesn't start here: it lacks libglib on NixOS. That\n    leaves hallmark's `sloplint --render` without a browser; the implementer pointed puppeteer-core at Helium by hand.\n  - Headless Helium reloads any page that links the Google Fonts stylesheet (\"Execution context was destroyed\"),\n    traced to that one `\u003clink>`.\n  - web-mcp's `browser` on the same page showed the first screenshot, then the tab was on `about:blank` after a\n    scroll and `document.body` was null; likely the same cause.\n\n## Walkthrough\n\n| spec goal | plan task | file:line | test |\n| --------- | --------- | --------- | ---- |\n\n## Run verdict\n","Plan":"# Flow cockpit Implementation Plan\n\n> **For agentic workers:** REQUIRED SUB-SKILL: Use superpowers:subagent-driven-development (recommended) or\n> superpowers:executing-plans to implement this plan task-by-task. Steps use checkbox (`- [ ]`) syntax for tracking.\n\n**Goal:** A read-only desktop window (flow-cockpit) that shows every flow run, audit and loose Claude session of a\nproject, built from readable flow.md and plan.md files, the transcripts, and a small capture written by hooks.\n\n**Architecture:** The flows' templates and conductor text gain a small format contract (`now:`, numbered Gates,\n`###` decisions with `Picked:`, `###` deviations with `Status:`, `Does:`/`Depends on:` per plan task, `Picks:`/`Fixed`\nin audits). A Cargo workspace `crates/flow-cockpit` holds a pure core library (parsers, transcripts, project index)\nand a Tauri 2 app. The app serves its own runtime and building blocks from `app/shell/` and hands TypeScript views\ntheir stripped source over IPC. An opt-in plugin `flow-cockpit` holds the views skill (slice 1) and capture hooks for\n\"waiting on you\" (slice 2).\n\n**Tech Stack:** Rust 2024 edition; `tauri` 2.12.5, `tauri-build` 2.7.4; `ts-rs` 12.0.1; `serde`, `serde_json`; `toml`;\n`jiff` (as in web-mcp) for time; `include_dir` for the embedded views; `oxc_parser`, `oxc_transformer`, `oxc_codegen`,\n`oxc_semantic`, `oxc_allocator`, `oxc_span` pinned `=0.156.0` (only those used directly); vendored `marked` 18.1.2\n(`lib/marked.esm.js`), `dompurify` 3.4.17 (`dist/purify.es.mjs`), `mermaid` 12.2.0 (`dist/mermaid.min.js`, a classic\nscript); `jsdom` as a devDependency for the views tests; stdlib Node 26 for the hooks; Nix\n(`rustPlatform.buildRustPackage`, `wrapGAppsHook3`, `pkg-config`, `webkitgtk_4_1`, `gtk3`, `libsoup_3`, `librsvg`).\n\n**Spec:** [spec.md](spec.md). Background and decisions: [flow.md](flow.md). ADR: `docs/adr/0005-flow-cockpit-outside-claude-code.md`.\n\n## Global Constraints\n\n- The document format (flow.md, plan.md, audit reports): resolved in the core's document parser; never seen by the\n  views (they get the typed model plus raw Markdown for unrecognised parts) or by capture.\n- Which Claude session belongs to which flow run, and status: resolved in the core's run index; never seen by capture\n  (it records session facts only) or by the views.\n- Project identity (several checkouts, worktrees): resolved in the core's project index; the views see a project id\n  and name.\n- Claude Code's formats (hook payloads, transcript JSONL): resolved in capture (payload to event line) and in the\n  core's transcript reader; never seen by the views.\n- Untrusted text to HTML: resolved in the views' shared Markdown block (sanitiser); the core emits text, never HTML;\n  individual views never inject raw HTML from data.\n- Types across Rust and TypeScript: resolved in the generated `.d.ts`; never written by hand in a view.\n- Every type that crosses to the views derives `TS` (no `#[ts(export)]`). One `#[ignore]`d test per crate,\n  `export_bindings`, writes them all to `crates/flow-cockpit/bindings/`; `bindings_are_current` exports to a temp\n  folder and compares, ignoring line endings. A task that adds or changes such a type regenerates and commits them.\n- One version for everything: the plugin's `plugin.json`, `[workspace.package] version` in\n  `crates/flow-cockpit/Cargo.toml`, and every workspace package's entry in `crates/flow-cockpit/Cargo.lock`.\n- The app writes nothing anywhere (the user edits `config.toml` by hand). The hooks write only capture files.\n- Hooks are `async: true`, print nothing, exit 0 on every error.\n- Capture files: `$XDG_STATE_HOME/flow-cockpit/capture/\u003csession_id>.jsonl` (default `~/.local/state/...`) on Linux,\n  `%LOCALAPPDATA%\\flow-cockpit\\capture\\\u003csession_id>.jsonl` on Windows; the folder `0700`, files `0600` where the OS has\n  modes; files older than 30 days deleted by the SessionStart hook.\n- Views and config: global `~/.config/flow-cockpit/views/` and `config.toml` (`%APPDATA%\\flow-cockpit\\` on Windows);\n  per repository `.flow-cockpit/views/`, loaded only for repositories listed under `trusted` in `config.toml`.\n- The runtime, the building blocks, the vendored libraries and `tokens.css` live in `app/shell/` and load from\n  `'self'`: JavaScript modules with JSDoc types, checked by `tsc --checkJs` against `app/shell/api.d.ts`. Views are\n  TypeScript, reach the window only as source text from `view_source`, and are imported from a\n  `Blob([src], { type: 'text/javascript' })` URL that is revoked after import. A view gets everything through `ctx`;\n  only `import type` is allowed in a view, a value `import` is a load error naming the line. The shell has no inline\n  `\u003cstyle>` or `\u003cscript>`.\n- `now:` starts with `Waiting for you` at every stop where a conductor waits for the user; that prefix is what the\n  status reads.\n- Vendored packs (`plugins/flows/packs/`, `plugins/flows/agents/`) are never edited. Vendored view libraries\n  (`crates/flow-cockpit/app/shell/vendor/`) and generated bindings (`crates/flow-cockpit/bindings/`) are excluded from\n  treefmt and end-of-file-fixer and kept LF by `.gitattributes`.\n- The views tests (jsdom) run only in `flow-cockpit.yml` after `npm ci`, never in `npm test` or the pre-commit hook.\n- The installer keeps no runtime npm dependencies and only erasable TypeScript syntax; programs start through\n  `system/proc.ts`.\n- Rust tasks load the `rust-skills:rust-best-practices` skill; view tasks load `hallmark:hallmark` (app scope) and\n  keep `sloplint --scope app` clean.\n- Commit messages are one sentence, no co-author lines; stage with `git add -u` plus new paths by name.\n- Before you write: Read the task and the code it touches. List every place your change must reach: callers, tests,\n  fixtures, config, exports. Check what your change could break for users: data it would destroy or expose, callers\n  that stop working. That is scope. Extra features are not.\n\n## Review Focus\n\n1. **Real flow.md files in every old shape load without error:** no frontmatter, CRLF line endings, `\u003cdate>`\n   placeholders, wrapped and `Reopened` Gate lines, numbered or `**D1 –**` deviations. Pinned by\n   `parses_every_flow_md_in_repo` in Task 2.\n2. **Transcripts and captures are read while being written:** a half-written last line never fails a read; parallel\n   hook processes never interleave a line, at the largest line size. Pinned by `ignores_partial_last_line` (Task 3)\n   and `parallel_appends_stay_whole` (Task 10).\n3. **Large history doesn't freeze the window:** 1,100+ transcripts, some tens of megabytes. Pinned by\n   `second_link_scan_reads_under_2mb` (Task 4) and `first_paint_before_link_scan` (Task 6).\n4. **A broken view** (syntax error, a value `import`, throws, missing export) shows its error in its own place; the\n   built-in for that id and the other views keep working. Pinned by `broken_view_falls_back` (Task 7).\n5. **Untrusted text never runs:** script tags, event handlers and `javascript:` links in transcript or document text\n   are stripped before display; a repository's views load only when trusted. Pinned by\n   `markdown_strips_script_and_handlers` (Task 7) and `untrusted_repo_views_ignored` (Task 12).\n\n---\n\n## Slice 1\n\n### Task 1: The format contract in the flows\n\n**Does:** Makes every new flow run write a `now:` line, numbered gate lines, `###` decisions and deviations, a plain\npurpose and dependencies for each plan task, and audit picks and fixes, and makes check-repo fail when one goes missing.\n**Depends on:** none\n\n**Files:**\n\n- Modify: `plugins/flows/skills/feature-flow/references/flow-template.md`,\n  `plugins/flows/skills/research-flow/references/research-template.md`, `plugins/flows/references/build-template.md`\n- Modify: `plugins/flows/references/flow-rules.md` (State :13-18, Gates :36-37, the fifth s agram\n      shows the placeholder, not its source; a failed drawing shows the source and the reason; the queue renders one at\n      a time and stops when empty; a needed diagram jumps the queue; the same source isn't drawn twice.\n- [ ] **Step 2:** Run; expect FAIL.\n- [ ] **Step 3: Implement.**\n- [ ] **Step 4:** jsdom, both type checks, `nix develop -c npm test`; real window under Xvfb: open the list, wait a\n      few seconds, open a run's Build tab and its Docs right after the click: diagrams drawn, no flash.\n- [ ] **Step 5:** Commit: `Draw diagrams ahead in idle time so pages open without a flash.`\n\n### Task 9: The plugin, the views skill, the Nix package and CI\n\n**Does:** Makes slice 1 usable day to day: Claude can change views through a skill, Linux gets the app from the flake,\nand CI checks it.\n**Depends on:** Task 8\n\n**Files:**\n\n- Create: `plugins/opt-in/flow-cockpit/.claude-plugin/plugin.json` (md-pane's shape),\n  `plugins/opt-in/flow-cockpit/ skills/views/SKILL.md` (`name`, `description`), `plugins/opt-in/flow-cockpit/README.md`,\n  `.github/workflows/flow-cockpit.yml`\n- Modify: `.claude-plugin/marketplace.json` (entry after md-pane, `\"category\": \"development\"`),\n  `installer/core/plugins.test.ts:30-52`, `installer/core/options.ts` (`tools` page keys; `unavailable` hides\n  `flow-cockpit` on win32 until Task 13), `installer/core/options.test.ts`, `flake.nix` (package `flow-cockpit`:\n  `buildRustPackage`, `src = ./crates/flow-cockpit`, `buildAndTestSubdir = \"app\"`, version from\n  `(importTOML …).workspace.package.version`, `nativeBuildInputs = [pkg-config wrapGAppsHook3]`,\n  `buildInputs = [webkitgtk_4_1 gtk3 libsoup_3 librsvg]`, `checkFlags` skipping `poll_emits_once_per_change`, `poll_sees_folders_created_later` and\n  `first_paint_before_link_scan`; devShell gains those inputs), `README.md`, `CLAUDE.md` (Layout: three crates and the\n  plugin; Checks; CI)\n\n- [ ] **Step 1: Write the failing tests:** `opt-ins from the real manif y.mjs`),\n  `hooks/lib.mjs`, `hooks/lib.test.mjs`\n- Modify: `package.json` and `flake.nix` `installer-test` (add `plugins/opt-in/flow-cockpit/hooks/*.test.mjs` to the\n  `node --test` globs and the `files` regex), `plugins/opt-in/flow-cockpit/README.md`\n\n**Interfaces:**\n\n- Produces (capture line, JSON, `v: 1`):\n  `{ v, ts, session, cwd, event, agent?, agent_type?, tool_use_id?, questions?, notification_type?, message?, permission_tool?, transcript?, agent_transcript? }`; `questions` from\n  AskUserQuestion input, cut at 16 KiB.\n- Produces: `export function captureDir(env, platform): string`, `export function toLine(input, now): string | null`,\n  `export function prune(dir, now, maxAgeDays = 30): void`, `export async function main({ stdin, env, platform, now })`.\n\n- [ ] **Step 1: Write the failing tests** (`node:test`): `toLine maps PreToolUse AskUserQuestion with tool_use_id`;\n      `toLine maps PermissionRequest without deciding` (no output); `toLine maps SubagentStart with agent_type`;\n      `toLine returns null for invalid JSON`; `captureDir follows XDG_STATE_HOME and LOCALAPPDATA` (Task 6's\n      `paths_match_capture_rules` cases); `prune deletes files older than 30 days only`;\n      `main exits 0 and prints nothing when the capture dir is a file` (ENOTDIR on both OSes); `parallel_appends_stay_whole` (20 spawned\n      writers × 50 lines with 16 KiB `questions`, JSON-escaped → every line parses).\n- [ ] **Step 2:** `node --test plugins/opt-in/flow-cockpit/hooks/lib.test.mjs`; expect FAIL.\n- [ ] **Step 3: Implement.** One `fs.appendFileSync` of the whole line per event; folder\n      `mkdirSync(…, { recursive: true, mode: 0o700 })`, file mode `0o600`; `main` swallows every error. `hooks.json`: SessionStart (also prunes),\n      SessionEnd, UserPromptSubmit, Stop, SubagentStart, SubagentStop, Notification, PermissionRequest, and PreToolUse,\n      PostToolUse, PostToolUseFailure with `\"matcher\": \"AskUserQuestion\"`; each\n      `{\"type\":\"command\",\"command\":\"node \\\"${CLAUDE_PLUGIN_ROOT}/hooks/capture.mjs\\\"\",\"async\":true}`.\n- [ ] **Step 4:** Tests and `npm test` PASS. One real session with `--plugin-dir`: an AskUserQuestion and a permission\n      prompt show in the capture file.\n- [ ] **Step 5:** Commit: `Capture questions, permission prompts and agents per Claude session.`\n\n### Task 11: \"Waiting on you\" from the capture\n\n**Does:** Makes a flow run show \"waiting on you\" while one of its sessions has an open question or permission prompt.\n**Depends on:** Task 10, Task 4\n\n**Files:**\n\n- Create: `core/src/activity/capture.rs`, `core/tests/fixtures/capture/*.jsonl`\n- Modify: `core/src/activity/mod.rs` (`Live`), `core/src/index/{status,entries,mod}.rs` (read each linked session's\n  capture file), `core/src/bindings.rs` if a crossing type changes\n\n**Interfaces:**\n\n- Consumes: Task 10's line format.\n- Produces: `pub fn read_capture(path: &Path) -> Vec\u003cCaptureEvent>`; `pub fn live(events: &[CaptureEvent]) -> Live`\n  (`waiting`: the question, or the tool waiting for permission); `Status::Waiting` when any linked session's\n  `live.waiting` is set.\n\n- [ ] **Step 1: Write the failing tests:** `open_question_waits` (PreToolUse AskUserQuestion, no PostToolUse,\n      PostToolUseFailure or UserPromptSubmit after it); `answered_question_clears`; `permission_prompt_waits`;\n      `any_later_event_clears_permission` (a denial too: a later PreToolUse or Stop); `stop_without_start_is_ignored`;\n      `capture_ignores_partial_last_line`; `status_waiting_from_capture`.\n- [ ] **Step 2:** Run; expect FAIL.\n- [ ] **Step 3: Implement.**\n- [ ] **Step 4:** Tests and clippy PASS; with the plugin, a question in a running session turns its flow run to\n      \"Waiting on you\" within one poll (Task 6 already polls the capture folder).\n- [ ] **Step 5:** Commit: `Show waiting on you from the capture.`\n\n### Task 12: Repository views and trust\n\n**Does:** Lets a repository carry its own views, loaded only when the user has trusted that repository.\n**Depends on:** Task 9\n\n**Files:**\n\n- Modify: `app/src/views.rs` (a third root per trusted project root), `app/src/poll.rs` (poll those folders),\n  `plugins/opt-in/flow-cockpit/skills/views/SKILL.md`\n\n- [ ] **Step 1: Write the failing tests:** `trusted_repo_view_replaces_global` (lookup order: built-in, global,\n      trusted repository); `trust_matches_any_checkout_of_the_project`; `untrusted_repo_views_ignored` (passes before\n      this task too; kept as the guard).\n- [ ] **Step 2:** Run; expect the first two to FAIL.\n- [ ] **Step 3: Implement**, and add the `trusted` setting to the skill.\n- [ ] **Step 4:** Tests and clippy PASS.\n- [ ] **Step 5:** Commit: `Load a repository's own views once the user trusts it.`\n\n### Task 13: Windows release and installer\n\n**Does:** Lets the installer set the app up on Windows and print the pinned Nix command on Linux.\n**Depends on:** Task 9\n\n**Files:**\n\n- Create: `.github/workflows/build-flow-cockpit.yml` (Windows only, `x86_64-pc-windows-msvc`, zip + `.sha256`,\n  `--version` smoke test through a pipe)\n- Modify: `.github/workflows/release.yml` (job, `needs`, notes line), `installer/core/binaries.ts` (`BIN_PLUGINS`\n  entries gain optional `targets: string[]` and `linuxHint: (version: string) => string`; `flow-cockpit` with\n  `key: 'appPath'`, `targets: ['win32-x64']`, `linuxHint` giving\n  `nix run github:deadmade/dead-claude-skills/v${version}#flow-cockpit`; `binAsset` returns `undefined` outside `targets`),\n  `installer/steps/binaries.ts` (`applyBin`: with a `linuxHint` on Linux, push the hint to `done`; the `build` hint\n  names the plugin's own crate), `installer/install.ts:254-255` (call `applyBin` for flow-cockpit),\n  `installer/core/options.ts` (`unavailable` treats a platform with a `linuxHint` as offered; the win32 hiding from\n  Task 9 goes), `installer/core/binaries.test.ts` (`dirs` gains `plugins/opt-in/flow-cockpit`),\n  `installer/core/options.test.ts`, `plugins/opt-in/flow-cockpit/.claude-plugin/plugin.json` (`userConfig.appPath`),\n  `plugins/opt-in/flow-cockpit/skills/views/SKILL.md` (Windows path), `README.md`, `CLAUDE.md`\n\n- [ ] **Step 1: Write the failing tests:** `binAsset gives the Windows zip for flow-cockpit`;\n      `binAsset has no linux asset for flow-cockpit`; `flow-cockpit has a pinned linux hint` (contains `v${version}`);\n      `applyBin prints the hint on linux` (in `done`, not `failures`); `flow-cockpit is offered on win32 and linux`.\n- [ ] **Step 2:** `npm test`; expect FAIL.\n- [ ] **Step 3: Implement**; the summary line on Windows names `%USERPROFILE%\\.claude\\bin\\flow-cockpit.exe`.\n- [ ] **Step 4:** `npm test`, `npm run typecheck` PASS. On Windows (or the Windows CI build): the app opens, one view\n      loads through a blob in WebView2, and a Mermaid diagram renders. `gh workflow run build-flow-cockpit.yml` only with\n      the user's go (it needs a push).\n- [ ] **Step 5:** Commit: `Ship the flow cockpit to Windows through the installer.`\n","Spec":"# Flow cockpit: design\n\nStatus: approved at Gate 1 (2026-10-28); four items changed by plan review round 1 (marked **(review 1)**), waiting for re-approval. Terms follow `GLOSSARY.md` § Flow cockpit. Calls marked\n**(my call)** were made by Claude, not by the user. The shape is recorded in\n[ADR 0005](../../adr/0005-flow-cockpit-outside-claude-code.md).\n\n## Intent\n\nThe user runs one, at most two, Claude sessions at a time and works alongside them: they read what the agent edits\nand thinks, think about the problem too, and step in where needed. The conductors (`plugins/flows`) already split the\nwork well. What is missing is seeing it:\n\n- which flow runs are open, where each one stands, and which were never finished;\n- during a build: what each task is for, which one is running, what went wrong (fix rounds, findings, decisions);\n- what the main session and its subagents are doing right now.\n\nToday that lives in long Markdown files written for agents, in the SDD build log and in transcripts, and the only\nin-session view (the flows band) was turned off as \"too much\". The user wants a separate window that shows all of it\nand is easy and nice to read. They don't want a website they host, and they want the app easy to change by agents,\nthe way pi's extensions are.\n\n## Goals\n\n1. **Everything at a glance.** A project picker and a list of what ran in that project's checkouts and worktrees:\n   - **flow runs**, with conductor, phase, gates, open deviations, task progress during a build, status and last\n     activity, with filter and sort; unfinished ones stand out;\n   - **audits**, with their scope line, findings per severity, the user's picks and how many were fixed; an audit is\n     open while a pick has no fix recorded;\n   - **loose sessions** from the last 7 days, in their own group, so any Claude session's activity can be found.\n2. **A flow run you can read.** Selecting one shows, built from the documents' structure rather than rendered\n   Markdown: the `now:` sentence, the phases and gates as a stepper, the decisions taken, open deviations, and during a\n   build each task as a card with what it does, its state and what went wrong, and a graph when the plan names\n   dependencies.\n3. **Docs drawn properly.** spec.md, plan.md and flow.md shown through the same enhancer: recognised parts as UI,\n   everything else as Markdown, Mermaid blocks as diagrams.\n4. **Live activity.** What the Claude session and each subagent are doing: tool calls with their input (edits as\n   diffs, commands), replies, agent start and stop, questions and permission prompts that came up. The raw\n   conversation is one click away, not the main view.\n5. **Readable documents at the source.** flow.md and plan.md follow a format the app recognises (below). The build\n   adds the format's parts to all three templates (`feature-flow`, `research-flow`, the shared `build-template.md`)\n   and the conductor text that keeps them filled; the user reshapes the rest of the wording afterwards, and the checks\n   catch a part that goes missing.\n6. **Changeable by agents.** Every view, the built-in ones included, is a TypeScript file in a folder the app watches\n   and reloads on change, against a documented interface. A skill tells Claude how to write or change a view.\n7. **Linux (through Nix) and Windows x64.**\n\n## Non-goals\n\n- Interacting with Claude from the app: no answering questions or permissions, no starting or resuming flows, no\n  typing into sessions. Also no command in Claude Code that opens the app.\n- Notifications from the app. The existing ones (Stop, questions, permission prompts) stay as they are.\n- Model-written summaries (Haiku). Considered and not picked: the documents get better instead.\n- A readable format for the SDD build log, or for audit reports beyond the `Picks:`/`Fixed` lines. The app reads the\n  rest as it is.\n- Migrating older flow.md files.\n- Running plan tasks in parallel. `Depends on:` is for drawing; the build still runs tasks in order.\n- A hosted or browser web UI, macOS, ARM, Linux outside Nix, team or multi-user use, tickets.\n\n## Anti-goals\n\n- **A second place where work is managed.** flow.md stays the record; the app never writes to a repository or to\n  Claude Code's files. No tickets, no state of its own about runs beyond caches it can rebuild.\n- **Noise.** Detail stays one step away (E4, E5, E10 in flow.md's Evidence): the list shows state, a run shows its\n  shape, the raw conversation and tool output open on demand.\n- **Hard to read.** If a part of a run can't be shown as a short sentence or a small component, it waits for the\n  format to say it better rather than being dumped as text.\n\n## Constraints\n\n- Repo rules (CLAUDE.md): one version for everything, `check-repo` consistency, the installer downloads binaries per\n  `BIN_TARGETS`, no runtime npm dependencies in the installer, vendored packs are never edited (changes to pack rules\n  go through conductor text with an `overrides` marker).\n- Claude Code formats are not stable: hook payloads are documented, transcript JSONL and `~/.claude/jobs/` are not.\n  Subagent transcripts keep tool calls and text, but thinking blocks are stored empty (checked in this session).\n- Hooks run per event; on every tool call they must not slow Claude Code (async, no output).\n- Transcripts and build logs carry text from web pages and tools: untrusted.\n- The user's terminal setup (Ghostty, tmux, Windows Terminal, Night City) stays as it is.\n\n## Approaches\n\nRecorded in flow.md **Options** with the evidence, and in ADR 0005. Picked: Claude Code stays in the user's terminal;\nhooks record what transcripts lack; a separate desktop window (Tauri: Rust core,\nTypeScript views, the system's webview) reads that capture plus the run documents. Rejected: a pane inside Claude Code,\na terminal viewer, a cockpit hosting Claude Code in embedded terminals, agent teams in tmux panes, a local web server,\nElectron, Rust views.\n\nThe throwaway prototype (scratchpad, recorded in flow.md) settled the list's shape (\"the shape feels right\") and\nshowed that styling raw agent text doesn't make it readable.\n\n## The document format (the contract)\n\nThe app recognises these parts. Wording around them is free; a document without them still shows, as Markdown.\n\n**flow.md**\n\n- Frontmatter: `flow:` and `phase:` (as today), plus `now:`, one plain sentence of where the run stands and what comes\n  next. **(my call: frontmatter, so it parses without reading the body)** The conductor rewrites it after every phase\n  and at every stop where it waits for the user (a gate, a deviation, a question); a conductor called inline writes\n  into its caller's flow.md. At every such stop it starts with `Waiting for you` **(review 2)**. Example:\n  `now: Waiting for you to approve the plan (Gate 2).`\n- `## Gates`: one line per gate, `- Gate \u003cn>, \u003cwhat>: \u003cdate>[, \u003cextra>]`; empty after the colon while open; a\n  reopening appended as `Reopened \u003cdate>: \u003cwhy>`. (Today's shape, made strict.)\n- `## Options`: one `### \u003cdecision>` per decision, with a `Picked:` line naming the choice in plain words, then the\n  reasons and rejected options as free text.\n- `## Deviations`: one `### \u003cdeviation>` each, with a `Status: open` or `Status: decided \u003cdate>: \u003cwhat>` line.\n- Other sections (Request, Grounding, Prior art, Tasks, Rulings, Walkthrough, Run verdict) keep their headings so the\n  app can place them; their content is shown as Markdown.\n- An older flow.md without these parts shows what parses (phase, gates, the build log) and Markdown for the rest; with\n  no `now:`, the app shows the phase in its place.\n\n**plan.md**\n\n- Each task stays `### Task \u003cn>: \u003ctitle>` and gains, right below it:\n  - `**Does:** \u003cone plain sentence: what this task changes, for a reader who doesn't know the code>`\n  - `**Depends on:** Task \u003cn>, Task \u003cm>` or `none`\n- `**Files:**` and the rest stay as `writing-plans` writes them.\n- `writing-plans` is vendored, so the requirement goes into flows' Phase 4 text with an\n  `\u003c!-- overrides superpowers/skills/writing-plans/SKILL.md: \"...\" -->` marker if it contradicts a pack sentence.\n\n**Diagrams.** One line in `flow-rules.md`: the user reads specs, plans and flow.md in a viewer that draws Mermaid;\nuse a diagram where it explains something better than prose. Never required.\n\n**Audit reports** **(review 1)**. flow-rules' Reports section gains one line shape: `Picks: \u003cfinding numbers> | none`,\nand per picked finding a `Fixed \u003cdate>: \u003cnumber>` line once its fix passed its check. An audit is open while a pick has\nno `Fixed` line. Older reports without these lines show as Markdown with their state unknown.\n\n**Gates in the build conductors** **(review 1)**. `/implement`, `/fix-flow` and `/upgrade` write numbered gate lines\nin the same shape (`- Gate 1, \u003cwhat>: \u003cdate>`), and the templates leave the date empty while open instead of a\n`\u003cdate>` placeholder.\n\n**Checks.** check-repo fails when a template lacks a contract part (`now:`, the Gates shape, `Does:`/`Depends on:` in\nthe plan instructions of feature-flow, implement and upgrade, the `Picks:` line). The app's parser tests run against the real templates and against older flow.md files from\n`docs/features/`, which must still load.\n\n## Design checkpoint\n\nThe flow run view is the part the user found unreadable twice. The plan stops once the core reads the new format:\na clickable mockup of the flow run view, built from this run's own flow.md and plan in the new format, goes to the\nuser, and the real views are built only after they approve it.\n\n## Status\n\n- **Waiting on you** **(review 1)**: the capture shows an AskUserQuestion that started and hasn't ended (no later\n  result, failure or prompt), or a permission prompt with no later event in that Claude session; or the flow run's\n  `now:` starts with `Waiting for you`. Without capture, only `now:` counts. (A Stop doesn't fire while a question\n  dialog is open, so \"Stop after a question\" is not a signal.)\n- **Working** **(review 1)**: the Claude session's transcript grew in the last 2 minutes. Transcripts are written as\n  the session runs, so this needs no capture.\n- **Idle:** not done, not waiting, not working.\n- **Stale:** not done and nothing happened for 3 days.\n- **Done:** `phase: done`.\n\n## The parts\n\n1. **The flow-cockpit plugin** (a plain opt-in under `plugins/opt-in/flow-cockpit`; flows doesn't depend on it). It\n   holds the capture hooks and the skill that teaches Claude to write or change a view. Command hooks, one\n   stdlib Node script like `plugins/default/hooks/notify.mjs`, async, append one JSON line per event to a\n   per-session file under the user's home (outside any repo, user-only permissions). **(review 1)** The capture\n   records only what transcripts lack: SessionStart, SessionEnd, UserPromptSubmit, Stop, SubagentStart, SubagentStop,\n   Notification, PermissionRequest (observed only, never decided), and PreToolUse, PostToolUse and PostToolUseFailure\n   for AskUserQuestion only. Tool calls, edits, replies and results come from the transcripts. No mod (recorded in\n   flow.md Options; revisited only if a gap shows).\n2. **The flow-cockpit app** (Rust, `crates/flow-cockpit`, binary `flow-cockpit`). The core discovers projects from the folders\n   Claude Code has run in (checkouts folded by git remote, by folder name without one; a project can be hidden in the\n   config), their worktrees, flow runs, audits and Claude sessions; parses flow.md, plan.md and audit reports into a\n   typed model; reads SDD build logs; links Claude sessions to flow runs (a session that wrote or edited the run's\n   flow.md); takes activity from transcripts and live state from the capture; checks the known folders for changes\n   and pushes them to the views. Read-only on everything it\n   doesn't own.\n3. **Views** (TypeScript, in the Tauri window). The built-in ones (list, flow run, docs, activity) are embedded in\n   the app binary; `flow-cockpit --print-view \u003cid>` prints one **(review 1)**. A same-named file in a views folder replaces one, a new name adds one:\n   - global: `~/.config/flow-cockpit/views/` on Linux, `%APPDATA%\\flow-cockpit\\views\\` on Windows;\n   - per repository: `.flow-cockpit/views/`, loaded only for repositories trusted in the config;\n   - settings: `config.toml` next to the global views folder (trusted repositories, hidden projects).\n     To change a built-in, the skill writes the printed copy into the global folder and edits it; the app marks replaced views,\n     deleting the copy restores the original, and app updates never touch the copies. `flow-cockpit --print-types`\n     prints the view interface and data types for views outside the repo **(review 2)**. Types are stripped on load; the\n     interface is a generated `.d.ts`. Shared building blocks: sanitised Markdown, Mermaid, diffs, stepper, cards.\n4. **Distribution.** Linux: a package in the repo's `flake.nix` (`nix run`, or the user's system config), because a\n   Tauri window links the system's GTK and WebKit and can't be a static musl download like tui-review and web-mcp.\n   Windows x64: a release build the installer downloads. The installer offers the flow-cockpit plugin as opt-in on\n   both; on Windows it also downloads the app to `%USERPROFILE%\\.claude\\bin\\flow-cockpit.exe` and prints that path\n   (no shortcut) **(review 1)**; on Linux it prints how to get it, pinned to the installed release\n   (`nix run github:deadmade/dead-claude-skills/v\u003cversion>#flow-cockpit`, or the package for the system config).\n\n## Slices **(review 1)**\n\n1. **Slice 1, used daily before slice 2 starts:** the format, the parsers, the index (status from `now:`, transcripts\n   and documents), the window, the view runtime, the built-in views, the views skill, the Nix package and CI.\n   On Windows the plugin stays hidden until slice 2 ships the app there **(review 2)**.\n2. **Slice 2:** the capture hooks and live \"waiting\" state, per-repository views and trust, the Windows release and\n   installer step.\n\n## Trust and history **(my calls, from the builder check)**\n\n- **Views are code.** The built-in views and the user's global views folder load always. A repository's own views\n  folder loads only for repositories the user has listed in the app's config file; a repository can't put code in the\n  window by being cloned. Views run under a strict content policy (no network, no remote scripts) and get data only\n  through the core's read-only interface.\n- **History without capture.** Every Claude session shows its conversation and tool calls from its transcript, as the\n  prototype did. Without capture, only \"waiting on you\" is limited (to `now:`). The transcript reader is the fallback, not a second\n  event source, and it tolerates entries it doesn't know.\n\n## Where each cross-cutting concern is decided\n\n- The document format (flow.md, plan.md, audit reports): resolved in the core's document parser; never seen by the\n  views (they get the typed model plus raw Markdown for unrecognised parts) or by capture.\n- Which Claude session belongs to which flow run, and status: resolved in the core's run index; never seen by capture\n  (it records session facts only) or by the views.\n- Project identity (several checkouts, worktrees): resolved in the core's project index; the views see a project id\n  and name.\n- Claude Code's formats (hook payloads, transcript JSONL): resolved in capture (payload to event line) and in the\n  core's transcript reader; never seen by the views.\n- Untrusted text to HTML: resolved in the views' shared Markdown block (sanitiser); the core emits text, never HTML;\n  individual views never inject raw HTML from data.\n- Types across Rust and TypeScript: resolved in the generated `.d.ts`; never written by hand in a view.\n\n## Decided by the user\n\n- One or two sessions, working alongside them; not a fleet of parallel agents (2026-10-28).\n- A separate window, not a hosted website; Claude Code stays in the terminal (2026-10-28).\n- Watch only, no interaction for now (2026-10-28).\n- Rust core, TypeScript views (2026-10-28).\n- Agents may write diagrams, never forced to (2026-10-28).\n- The app easy to change by agents, like pi (2026-10-28).\n- Readable documents at the source, flow.md and plan.md, not Haiku summaries (2026-10-28).\n- Easy and nice to read is a goal of its own (2026-10-28).\n- The prototype's list-then-run shape (2026-10-28).\n- No measurable target; moved from `/research-flow` to `/feature-flow` (2026-10-28).\n- Linux through a Nix package, Windows through a release download (2026-10-28, builder check).\n- The build adds the format parts to the templates; the user polishes the wording (2026-10-28, builder check).\n- The list holds flow runs, audits and loose sessions (2026-10-28, builder check).\n- Grill round 1 (2026-10-28): the glossary terms; the names flow-cockpit and flow-capture (merged into one plugin, flow-cockpit, in round 2); the plugin a plain\n  opt-in, the Rust app in `crates/`; who rewrites `now:`; the status rules; audits as written; loose sessions from 7\n  days; projects found automatically; no migration of older runs; no command to open the app from Claude Code; no\n  notifications from the app; ADR 0005; the six seam lines.\n- Plan review round 2 (2026-10-28): all fixes applied, including `now:` starting with `Waiting for you` at every stop\n  and the plugin hidden on Windows during slice 1.\n- Plan review round 1 (2026-10-28): two slices; capture only what transcripts lack; built-in views embedded, the\n  Windows app at a fixed path with no shortcut; the review's technical fixes, including the audit `Picks:` line.\n- Grill round 2 (2026-10-28): one plugin named flow-cockpit (capture hooks and the views skill); the installer prints\n  the Nix command on Linux; the views and config paths; built-ins changed through copies in the global folder;\n  `Depends on:` for drawing only; the design checkpoint before the views.\n\n## Left to the builder\n\nThe Tauri, file-watching, type-stripping, type-generation, Markdown, sanitiser and Mermaid libraries and versions;\nthe exact view interface (within: small, typed, hot-reloaded); where capture files live and how long they are kept;\nthe \"working\" threshold; the visual design within the Night City palette and the readability bar the prototype set.\n"}</script>

<script>
"use strict";
// This page mirrors what the run view will get: FlowDoc, PlanDoc | null, Ledger | null (bindings/*.ts), and the raw
// text of a doc by DocName. It reads no document format itself; where it still has to, a comment says so.
const load = (id) => { try { return JSON.parse(document.getElementById(id).textContent || "null"); } catch { return undefined; } };
const DATA = { flow: load("flow-json"), plan: load("plan-json"), ledger: load("ledger-json"), docs: load("docs-json") };

const $ = (id) => document.getElementById(id);
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
// The views' shared Markdown block: marked, then DOMPurify. Nothing from the data reaches the DOM any other way.
const md = (s) => DOMPurify.sanitize(marked.parse(String(s ?? ""), { gfm: true }));
const inline = (s) => DOMPurify.sanitize(marked.parseInline(String(s ?? ""), { gfm: true }));
const plainText = (s) => String(s ?? "").replace(/`|\*\*/g, "");
const plural = (n, one, many = one + "s") => `${n} ${n === 1 ? one : many}`;
const times = (n) => n === 1 ? "once" : n === 2 ? "twice" : `${n} times`;
// Capitalises a plain first word only; an identifier such as `list_items` keeps its case.
const capital = (s) => /^[a-z]+(\s|$)/.test(s) ? s.charAt(0).toUpperCase() + s.slice(1) : s;
const day = (iso) => { const d = new Date(iso + "T00:00:00Z"); return isNaN(d) ? iso : d.toLocaleDateString("en-GB", { day: "numeric", month: "short", timeZone: "UTC" }); };
const list = (xs) => xs.length < 2 ? xs.join("") : `${xs.slice(0, -1).join(", ")} and ${xs.at(-1)}`;

mermaid.initialize({
  startOnLoad: false, securityLevel: "strict", theme: "base",
  // Mermaid 12's default "neo" look gives every node a 120px minimum; the classic look sizes nodes to their label.
  look: "classic", htmlLabels: false,
  flowchart: { useMaxWidth: false, minNodeWidth: 0, rankSpacing: 26, nodeSpacing: 14, padding: 9, curve: "basis" },
  themeVariables: {
    darkMode: true, background: css("--color-paper"), fontFamily: css("--font-body"), fontSize: "13px",
    primaryColor: css("--color-paper-3"), primaryTextColor: css("--color-ink"), primaryBorderColor: css("--color-paper-4"),
    lineColor: css("--color-paper-4"), secondaryColor: css("--color-paper-2"), tertiaryColor: css("--color-paper-2"),
  },
});

// The core hands over the conductor's phases (FlowDoc.phases) with their names; only a run whose conductor it doesn't know has none.
const phaseName = (flow) => flow.phases.find((p) => p.key === flow.phase)?.name ?? capital(flow.phase);

// Stands in for FlowRunSummary.status, which the index derives; here only `now:` and `phase:` are known.
function status(flow) {
  if (flow.phase === "done") return "Done";
  if ((flow.now ?? "").startsWith("Waiting for you")) return "Waiting";
  return "Idle";
}
const STATUS_LABEL = { Waiting: "Waiting on you", Working: "Working", Idle: "Idle", Stale: "Stale", Done: "Done" };

// The rail names a state only when it is the exception.
const MARK = { Building: "Now", Review: "Review", Waiting: "Needs you" };
function taskState(t) {
  if (!t) return { cls: "NotStarted", text: "Not started" };
  if (t.state === "Done") return { cls: "Done", text: t.fix_rounds ? `Done after ${plural(t.fix_rounds, "fix round")}` : "Done" };
  if (t.state === "Review") return { cls: "Review", text: t.fix_rounds ? `In review, fix round ${t.fix_rounds + 1}` : "In review" };
  return { cls: t.state, text: { Building: "Being built", Waiting: "Waiting on you", NotStarted: "Not started" }[t.state] };
}

// ---------- routing: #build/<n>, #decisions/<dev|dec|rul>-<i>, #docs/<Spec|Plan|Flow> ----------

const TABS = [["build", "Build"], ["decisions", "Decisions"], ["docs", "Docs"]];
const DOCS = [["Spec", "Spec", "spec.md"], ["Plan", "Plan", "plan.md"], ["Flow", "Flow", "flow.md"]];
const tasks = () => (DATA.plan?.tasks ?? []).map((p) => ({ p, t: DATA.ledger?.tasks.find((x) => x.id === p.id) }));
function defaultTask() {
  const all = tasks();
  return (all.find((x) => x.t && x.t.state !== "Done" && x.t.state !== "NotStarted") ?? all.find((x) => x.t?.state !== "Done") ?? all[0])?.p.id ?? null;
}
function route() {
  const [tab, arg] = location.hash.slice(1).split("/");
  const r = { tab: TABS.some(([k]) => k === tab) ? tab : "build", doc: "Spec", task: null, item: arg ?? null };
  if (r.tab === "docs") r.doc = DOCS.some(([k]) => k === arg) ? arg : "Spec";
  if (r.tab === "build") r.task = tasks().some((x) => x.p.id === arg) ? arg : defaultTask();
  return r;
}

function render() {
  const { flow } = DATA;
  if (!flow) {
    $("content").innerHTML = `<div class="error" role="alert"><h2>This run can't be shown.</h2><p>Its flow.md data is ${flow === undefined ? "not valid JSON" : "missing"}.</p><p>Run the dump test to write it: <code>cargo test -p flow-cockpit-core --test dump_this_run -- --ignored</code>.</p></div>`;
    return;
  }
  const r = route();
  const st = status(flow);
  $("run-name").textContent = plainText((flow.title ?? "Untitled run").replace(/:\s*flow$/i, ""));
  $("tabs").innerHTML = TABS.map(([k, label]) => `<button type="button" role="tab" class="tab" id="tab-${k}" aria-selected="${k === r.tab}" aria-controls="content" data-tab="${k}">${label}</button>`).join("");
  $("tabs").querySelectorAll(".tab").forEach((b) => (b.onclick = () => { location.hash = b.dataset.tab; }));
  $("content").setAttribute("aria-labelledby", `tab-${r.tab}`);
  const kind = flow.flow ? `${capital(flow.flow)} flow` : "Flow run";
  $("where").innerHTML = `${esc(kind)}${flow.phase ? `, in ${esc(phaseName(flow))}` : ""}<span class="status st-${st}">${STATUS_LABEL[st]}</span>`;
  if (r.tab === "build") build(flow, r.task, st);
  if (r.tab === "decisions") decisions(flow, r.item);
  if (r.tab === "docs") docsTab(flow, r.doc);
}

// ---------- Build: phases and tasks on the left, the selected task as the one focal point ----------

function build(flow, n, st) {
  $("left").setAttribute("aria-label", "Phases and tasks");
  $("left").innerHTML = `<section class="group" aria-label="Phases">${track(flow)}</section>${taskList(n)}`;
  wireTrack($("left"), flow);
  const all = tasks();
  $("content").innerHTML = `${nowBlock(flow, st, all)}${taskView(all, n)}`;
  if (graphable(all) && all.some((x) => x.p.id === n)) drawGraph(all, n);
  diagrams($("content"));
}

function nowBlock(flow, st, all) {
  const done = all.filter((x) => x.t?.state === "Done").length;
  const sentence = flow.now ?? (flow.phase ? `In ${phaseName(flow)}. This run doesn't say what comes next.` : "This run doesn't say where it stands.");
  const L = DATA.ledger;
  const rounds = L ? L.tasks.reduce((a, t) => a + t.fix_rounds, 0) : 0;
  const sec = L ? L.tasks.reduce((a, t) => a + t.security.length, 0) : 0;
  const open = flow.deviations.filter((d) => d.status === "Open").length;
  const summary = [
    L && all.length ? `${done} of ${all.length} tasks done.` : "",
    rounds ? `Reviews sent work back ${times(rounds)}.` : "",
    sec ? `${plural(sec, "security note")}.` : "",
    open ? `${plural(open, "deviation")} ${open === 1 ? "waits" : "wait"} for you.` : "No deviation is open.",
  ].filter(Boolean).join(" ");
  return `<section class="now ${st === "Waiting" ? "waiting" : ""}" aria-label="Where this run stands">
    <p class="sentence">${inline(sentence)}</p><p class="summary">${esc(summary)}</p></section>`;
}

function track(flow) {
  const phases = flow.phases;
  const gates = flow.gates;
  const passed = gates.filter((g) => g.approved);
  const dates = [...new Set(passed.map((g) => g.approved))];
  const gateLine = !gates.length ? ""
    : passed.length === gates.length ? `${gates.length === 2 ? "Both gates" : gates.length === 1 ? "The gate" : `All ${gates.length} gates`} passed${dates.length === 1 ? ` ${day(dates[0])}` : ""}.`
    : `${list(gates.filter((g) => !g.approved).map((g) => `gate ${g.n}`)).replace(/^./, (c) => c.toUpperCase())} ${gates.length - passed.length === 1 ? "is" : "are"} open.`;
  const gateRow = (g) => `<li><button type="button" class="row gate ${g.approved ? "passed" : "open"}" aria-expanded="false" data-gate="${g.n}">
      <span class="k num">G${g.n}</span><span class="ttl">Gate ${g.n}, ${esc(g.what)}</span><span class="mark">${g.approved ? `Passed ${day(g.approved)}` : "Open"}</span>
      <span class="gate-note" hidden></span></button></li>`;
  if (!phases.length) {
    return `<p class="track-text">${esc(flow.phase ? `${phaseName(flow)}. ` : "")}${esc(gateLine)}</p>${gates.length ? `<ol class="rows phase-list">${gates.map(gateRow).join("")}</ol>` : ""}`;
  }
  const now = phases.findIndex((p) => p.state === "Now");
  const at = now < 0 ? phases.length : now;
  const segs = [];
  const rows = [];
  phases.forEach((p, i) => {
    const cls = i < at ? "done" : i === at ? "current" : "";
    segs.push(`<span class="seg ${cls}"></span>`);
    rows.push(`<li class="row phase ${cls}" ${i === at ? 'aria-current="step"' : ""}><span class="k num">${i + 1}</span><span class="ttl">${p.name}</span><span class="mark">${i < at ? "Done" : i === at ? "Now" : ""}</span></li>`);
    if (p.gate_after != null) {
      const gn = p.gate_after;
      const g = gates.find((x) => x.n === gn);
      segs.push(`<span class="tick ${g?.approved ? "passed" : ""}"></span>`);
      rows.push(g ? gateRow(g) : `<li class="row gate open"><span class="k num">G${gn}</span><span class="ttl">Gate ${gn}</span><span class="mark">Not written</span></li>`);
    }
  });
  const where = flow.phase === "done" ? "Done, every phase passed." : `<b>${phaseName(flow)}</b>, phase ${at + 1} of ${phases.length}.`;
  return `<button type="button" class="track" aria-expanded="false" aria-controls="phase-list">
      <span class="segs" aria-hidden="true">${segs.join("")}</span>
      <span class="track-text">${where}</span></button>
    ${gateLine ? `<p class="track-gates">${esc(gateLine)}</p>` : ""}
    <ol class="rows phase-list" id="phase-list" hidden>${rows.join("")}</ol>`;
}

function wireTrack(root, flow) {
  const t = root.querySelector(".track");
  if (t) t.onclick = () => { const open = t.getAttribute("aria-expanded") === "true"; t.setAttribute("aria-expanded", String(!open)); $("phase-list").hidden = open; };
  root.querySelectorAll(".gate[data-gate]").forEach((b) => (b.onclick = () => {
    const open = b.getAttribute("aria-expanded") === "true";
    const note = b.querySelector(".gate-note");
    b.setAttribute("aria-expanded", String(!open));
    note.hidden = open;
    if (open || note.childElementCount) return;
    const g = flow.gates.find((x) => x.n === Number(b.dataset.gate));
    const verdict = g.approved
      ? `${capital(g.what)} on ${day(g.approved)}${g.reopened ? ", after it was reopened once and approved again" : ""}.`
      : `${capital(g.what)}: not yet${g.reopened ? "; it was reopened and waits for approval again" : ""}.`;
    note.innerHTML = `<span class="verdict">${esc(verdict)}</span><span class="rawline">${inline(g.raw.replace(/^[-*]\s+/, ""))}</span>`;
  }));
}

function taskList(n) {
  const all = tasks();
  if (!all.length) return `<section class="group" aria-labelledby="tk-h"><h2 class="group-h" id="tk-h">Tasks</h2><div class="empty"><p>No plan with tasks yet.</p><p>They show once plan.md holds <code>### Task &lt;n&gt;</code> headings.</p></div></section>`;
  const done = all.filter((x) => x.t?.state === "Done").length;
  const rows = all.map(({ p, t }) => {
    const state = t?.state ?? "NotStarted";
    // One mark at most: the state when it is the exception, else a count that carries meaning.
    let mark = "";
    if (MARK[state]) mark = `<span class="mark ${state}">${MARK[state]}</span>`;
    else if (t?.security.length) mark = `<span class="mark sec">${plural(t.security.length, "security note")}</span>`;
    else if (t?.fix_rounds) mark = `<span class="mark fix">${plural(t.fix_rounds, "fix")}</span>`;
    const label = `Task ${p.id}, ${plainText(p.title)}: ${taskState(t).text.toLowerCase()}`;
    return `<li><a class="row ${state === "Done" ? "done" : ""}" href="#build/${p.id}" title="${esc(label)}" ${n === p.id ? 'aria-current="true"' : ""}>
      <span class="k num">${p.id}</span><span class="ttl">${inline(p.title)}</span>${mark}</a></li>`;
  }).join("");
  return `<section class="group" aria-labelledby="tk-h"><h2 class="group-h" id="tk-h"><span>Tasks</span><span class="aside">${DATA.ledger ? `${done} of ${all.length} done` : "Not started in this checkout"}</span></h2><ol class="rows">${rows}</ol></section>`;
}

// What happened, in sentences built from typed fields only; the build log's own lines are one click away.
function happened(t) {
  if (!t) return "Nothing has happened on this task yet.";
  const by = t.model ? ` by ${t.model}` : "";
  const sent = t.fix_rounds ? `review sent it back ${times(t.fix_rounds)}` : "";
  let s;
  if (t.state === "Done") s = `Built${by}${sent ? `; ${sent}, and the fix ${t.fix_rounds === 1 ? "round" : "rounds"} closed every finding` : " and approved in the first review"}.`;
  else if (t.state === "Review") s = `Built${by} and now in review${sent ? `; ${sent} so far` : ""}.`;
  else if (t.state === "Waiting") s = `Built${by}, and waiting for your decision before it goes on.`;
  else if (t.state === "Building") s = `Being built${by}${sent ? `; ${sent} so far` : ""}.`;
  else s = "Nothing has happened on this task yet.";
  return s;
}

function taskView(all, n) {
  const x = all.find((y) => y.p.id === n);
  if (!x) return `<div class="empty"><p>This run has no plan with tasks yet.</p><p>Task cards show once plan.md holds <code>### Task &lt;n&gt;</code> headings.</p></div>`;
  const { p, t } = x;
  const st = taskState(t);
  const facts = [];
  if (p.depends_on?.length) facts.push(`Needs ${list(p.depends_on.map((d) => `task ${d}`))} first.`);
  else if (p.depends_on) facts.push("Needs nothing else first.");
  const after = all.filter((y) => y.p.depends_on?.includes(p.id)).map((y) => `task ${y.p.id}`);
  if (after.length) facts.push(`${capital(list(after))} ${after.length === 1 ? "waits" : "wait"} for it.`);
  const items = (xs, f = (s) => s) => xs.map((s) => `<li>${inline(capital(f(s)))}</li>`).join("");
  const sec = t?.security.length ? `<p class="sec">${capital(plural(t.security.length, "security note"))} came up in review.</p>` : "";
  // Short content shows as it is; longer content folds behind a row in the page's own style.
  const shown = (xs, tag, f) => `<${tag} class="items">${items(xs, f)}</${tag}>`;
  const fold = (label, count, body) => `<details class="unfold"><summary><span>${label}</span><span class="count">${count}</span></summary><div class="unfold-body">${body}</div></details>`;
  const log = t?.story.length ? (t.story.length <= 2 ? shown(t.story, "ol") : fold("Build log", plural(t.story.length, "entry", "entries"), shown(t.story, "ol"))) : "";
  const later = t?.later.length ? (t.later.length <= 3 ? shown(t.later, "ul") : fold("As the reviews wrote them", plural(t.later.length, "small issue"), shown(t.later, "ul"))) : "";
  return `<article class="task" aria-labelledby="task-title">
    <div>
      <div class="task-h"><h2 id="task-title"><span class="n num">${p.id}</span>${inline(p.title)}</h2><span class="state ${st.cls}">${st.text}</span></div>
      ${p.does ? `<p class="does">${inline(p.does)}</p>` : `<p class="does quiet">The plan doesn't say what this task does.</p>`}
      ${facts.length ? `<p class="facts">${facts.join(" ")}</p>` : ""}
      <section class="part" aria-labelledby="hap-h"><h3 class="part-h" id="hap-h">What happened</h3><p>${esc(happened(t))}</p>${sec}${log}</section>
      ${t?.later.length ? `<section class="part" aria-labelledby="later-h"><h3 class="part-h" id="later-h">Left for later</h3>${later}</section>` : ""}
      <section class="part" aria-labelledby="plan-h"><h3 class="part-h" id="plan-h">In the plan</h3>${fold("Files, steps and tests", "", `<div class="md">${md(p.markdown)}</div>`)}</section>
    </div>
    ${graphable(all) ? `<section class="where-graph" aria-labelledby="graph-h"><h3 class="visually-hidden" id="graph-h">Where it sits in the plan</h3>
      <p class="key"><span class="k-done">Done</span>, <span class="k-now">being built</span>, <span class="k-wait">waiting on you</span>, not started; ringed is this task.</p>
      <div class="graph" id="graph"><p class="quiet">Drawing the graph…</p></div></section>` : ""}
  </article>`;
}

const graphable = (all) => all.length > 0 && all.every((x) => Array.isArray(x.p.depends_on));
async function drawGraph(all, selected) {
  const box = $("graph");
  const kind = (t) => !t ? "todo" : t.state === "Done" ? "done" : t.state === "Waiting" ? "wait" : t.state === "NotStarted" ? "todo" : "busy";
  const fill = (v) => `fill:${css("--color-paper-2")},stroke:${css(v)},color:${css("--color-ink-2")}`;
  const lines = ["flowchart LR"];
  // Numbers only, so the whole graph reads at full size; the titles are in the rail and on each node's tooltip.
  for (const { p } of all) lines.push(`  T${p.id}(("${p.id}"))`);
  for (const { p } of all) for (const d of p.depends_on) lines.push(`  T${d} --> T${p.id}`);
  for (const k of ["done", "busy", "wait", "todo"]) {
    const ids = all.filter((x) => kind(x.t) === k).map((x) => `T${x.p.id}`);
    if (ids.length) lines.push(`  class ${ids.join(",")} ${k}`);
  }
  lines.push(`  classDef done ${fill("--color-done")}`, `  classDef busy ${fill("--color-current")}`,
    `  classDef wait ${fill("--color-accent")}`, `  classDef todo fill:${css("--color-paper")},stroke:${css("--color-paper-4")},color:${css("--color-muted")}`,
    `  style T${selected} fill:${css("--color-paper-4")},stroke-width:3px,color:${css("--color-ink")}`);
  try {
    const { svg } = await mermaid.render("task-graph", lines.join("\n"));
    box.innerHTML = svg;
    box.querySelectorAll("g.node").forEach((g) => {
      const n = /T(\d+[a-z]?)/.exec(g.id)?.[1];
      if (!n) return;
      const x = all.find((y) => y.p.id === n);
      const words = `Task ${n}, ${plainText(x.p.title)}: ${taskState(x.t).text.toLowerCase()}`;
      g.setAttribute("tabindex", "0");
      g.setAttribute("role", "link");
      g.setAttribute("aria-label", words);
      const tip = document.createElementNS("http://www.w3.org/2000/svg", "title");
      tip.textContent = words;
      g.prepend(tip);
      const go = () => { location.hash = `build/${n}`; };
      g.addEventListener("click", go);
      g.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
    });
  } catch (err) {
    box.innerHTML = `<div class="error" role="alert"><h2>The graph couldn't be drawn.</h2><p>${esc(err?.message ?? err)}</p></div>`;
  }
}

// ---------- Decisions: deviations on the left, open first; decisions as rows that open to their reasons ----------

function deviationList(flow) {
  if (!flow.deviations.length) return `<div class="empty"><p>No deviations so far.</p><p>The plan has held.</p></div>`;
  const order = (d) => d.status === "Open" ? 0 : d.status === "Unknown" ? 2 : 1;
  return `<ol class="devs">${[...flow.deviations].sort((a, b) => order(a) - order(b)).map((d) => {
    const s = d.status;
    const v = s === "Open" ? "Open, needs your decision" : s === "Unknown" ? "No status line" : `Decided${s.Decided.date ? ` ${day(s.Decided.date)}` : ""}`;
    const what = s !== "Open" && s !== "Unknown" ? `<p class="what">${inline(capital(s.Decided.what))}.</p>` : "";
    return `<li><details class="dev ${s === "Open" ? "open" : ""}"><summary>${inline(d.title)}<span class="v">${v}</span></summary>
      <div class="dev-body">${what}${d.body ? `<div class="md">${md(d.body)}</div>` : ""}</div></details></li>`;
  }).join("")}</ol>`;
}

// Every item of the Decisions tab, in list order: open deviations, decided ones, decisions, then the build's calls.
function decisionItems(flow) {
  const devs = flow.deviations.map((d, i) => ({ id: `dev-${i}`, kind: "dev", d }));
  const rank = (x) => x.d.status === "Open" ? 0 : x.d.status === "Unknown" ? 2 : 1;
  return {
    devs: devs.sort((a, b) => rank(a) - rank(b)),
    decs: flow.decisions.map((d, i) => ({ id: `dec-${i}`, kind: "dec", d })),
    rules: flow.rulings.map((d, i) => ({ id: `rul-${i}`, kind: "rul", d })),
  };
}

let focusListAfterRender = false;
function decisions(flow, wanted) {
  const { devs, decs, rules } = decisionItems(flow);
  const all = [...devs, ...decs, ...rules];
  const selected = all.find((x) => x.id === wanted) ?? devs.find((x) => x.d.status === "Open") ?? decs[0] ?? all[0];
  const row = (x, title, mark, cls = "") => `<li><a class="row plain ${cls}" href="#decisions/${x.id}" data-item="${x.id}" title="${esc(plainText(title))}" ${x === selected ? 'aria-current="true"' : ""}>
      <span class="ttl">${esc(capital(plainText(title)))}</span>${mark}</a></li>`;
  const open = devs.filter((x) => x.d.status === "Open").length;
  const unpicked = decs.filter((x) => !x.d.picked).length;
  $("left").setAttribute("aria-label", "Deviations, decisions and the build's own calls");
  $("left").innerHTML = `
    <section class="group" aria-labelledby="dev-h"><h2 class="group-h" id="dev-h"><span>Deviations</span><span class="aside">${open ? `${open} open` : "None open"}</span></h2>
      ${devs.length ? `<ol class="rows">${devs.map((x) => {
        const s = x.d.status;
        if (s === "Open") return row(x, x.d.title, `<span class="mark">Open</span>`, "open-dev");
        const date = s !== "Unknown" && s.Decided.date ? day(s.Decided.date) : "";
        return row(x, x.d.title, `<span class="mark">${date}</span>`, "quiet-row");
      }).join("")}</ol>` : `<p class="quiet">None so far. The plan has held.</p>`}</section>
    <section class="group" aria-labelledby="dec-h"><h2 class="group-h" id="dec-h"><span>Decisions</span><span class="aside">${unpicked ? `${unpicked} not picked` : plural(decs.length, "decision")}</span></h2>
      ${decs.length ? `<ol class="rows">${decs.map((x) => row(x, x.d.title, x.d.picked ? "" : `<span class="mark Open">Not picked</span>`)).join("")}</ol>` : `<p class="quiet">None recorded yet.</p>`}</section>
    ${rules.length ? `<section class="group" aria-labelledby="rul-h"><h2 class="group-h" id="rul-h"><span>Calls the build made</span><span class="aside">${rules.length}</span></h2>
      <ol class="rows">${rules.map((x) => row(x, x.d.call, x.d.scope ? `<span class="mark">${esc(x.d.scope)}</span>` : "", "quiet-row")).join("")}</ol></section>` : ""}`;
  $("content").innerHTML = selected ? `<article class="reading item" aria-labelledby="item-h">${itemDetail(selected)}</article>`
    : `<div class="reading empty"><p>No deviations, decisions or calls recorded yet.</p><p>They show once flow.md holds them under Options, Deviations and Rulings.</p></div>`;
  diagrams($("content"));
  if (focusListAfterRender) { focusListAfterRender = false; $("left").querySelector('[aria-current="true"]')?.focus(); }
}

function itemDetail(x) {
  const d = x.d;
  const part = (id, title, body) => `<section class="part" aria-labelledby="${id}"><h3 class="part-h" id="${id}">${title}</h3>${body}</section>`;
  if (x.kind === "dec") {
    return `<h2 class="item-h" id="item-h">${inline(d.title)}</h2><p class="item-meta">A decision in Options</p>
      <p class="item-lead">${d.picked ? `<span class="tag">Picked</span>${inline(capital(d.picked))}` : `<span class="tag open">Not picked yet</span>It waits for your choice.`}</p>
      ${d.body ? part("why-h", "Why, and what else was offered", `<div class="md">${md(d.body)}</div>`) : ""}`;
  }
  if (x.kind === "dev") {
    const s = d.status;
    const meta = s === "Open" ? `<span class="tag open">Open</span>It needs your decision before the build goes on.`
      : s === "Unknown" ? "Written before the format had a status line."
      : `<span class="tag">Decided${s.Decided.date ? ` ${day(s.Decided.date)}` : ""}</span>`;
    return `<h2 class="item-h" id="item-h">${inline(d.title)}</h2><p class="item-meta">${meta}</p>
      ${d.body ? part("hap-h", "What happened", `<div class="md">${md(d.body)}</div>`) : ""}
      ${s !== "Open" && s !== "Unknown" ? part("how-h", "How it was decided", `<p class="item-lead">${inline(capital(s.Decided.what))}.</p>`) : ""}`;
  }
  return `<h2 class="item-h" id="item-h">${inline(capital(d.call))}</h2>
    <p class="item-meta">A call the build made on its own${d.scope ? `, ${esc(d.scope)}` : ""}${d.date ? `, ${day(d.date)}` : ""}.</p>
    ${d.why ? part("why-h", "Why", `<div class="md">${md(`${capital(d.why).replace(/\.$/, "")}.`)}</div>`) : ""}
    ${d.cost ? part("cost-h", "If it was the wrong call", `<div class="md">${md(`It costs ${d.cost.replace(/\.$/, "")}.`)}</div>`) : ""}`;
}

// Up and down move through the Decisions list.
document.addEventListener("keydown", (e) => {
  if (route().tab !== "decisions" || (e.key !== "ArrowDown" && e.key !== "ArrowUp") || e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.target.closest?.("input, textarea, select, [contenteditable]")) return;
  const rows = [...$("left").querySelectorAll("a.row[data-item]")];
  if (!rows.length) return;
  const at = rows.findIndex((r) => r.getAttribute("aria-current") === "true");
  const next = rows[Math.min(rows.length - 1, Math.max(0, at + (e.key === "ArrowDown" ? 1 : -1)))];
  e.preventDefault();
  if (next === rows[at]) return next.focus();
  focusListAfterRender = true;
  location.hash = `decisions/${next.dataset.item}`;
});

// ---------- Docs: a reading view; the documents on the left, the chapters on the right ----------

function docsTab(flow, which) {
  $("content").innerHTML = `<div class="docs-layout"><article class="reading" id="doc"></article><nav class="chapters" id="chapters" aria-labelledby="toc-h"></nav></div>`;
  const box = $("doc");
  if (which === "Flow") {
    // flow.md through the enhancer: the parts the core recognised as UI, every other section as Markdown.
    box.innerHTML = `<h1 class="visually-hidden">${esc(flow.title ?? "flow.md")}</h1>` + flow.sections.map((s) => {
      const h = s.heading.toLowerCase();
      const body = h === "gates" ? `<ol class="rows">${flow.gates.map((g) => `<li class="row gate ${g.approved ? "passed" : "open"}"><span class="k num">G${g.n}</span><span class="ttl">Gate ${g.n}, ${esc(g.what)}</span><span class="mark">${g.approved ? `Passed ${day(g.approved)}` : "Open"}</span></li>`).join("")}</ol>`
        : h.startsWith("deviations") && flow.deviations.length ? deviationList(flow)
        : s.markdown ? `<div class="md">${md(s.markdown)}</div>` : `<p class="quiet">Nothing here yet.</p>`;
      return `<section class="doc-section"><h2>${inline(s.heading)}</h2>${body}</section>`;
    }).join("");
  } else {
    const text = DATA.docs?.[which];
    box.innerHTML = text ? `<div class="md">${md(text)}</div>` : `<div class="empty"><p>This run has no ${which.toLowerCase()}.md.</p></div>`;
  }
  const heads = [...box.querySelectorAll(which === "Flow" ? ".doc-section > h2" : ".md > h2, .md > h3")];
  heads.forEach((h, i) => { if (!h.id) h.id = `h-${i}`; });
  $("left").setAttribute("aria-label", "Documents");
  $("left").innerHTML = `<section class="group" aria-labelledby="docs-h"><h2 class="group-h" id="docs-h">Documents</h2>
      <ol class="rows">${DOCS.map(([k, label, file]) => `<li><a class="row plain" href="#docs/${k}" ${k === which ? 'aria-current="true"' : ""}><span class="ttl">${label}</span><span class="mark">${file}</span></a></li>`).join("")}</ol></section>`;
  const chapters = $("chapters");
  if (heads.length) {
    chapters.innerHTML = `<h2 class="group-h" id="toc-h">Chapters</h2>
      <ol class="toc">${heads.map((h) => `<li class="${h.tagName === "H3" ? "h3" : ""}"><a href="#docs/${which}" data-to="${h.id}">${esc(h.textContent)}</a></li>`).join("")}</ol>`;
    chapters.querySelectorAll("[data-to]").forEach((a) => (a.onclick = (e) => { e.preventDefault(); $(a.dataset.to).scrollIntoView({ block: "start" }); }));
  } else {
    chapters.remove();
  }
  diagrams(box);
}

// Mermaid blocks in any Markdown become diagrams; a block that fails stays as its source with the reason.
let diagramId = 0;
async function diagrams(root) {
  for (const code of root.querySelectorAll("pre > code.language-mermaid")) {
    const pre = code.parentElement;
    try {
      const { svg } = await mermaid.render(`diagram-${++diagramId}`, code.textContent);
      const fig = document.createElement("div");
      fig.className = "diagram";
      fig.innerHTML = svg;
      pre.replaceWith(fig);
    } catch (err) {
      const note = document.createElement("p");
      note.className = "quiet";
      note.textContent = `This diagram couldn't be drawn: ${err?.message ?? err}`;
      pre.after(note);
    }
  }
}

window.addEventListener("hashchange", () => { render(); $("content").scrollTo(0, 0); window.scrollTo(0, 0); });
render();
</script>
</body>
</html>
