──────────────────────────────────┘\n```\n\n- **Rail:** the \"Projects\" heading and the project rows, as now (selected row, same-name marks). Nothing else.\n- **Switch:** two tabs above the content, \"Flow runs\" and \"Loose sessions\", each with its count, styled like the run\n  view's tab bar (reuse its classes) and wired as a tablist (`role=\"tab\"`, `aria-selected`, `aria-controls`). The\n  pick lives in module state per project, like the other filters, and survives redraws. Left/right keys move between\n  the two tabs.\n- **Filter bar** (one row under the switch): Status, Conductor and Sort as native `\u003cselect>`s with an \"Any\" first\n  option (Sort has no \"Any\"; latest activity is the default), and the search field (keep `id=\"list-search\"`). Each\n  control has a visible label and a stable `id`/`data-keep` so focus and value survive redraws. Only the controls that\n  apply to the shown tab: Loose sessions shows only the search (and a sort if it has more than one order). Options\n  list only values present in the selected project, with counts, as the rail rows did; an option the new project lacks\n  is cleared (Task 8's M4 rule).\n- **Table:** a real `\u003ctable>` with `\u003cthead>` headings (`\u003cth scope=\"col\">`). Flow runs: Name, Conductor, Now or phase,\n  Gates, Tasks, Last activity, plus the exception mark where Task 8 shows it. Audits (under Flow runs): their own\n  table under the runs, with a heading and their columns (name/scope, picks and fixed or \"State unknown\", last\n  activity); not clickable, as now. Loose sessions: first prompt (one line, cut with an ellipsis), started, last\n  activity. A row opens its run or session as now: the whole row is clickable, and the name cell holds the real\n  `\u003cbutton>` so keyboard and screen readers get one control per row. Unfinished runs still stand out as in Task 8.\n- **Empty states:** a short sentence when a tab has no rows or the filters hide every row (\"No flow run matches these\n  filters.\").\n- Everything else Task 8 does stays: typed fields only (no format parsing), text nodes or `ctx.blocks.markdown` for\n  data text, no `innerHTML`, no timers or global listeners, `import type` only.\n\n- [ ] **Step 1: Write the failing tests** in `views.test.ts`: the rail holds only projects; the switch shows both tabs\n      with counts and switches the table; the filter bar's selects filter and sort (keep the existing filter and sort\n      tests' intent, moved to the selects); the tables have column headings; audits sit under Flow runs; loose\n      sessions only on their tab; the switch and filters survive a redraw (run the real runtime as Task 8's restore\n      tests do); an empty filter result shows the sentence.\n- [ ] **Step 2:** Run; expect FAIL.\n- [ ] **Step 3: Implement.**\n- [ ] **Step 4:** Views tests, runtime tests, both `tsc -p`, and `sloplint --scope app` over `tokens.css` as in Task 8.\n      Build the app and screenshot the real window under a private Xvfb, as in Task 8: the list on Flow runs, on Loose\n      sessions, and with a filter set, at 1880×930 and 1280×800. Also retake the run view's Build tab once to show it\n      is unchanged.\n- [ ] **Step 5:** Commit: `Give the list a projects rail, a switch between flow runs and loose sessions, a filter bar and tables.`","title":"The list view reworked to the user's layout"},{"depends_on":["8b"],"does":"Moves the four built-in views out of the binary into extensions the app loads from disk: default extensions that ship with the app, the user's own next to them, each one switchable off in `config.toml`. The app runs on its own; nothing about views depends on the Claude Code plugin.","id":"8c","markdown":"**Does:** Moves the four built-in views out of the binary into extensions the app loads from disk: default extensions\nthat ship with the app, the user's own next to them, each one switchable off in `config.toml`. The app runs on its\nown; nothing about views depends on the Claude Code plugin.\n**Depends on:** Task 8b\n**Added:** 2026-10-29, by the user's decision \"Built-in views are compiled into the app\".\n\n**Files:**\n\n- Move: `crates/flow-cockpit/app/views/builtin/{list,run,docs,activity}.ts` →\n  `crates/flow-cockpit/extensions/\u003cname>/\u003cname>.ts`; the tests and fixtures (`views.test.ts`, `fixtures/`) move to a\n  place that is not shipped (e.g. `crates/flow-cockpit/extensions/tests/`, which the app and the Nix install skip\n  because it holds no view, or outside `extensions/`).\n- Modify: `app/src/views.rs` (load extensions from two folders, drop `include_dir!` for views), `app/src/main.rs`\n  (folders, CLI), `app/src/paths.rs` (the default folder), `app/src/poll.rs` (watch both folders and `config.toml`),\n  `app/src/commands.rs` (if `view_source`'s `builtin` flag changes meaning), `core/src/index/config.rs` (`disabled`),\n  `app/shell/runtime.js` and `runtime.test.mjs` (an extension's `style.css`; the fallback from a broken replacement),\n  `app/shell/api.d.ts`, `app/views/tsconfig.json` (or its replacement), `flake.nix` (install the defaults; app tests\n  that need them), `.github/workflows/flow-cockpit.yml` (test paths), `plugins/opt-in/flow-cockpit/skills/views/SKILL.md`,\n  `plugins/opt-in/flow-cockpit/README.md`, `CLAUDE.md` (layout, checks, vendored note if paths move), `treefmt`/flake\n  excludes if paths move.\n\n**Shape:**\n\n- **An extension is a folder, no manifest:** `extensions/\u003cname>/` holds one or more view `.ts` files and an optional\n  `style.css`. The folder name is the extension's id; each view still declares its own `id`, `slot` and `title`.\n- **Defaults ship with the app:** list, run, docs, activity. Nix installs them at `$out/share/flow-cockpit/extensions/`.\n  (Windows: Task 13 ships them next to the exe; this task only resolves the folder.)\n- **The user's own** live in `\u003cconfig dir>/flow-cockpit/extensions/` (`~/.config/...`, following `config_dir` in\n  `paths.rs`). A user extension with a default's name replaces that whole default.\n- **All loaded from disk and reloaded live** when any file in either folder changes.\n- **Switching off:** `disabled = [\"\u003cname>\", …]` in `config.toml`, read live (a change to `config.toml` takes effect\n  without a restart, for `hidden` too). The window stays read-only: it never writes anything.\n- **The Claude Code plugin** keeps only the views skill and the capture hooks.\n- **Default folder lookup, in order:** `FLOW_COCKPIT_EXTENSIONS` (a dev override: one folder, e.g. this repo's\n  `crates/flow-cockpit/extensions`, so edits show live without a rebuild); then `\u003cexe dir>/../share/flow-cockpit/extensions`\n  (Nix and Linux installs); then `\u003cexe dir>/extensions` (Windows, Task 13). The first that exists wins. None found: the\n  window draws a plain note naming where it looked; it never crashes. Unit-test the lookup with a fake env and folders.\n- **Type imports:** views import their types from one bare module name, `import type { … } from 'flow-cockpit'`, not\n  relative paths. In the repo a tsconfig `paths` entry maps it to the shell's `api.d.ts` and the bindings; for users,\n  `flow-cockpit --print-types` declares `module 'flow-cockpit'` so a user extension (or a copied default)\n  type-checks next to `flow-cockpit.d.ts` with no import to change. Type-only imports are stripped at load, as now.\n- **CLI:** `--print-view` goes (copying a default is copying its folder). Add `--print-paths`, printing the default\n  extensions folder in use, the user extensions folder and `config.toml`'s path, one per line with a label. Keep\n  `--version` and `--print-types`.\n- **The old `\u003cconfig>/flow-cockpit/views/` folder** is no longer read; the README says so once.\n- **`style.css`:** the runtime adds it as one `\u003cstyle>` for the extension when its views load and removes it when the\n  extension is reloaded, disabled or removed. Scoping stays the author's job (under `section[data-view=\u003cid>]`).\n- **A broken user replacement** still shows its error with the default drawn below it, as Task 7 does.\n- **Two extensions declaring the same view id:** the user's wins over a default; two in the same folder is a load\n  error card naming both.\n- **Disabling a default the window needs** (`list`, `run`): its slot shows a plain note (\"The list extension is\n  switched off in config.toml.\"), never a blank window.\n\n- [ ] **Step 1: Write the failing tests** (Rust unit tests in `views.rs`/`paths.rs`/`config.rs`, jsdom in\n      `runtime.test.mjs`): default folder lookup order; a user extension replaces a default by folder name; `disabled`\n      removes an extension's views; a `config.toml` change re-reads `disabled` and `hidden` (poll emits the right\n      events); a change in either extension folder emits `views-changed`; `style.css` is added once and removed on\n      disable; a disabled `list` draws the note; duplicate view ids; `--print-types` declares `module 'flow-cockpit'`;\n      `--print-paths` output; the Nix-installed tree holds the four defaults and no tests or fixtures (a check in the\n      flake or CI).\n- [ ] **Step 2:** Run; expect FAIL.\n- [ ] **Step 3: Implement**, move the files with `git mv` so history follows, update the skill (folders, extension\n      shape, `disabled`, `--print-paths`, the bare `flow-cockpit` import, copying a default to change it), README and\n      CLAUDE.md.\n- [ ] **Step 4:** Core and app tests, clippy `-D warnings`, views and runtime tests, both type checks,\n      `nix develop -c npm test`, `nix build .#flow-cockpit && ./result/bin/flow-cockpit --print-paths`. Real window\n      under a private Xvfb: the Nix build shows the list and a run as before; with `disabled = [\"activity\"]` added\n      while it runs, the Activity tab goes away without a restart; with `FLOW_COCKPIT_EXTENSIONS` pointing at the repo,\n      an edit to `list.ts` shows live.\n- [ ] **Step 5:** Commit: `Ship the views as the app's own extensions, loaded from disk and switchable off in config.toml.`","title":"The app's own extensions"},{"depends_on":["8f"],"does":"Lets a plan carry tasks added during the build under lettered numbers (`5b`, `8c`), reads them in the core, and shows them in the run view in their place, so the Build tab shows where the build really is.","id":"8d","markdown":"**Does:** Lets a plan carry tasks added during the build under lettered numbers (`5b`, `8c`), reads them in the core,\nand shows them in the run view in their place, so the Build tab shows where the build really is.\n**Depends on:** Task 8f\n**Added:** 2026-10-29, by the user's decision \"Tasks added during a build don't show\".\n\n**Files:**\n\n- `crates/flow-cockpit/core/src/doc/plan.rs`, `doc/ledger.rs`, `doc/flow.rs` (wherever a task number is read),\n  `core/src/index/*` (wherever task numbers are compared, counted or sorted), `core/tests/docs.rs`, `core/tests/index.rs`,\n  the core's fixture docs (invented text), `crates/flow-cockpit/bindings/` (regenerated).\n- `crates/flow-cockpit/extensions/run/run.ts` (and any other extension that uses task numbers), its tests and\n  fixtures (re-dump with `dump_view_fixtures`), the design JSON only if a test reads it.\n- `docs/features/flow-observability/plan.md`: Tasks 5b, 8b, 8c, 8d, 8e, 8f and 8g, each placed right after the task it\n  follows, with an `**Added:**` line naming the decision.\n- `plugins/flows/references/flow-rules.md`: one short rule on how a task added during a build is numbered and placed.\n  `scripts/flows-uses.mjs` (`checkTemplates`, `checkOverrides`) still passes.\n\n**Shape:**\n\n- A task id is a string: digits, then optionally one lowercase letter (`8`, `8b`). Order: by number, then the plain\n  task before its lettered ones, letters in order (`8 \u003c 8b \u003c 8c \u003c 9`). Anything else in a heading stays unread (never\n  a panic).\n- `PlanTask` and `LedgerTask` carry the id as a string (`id`); `depends_on` becomes a list of ids. Ledger lines\n  `Task 8b: …` and `Tasks 3-5: …` (ranges stay plain numbers) parse. Counts (\"10 of 13 done\") include lettered tasks.\n- The run view shows lettered tasks in order in the rail, the card and the graph (graph node ids stay valid Mermaid\n  ids, e.g. `T8b`); the card follows the task being built.\n\n- [ ] **Step 1: Write the failing tests:** core parses `### Task 8b: …` with `**Depends on:** Task 8, Task 5b`; ledger\n      `Task 8b: dispatched …` and a fix round on `8b`; ordering `8 \u003c 8b \u003c 8c \u003c 9`; an index test where the build is on\n      a lettered task and the run's current task is it; `parses_every_flow_md_in_repo` and this plan parse with 20\n      tasks; the run view draws a lettered task in the rail and the graph.\n- [ ] **Step 2:** Run; expect FAIL.\n- [ ] **Step 3: Implement**; add the added tasks to this plan; the rule to flow-rules.md; regenerate bindings;\n      re-dump the view fixtures.\n- [ ] **Step 4:** Core and app tests, clippy `-D warnings`, jsdom, both type checks, `nix develop -c npm test`; the\n      real window under Xvfb on this repo's run: the Build tab lists 20 tasks with 5b and 8b–8g in place.\n- [ ] **Step 5:** Commit: `Read lettered tasks added during a build and show them in their place.`","title":"Tasks added during a build show in the cockpit"},{"depends_on":["8c","8d"],"does":"The window gets page history: the mouse's back and forward side buttons move between the pages visited, and a reload (F5 or Ctrl+R) reopens the page it was on. A fresh start still opens the list. Nothing is written to disk.","id":"8e","markdown":"**Does:** The window gets page history: the mouse's back and forward side buttons move between the pages visited, and a\nreload (F5 or Ctrl+R) reopens the page it was on. A fresh start still opens the list. Nothing is written to disk.\n**Depends on:** Task 8c, Task 8d\n**Added:** 2026-10-29, by the user's decision \"No way back, and a reload loses the page\".\n\n**Files:**\n\n- Modify: `crates/flow-cockpit/app/shell/runtime.js`, `crates/flow-cockpit/app/shell/runtime.test.mjs`,\n  `crates/flow-cockpit/app/shell/api.d.ts` (only if a documented behaviour of `ctx.navigate` or `ctx.route` changes),\n  `plugins/opt-in/flow-cockpit/skills/views/SKILL.md` (one line: navigation is history; views keep using\n  `ctx.navigate`).\n- No view file should need to change; if one does, the report says why.\n\n**Shape:**\n\n- The current route is written to `location.hash` in one stable, readable form (for example `#/run/\u003cproject>/\u003cslug>`\n  with the run tab as a further part, `#/session/\u003cproject>/\u003cid>`, `#/doc/…`), each part URI-encoded. Every\n  `ctx.navigate` to a different route pushes one history entry; a same-route redraw (`changed`) pushes nothing.\n  Switching run tabs is a navigation (one entry), so back returns to the previous tab.\n- `popstate`/`hashchange` draw the route from the hash, through the same draw path `navigate` uses (no second path).\n  The per-route restore of scroll, folds and focus works as it does for a same-route redraw where it can; module state\n  in views is unaffected.\n- **Start:** a valid hash opens that route; an empty, malformed or unknown hash opens the list and replaces the hash\n  (`history.replaceState`, no extra entry). A route whose project, run or session no longer exists draws the view's\n  normal \"not found\" state, or the list if the view has none; never a blank window or a thrown error.\n- **Mouse:** the side buttons (`MouseEvent.button` 3 = back, 4 = forward) call `history.back()`/`history.forward()`.\n  If WebKitGTK already does this by itself, no second handler is added (that would move two steps). The listener\n  lives in the shell, not in views, registered once.\n- No top-bar buttons, no key bindings.\n\n- [ ] **Step 1: Write the failing tests** in `runtime.test.mjs` (jsdom): navigate writes the hash and one history\n      entry; a same-route redraw writes none; back (`history.back()` then the event) draws the previous route; a\n      start with a valid hash opens it; a malformed or unknown hash opens the list and replaces the hash; a run tab\n      switch is one entry; hash round-trips for every route kind with awkward ids (spaces, `/`, `#`, unicode); a mouse\n      side-button `mouseup`/`auxclick` (whichever is used) calls back/forward once.\n- [ ] **Step 2:** Run; expect FAIL.\n- [ ] **Step 3: Implement.**\n- [ ] **Step 4:** Runtime and views tests, both `tsc -p`, `nix develop -c npm test` from the root. In the real window\n      under a private Xvfb: open a run, switch to Docs, press F5 and check it stays on Docs; send mouse button 8/9\n      (X11's back/forward) and check it went back. The report says what WebKitGTK did on its own.\n- [ ] **Step 5:** Commit: `Keep the page in the window's address so the mouse's back and forward buttons and a reload work.`","title":"Back, forward and reload keep the page"},{"depends_on":["8c"],"does":"Makes the Activity tab and a session's own screen open fast and stay responsive while a long session runs: the core reads a transcript incrementally, the window gets the newest turns first, and tool inputs load on demand.","id":"8f","markdown":"**Does:** Makes the Activity tab and a session's own screen open fast and stay responsive while a long session runs:\nthe core reads a transcript incrementally, the window gets the newest turns first, and tool inputs load on demand.\n**Depends on:** Task 8c\n**Added:** 2026-10-29, by the user's decision \"Activity freezes on a large running session\".\n\n**Files:**\n\n- `core/src/activity*` / `core/src/index/*` (incremental reader and cache), `core/tests/*` (new tests, invented\n  fixtures only), `app/src/commands.rs` (paging and tool-input commands), `app/src/poll.rs` if the cache needs a hook,\n  bindings (regenerated), `app/shell/api.d.ts` and `runtime.js` (the new `DataApi` calls), `runtime.test.mjs`,\n  `crates/flow-cockpit/extensions/activity/activity.ts` and its tests/fixtures, the views skill (the new calls),\n  CLAUDE.md only if a layout line changes.\n\n**Shape:**\n\n- **Measure first:** an ignored core test or small example (e.g. `core/tests/activity_timing.rs`, `#[ignore]`) takes a\n  transcript path from an env var (`FLOW_COCKPIT_TIMING`), times `session()` (cold), times a second call after\n  appending one line to a copy (the live tick), and reports the serialised JSON size of what the window receives. Run\n  on a scratch copy of a large session before any code change and at the end; only numbers are recorded, never\n  transcript text.\n- **Incremental reading:** a per-transcript cache (main and each subagent file) keyed by path, holding the byte offset\n  read so far and the parsed state, so a grown file parses only its new bytes. A file that shrank or was replaced\n  (size smaller, or different inode/mtime pattern) is re-read from the start. A partial last line (no newline yet)\n  is left for the next read. Reading happens outside the index lock: take what the session needs (paths) under the\n  lock, release it, then read. Bound the cache (e.g. keep the few most recent sessions) so memory doesn't grow with\n  every session opened.\n- **Paging:** `DataApi.session(id, { before?: number, limit?: number })` or a new call (documented in `api.d.ts`)\n  returns the newest `limit` (default 20) turns before a turn index, the total turn count, agents and live state.\n  Turn indexes count from the oldest turn so they stay stable as new turns arrive.\n- **Lazy tool input:** turns carry each tool call's name, a short summary line and an id, not its full input; a new\n  read-only call returns one tool call's input by session and tool-use id. The fold fetches it on open and shows a\n  short \"Loading…\" until it arrives; an error shows in the fold.\n- **The view:** draws the newest page; \"Show older turns\" (a real `\u003cbutton>`) appends the next page below; the pages\n  loaded stay loaded across `changed` redraws (module state per session), and a redraw fetches only the newest page\n  again and merges it. Open folds and scroll stay as before. A session with no more older turns has no button.\n- No view parses transcript text; no `innerHTML`; no timers or global listeners.\n\n- [ ] **Step 0: Baseline.** Write the timing test, run it, record the numbers (cold open, live tick, JSON size).\n- [ ] **Step 1: Write the failing tests:** incremental read equals a full read (fixture appended in pieces, including a\n      split last line); a shrunk/replaced file re-reads; reading doesn't hold the index lock; paging returns the newest\n      20, then the next 20, with stable indexes after a new turn; tool input fetched by id; the view draws 20 turns\n      and the button, loads more on click, keeps loaded pages across a redraw, fetches input on fold open.\n- [ ] **Step 2:** Run; expect FAIL.\n- [ ] **Step 3: Implement.**\n- [ ] **Step 4:** Core and app tests, clippy `-D warnings`, jsdom, both type checks, `nix develop -c npm test`; the\n      timing test again (numbers next to the baseline); the real window under Xvfb with a large session open in\n      Activity while it grows: the window keeps answering clicks.\n- [ ] **Step 5:** Commit: `Read transcripts incrementally and page Activity's turns so a large running session stays fast.`","title":"Activity stays fast on a large running session"},{"depends_on":["8e"],"does":"The window draws Mermaid diagrams ahead of time, in idle moments, so a page opens with its diagrams already drawn; a diagram not drawn yet shows a quiet placeholder instead of flashing its source text.","id":"8g","markdown":"**Does:** The window draws Mermaid diagrams ahead of time, in idle moments, so a page opens with its diagrams already\ndrawn; a diagram not drawn yet shows a quiet placeholder instead of flashing its source text.\n**Depends on:** Task 8e\n**Added:** 2026-10-29, by the user's decision \"Diagrams flash when a page first opens\".\n\n**Files:**\n\n- `crates/flow-cockpit/app/shell/blocks/mermaid.js`, `blocks/markdown.js` (only to expose the Mermaid sources of a\n  document from its own lexer), `runtime.js`, `runtime.test.mjs` (and a blocks test if one exists), `api.d.ts` (if\n  `ctx.blocks` gains a call), `tokens.css` (the placeholder), `crates/flow-cockpit/extensions/run/run.ts` and\n  `docs/docs.ts` only if they must hand sources over, the views skill (one line if views gain a call).\n\n**Shape:**\n\n- **Draw ahead, in idle time:** a small queue in the shell that draws one diagram at a time when the window is idle\n  (`requestIdleCallback`, or a `setTimeout(0)` chain where WebKitGTK lacks it; this lives in the shell, not in views,\n  so the views' no-timers rule is untouched), never more than one Mermaid render at once, and stops when the queue is\n  empty. A diagram a page needs now jumps the queue.\n- **What gets drawn ahead:** after the list draws, the task graph and the document diagrams (spec, plan, flow.md\n  Mermaid blocks) of the shown project's unfinished runs; when a run opens, the rest of that run's documents. Sources\n  come from typed data and the markdown block's own lexer; views do no format parsing. The task graph's source is\n  built the same way the run view builds it: one shared function, not a copy.\n- **Cache:** keyed by source text and the theme tokens it was drawn with; `KEEP` raised so a project's diagrams fit;\n  memory only, nothing on disk.\n- **Placeholder:** a diagram not drawn yet shows an empty, quiet box sized like the last drawing of that source if\n  known, else a modest default height, with `aria-busy=\"true\"`; the source shows only when drawing fails, with the\n  reason. No layout jump when a cached drawing exists.\n- Drawing ahead must not make the window stutter: measured in the real window, clicking around while the queue runs\n  stays responsive.\n\n- [ ] **Step 1: Write the failing tests** (jsdom with a fake `window.mermaid` that resolves after a delay and counts\n      calls): a page whose diagram was drawn ahead draws the SVG at once with no `\u003cpre>`; a not-yet-drawn diagram\n      shows the placeholder, not its source; a failed drawing shows the source and the reason; the queue renders one at\n      a time and stops when empty; a needed diagram jumps the queue; the same source isn't drawn twice.\n- [ ] **Step 2:** Run; expect FAIL.\n- [ ] **Step 3: Implement.**\n- [ ] **Step 4:** jsdom, both type checks, `nix develop -c npm test`; real window under Xvfb: open the list, wait a\n      few seconds, open a run's Build tab and its Docs right after the click: diagrams drawn, no flash.\n- [ ] **Step 5:** Commit: `Draw diagrams ahead in idle time so pages open without a flash.`","title":"Diagrams drawn ahead so pages don't flash"},{"depends_on":["8"],"does":"Makes slice 1 usable day to day: Claude can change views through a skill, Linux gets the app from the flake, and CI checks it.","id":"9","markdown":"**Does:** Makes slice 1 usable day to day: Claude can change views through a skill, Linux gets the app from the flake,\nand CI checks it.\n**Depends on:** Task 8\n\n**Files:**\n\n- Create: `plugins/opt-in/flow-cockpit/.claude-plugin/plugin.json` (md-pane's shape),\n  `plugins/opt-in/flow-cockpit/ skills/views/SKILL.md` (`name`, `description`), `plugins/opt-in/flow-cockpit/README.md`,\n  `.github/workflows/flow-cockpit.yml`\n- Modify: `.claude-plugin/marketplace.json` (entry after md-pane, `\"category\": \"development\"`),\n  `installer/core/plugins.test.ts:30-52`, `installer/core/options.ts` (`tools` page keys; `unavailable` hides\n  `flow-cockpit` on win32 until Task 13), `installer/core/options.test.ts`, `flake.nix` (package `flow-cockpit`:\n  `buildRustPackage`, `src = ./crates/flow-cockpit`, `buildAndTestSubdir = \"app\"`, version from\n  `(importTOML …).workspace.package.version`, `nativeBuildInputs = [pkg-config wrapGAppsHook3]`,\n  `buildInputs = [webkitgtk_4_1 gtk3 libsoup_3 librsvg]`, `checkFlags` skipping `poll_emits_once_per_change`, `poll_sees_folders_created_later` and\n  `first_paint_before_link_scan`; devShell gains those inputs), `README.md`, `CLAUDE.md` (Layout: three crates and the\n  plugin; Checks; CI)\n\n- [ ] **Step 1: Write the failing tests:** `opt-ins from the real manifests` lists `flow-cockpit`;\n      `flow-cockpit is unavailable on win32 for now` (`unavailable('flow-cockpit','win32','x64',…)` is a string).\n- [ ] **Step 2:** `npm test`; expect FAIL.\n- [ ] **Step 3:** Plugin, marketplace entry and skill: the folders and `config.toml`, the `View` interface, \"save\n      `flow-cockpit --print-types` as `flow-cockpit.d.ts` next to your views\", \"write `flow-cockpit --print-view \u003cid>`\n      into the global folder before changing a built-in; delete the copy to restore it\", `blocks.markdown` for any text\n      from data, never `innerHTML`, no network, only `import type`. Linux only until slice 2.\n- [ ] **Step 4:** Flake package and devShell; `flow-cockpit.yml` on PRs touching the crate or the plugin:\n      `cargo test -p flow-cockpit-core` and clippy on ubuntu and windows; on windows `cargo build -p flow-cockpit`; on both\n      `npm ci`, then the views tests (`node --test` on `app/shell/*.test.mjs` and `app/views/builtin/*.test.ts`) and\n      both `tsc -p` checks; on ubuntu `nix build .#flow-cockpit` with a Nix install action pinned by SHA like the\n      others.\n- [ ] **Step 5:** `npm test`, `nix build .#flow-cockpit && ./result/bin/flow-cockpit --version` PASS. In a session with\n      the plugin, ask Claude to add a view listing open deviations; it appears in the running window without a restart.\n- [ ] **Step 6:** Commit: `Ship slice 1 of the flow cockpit through Nix with a views skill.`\n- [ ] **Step 7: Slice checkpoint.** Stop. The user uses slice 1; record their go for slice 2 in flow.md under\n      Options (`### Slice 2`, `Picked: …`) before Task 10 starts.","title":"The plugin, the views skill, the Nix package and CI"},{"depends_on":["9"],"does":"Adds hooks that record what transcripts lack (questions, permission prompts, agents starting and stopping, turns ending) into a per-session capture file.","id":"10","markdown":"**Does:** Adds hooks that record what transcripts lack (questions, permission prompts, agents starting and stopping,\nturns ending) into a per-session capture file.\n**Depends on:** Task 9\n\n**Files:**\n\n- Create: `plugins/opt-in/flow-cockpit/hooks/hooks.json`, `hooks/capture.mjs` (stdin → `main`, like `notify.mjs`),\n  `hooks/lib.mjs`, `hooks/lib.test.mjs`\n- Modify: `package.json` and `flake.nix` `installer-test` (add `plugins/opt-in/flow-cockpit/hooks/*.test.mjs` to the\n  `node --test` globs and the `files` regex), `plugins/opt-in/flow-cockpit/README.md`\n\n**Interfaces:**\n\n- Produces (capture line, JSON, `v: 1`):\n  `{ v, ts, session, cwd, event, agent?, agent_type?, tool_use_id?, questions?, notification_type?, message?, permission_tool?, transcript?, agent_transcript? }`; `questions` from\n  AskUserQuestion input, cut at 16 KiB.\n- Produces: `export function captureDir(env, platform): string`, `export function toLine(input, now): string | null`,\n  `export function prune(dir, now, maxAgeDays = 30): void`, `export async function main({ stdin, env, platform, now })`.\n\n- [ ] **Step 1: Write the failing tests** (`node:test`): `toLine maps PreToolUse AskUserQuestion with tool_use_id`;\n      `toLine maps PermissionRequest without deciding` (no output); `toLine maps SubagentStart with agent_type`;\n      `toLine returns null for invalid JSON`; `captureDir follows XDG_STATE_HOME and LOCALAPPDATA` (Task 6's\n      `paths_match_capture_rules` cases); `prune deletes files older than 30 days only`;\n      `main exits 0 and prints nothing when the capture dir is a file` (ENOTDIR on both OSes); `parallel_appends_stay_whole` (20 spawned\n      writers × 50 lines with 16 KiB `questions`, JSON-escaped → every line parses).\n- [ ] **Step 2:** `node --test plugins/opt-in/flow-cockpit/hooks/lib.test.mjs`; expect FAIL.\n- [ ] **Step 3: Implement.** One `fs.appendFileSync` of the whole line per event; folder\n      `mkdirSync(…, { recursive: true, mode: 0o700 })`, file mode `0o600`; `main` swallows every error. `hooks.json`: SessionStart (also prunes),\n      SessionEnd, UserPromptSubmit, Stop, SubagentStart, SubagentStop, Notification, PermissionRequest, and PreToolUse,\n      PostToolUse, PostToolUseFailure with `\"matcher\": \"AskUserQuestion\"`; each\n      `{\"type\":\"command\",\"command\":\"node \\\"${CLAUDE_PLUGIN_ROOT}/hooks/capture.mjs\\\"\",\"async\":true}`.\n- [ ] **Step 4:** Tests and `npm test` PASS. One real session with `--plugin-dir`: an AskUserQuestion and a permission\n      prompt show in the capture file.\n- [ ] **Step 5:** Commit: `Capture questions, permission prompts and agents per Claude session.`","title":"Capture hooks"},{"depends_on":["10","4"],"does":"Makes a flow run show \"waiting on you\" while one of its sessions has an open question or permission prompt.","id":"11","markdown":"**Does:** Makes a flow run show \"waiting on you\" while one of its sessions has an open question or permission prompt.\n**Depends on:** Task 10, Task 4\n\n**Files:**\n\n- Create: `core/src/activity/capture.rs`, `core/tests/fixtures/capture/*.jsonl`\n- Modify: `core/src/activity/mod.rs` (`Live`), `core/src/index/{status,entries,mod}.rs` (read each linked session's\n  capture file), `core/src/bindings.rs` if a crossing type changes\n\n**Interfaces:**\n\n- Consumes: Task 10's line format.\n- Produces: `pub fn read_capture(path: &Path) -> Vec\u003cCaptureEvent>`; `pub fn live(events: &[CaptureEvent]) -> Live`\n  (`waiting`: the question, or the tool waiting for permission); `Status::Waiting` when any linked session's\n  `live.waiting` is set.\n\n- [ ] **Step 1: Write the failing tests:** `open_question_waits` (PreToolUse AskUserQuestion, no PostToolUse,\n      PostToolUseFailure or UserPromptSubmit after it); `answered_question_clears`; `permission_prompt_waits`;\n      `any_later_event_clears_permission` (a denial too: a later PreToolUse or Stop); `stop_without_start_is_ignored`;\n      `capture_ignores_partial_last_line`; `status_waiting_from_capture`.\n- [ ] **Step 2:** Run; expect FAIL.\n- [ ] **Step 3: Implement.**\n- [ ] **Step 4:** Tests and clippy PASS; with the plugin, a question in a running session turns its flow run to\n      \"Waiting on you\" within one poll (Task 6 already polls the capture folder).\n- [ ] **Step 5:** Commit: `Show waiting on you from the capture.`","title":"\"Waiting on you\" from the capture"},{"depends_on":["9"],"does":"Lets a repository carry its own views, loaded only when the user has trusted that repository.","id":"12","markdown":"**Does:** Lets a repository carry its own views, loaded only when the user has trusted that repository.\n**Depends on:** Task 9\n\n**Files:**\n\n- Modify: `app/src/views.rs` (a third root per trusted project root), `app/src/poll.rs` (poll those folders),\n  `plugins/opt-in/flow-cockpit/skills/views/SKILL.md`\n\n- [ ] **Step 1: Write the failing tests:** `trusted_repo_view_replaces_global` (lookup order: built-in, global,\n      trusted repository); `trust_matches_any_checkout_of_the_project`; `untrusted_repo_views_ignored` (passes before\n      this task too; kept as the guard).\n- [ ] **Step 2:** Run; expect the first two to FAIL.\n- [ ] **Step 3: Implement**, and add the `trusted` setting to the skill.\n- [ ] **Step 4:** Tests and clippy PASS.\n- [ ] **Step 5:** Commit: `Load a repository's own views once the user trusts it.`","title":"Repository views and trust"},{"depends_on":["9"],"does":"Lets the installer set the app up on Windows and print the pinned Nix command on Linux.","id":"13","markdown":"**Does:** Lets the installer set the app up on Windows and print the pinned Nix command on Linux.\n**Depends on:** Task 9\n\n**Files:**\n\n- Create: `.github/workflows/build-flow-cockpit.yml` (Windows only, `x86_64-pc-windows-msvc`, zip + `.sha256`,\n  `--version` smoke test through a pipe)\n- Modify: `.github/workflows/release.yml` (job, `needs`, notes line), `installer/core/binaries.ts` (`BIN_PLUGINS`\n  entries gain optional `targets: string[]` and `linuxHint: (version: string) => string`; `flow-cockpit` with\n  `key: 'appPath'`, `targets: ['win32-x64']`, `linuxHint` giving\n  `nix run github:deadmade/dead-claude-skills/v${version}#flow-cockpit`; `binAsset` returns `undefined` outside `targets`),\n  `installer/steps/binaries.ts` (`applyBin`: with a `linuxHint` on Linux, push the hint to `done`; the `build` hint\n  names the plugin's own crate), `installer/install.ts:254-255` (call `applyBin` for flow-cockpit),\n  `installer/core/options.ts` (`unavailable` treats a platform with a `linuxHint` as offered; the win32 hiding from\n  Task 9 goes), `installer/core/binaries.test.ts` (`dirs` gains `plugins/opt-in/flow-cockpit`),\n  `installer/core/options.test.ts`, `plugins/opt-in/flow-cockpit/.claude-plugin/plugin.json` (`userConfig.appPath`),\n  `plugins/opt-in/flow-cockpit/skills/views/SKILL.md` (Windows path), `README.md`, `CLAUDE.md`\n\n- [ ] **Step 1: Write the failing tests:** `binAsset gives the Windows zip for flow-cockpit`;\n      `binAsset has no linux asset for flow-cockpit`; `flow-cockpit has a pinned linux hint` (contains `v${version}`);\n      `applyBin prints the hint on linux` (in `done`, not `failures`); `flow-cockpit is offered on win32 and linux`.\n- [ ] **Step 2:** `npm test`; expect FAIL.\n- [ ] **Step 3: Implement**; the summary line on Windows names `%USERPROFILE%\\.claude\\bin\\flow-cockpit.exe`.\n- [ ] **Step 4:** `npm test`, `npm run typecheck` PASS. On Windows (or the Windows CI build): the app opens, one view\n      loads through a blob in WebView2, and a Mermaid diagram renders. `gh workflow run build-flow-cockpit.yml` only with\n      the user's go (it needs a push).\n- [ ] **Step 5:** Commit: `Ship the flow cockpit to Windows through the installer.`","title":"Windows release and installer"}],"title":"Flow cockpit Implementation Plan"}</script>

<script type="application/json" id="docs-json">{"Flow":"---\nflow: feature\nphase: execute\nnow: Building Task 8d, tasks added during a build shown in their place (lettered ids).\n---\n\n# Flow observability: flow\n\n## Request\n\n> Hey, so im currently thinking a lot about ai harnesses. I tried herd but not really my thing. Collegues at work build\n> this project: /home/deadmade/projects/Nexus but it tries to solve an issue I dont really have using the conducters\n> because splitting up work even on larger tasks works perfectly using the conductors. The Problem im having is more\n> centerd around how i can properly see flows and also open flows. Questions from agents, and also watching what\n> subagents are doing. Using just claude code with the mods just does not really cut it for me but I havent really found\n> a solution for it that works well. What my thinking was to utilize the basic idea of nexus and adapt it to how my flows\n> work but im not sure how since I also dont really want to have a website I just host locally and also want to see what\n> my agents are doing properly. Also im not sure if the task based system of nexus maks a lot of sense at the moment.\n> Could you help me analyze this problem properly and decide on how to resolve it?\n\n## Artifacts\n\n- Spec: [spec.md](spec.md) (builder check and grill rounds 1-2 folded in, 2026-10-28)\n- Plan: [plan.md](plan.md) (12 tasks, self-reviewed 2026-10-28)\n- ADRs: [0005](../../adr/0005-flow-cockpit-outside-claude-code.md)\n- Glossary: `GLOSSARY.md` § Flow cockpit (Flow cockpit, Flow run, Audit, Claude session, Loose session, Capture)\n\n## Gates\n\n- Gate 1, spec approved: 2026-10-28, \"yes, approved\". Reopened 2026-10-28: plan review round 1 changed the capture\n  events, the status rules, the audit `Picks:`/`Fixed` lines, the Windows delivery and added slices (spec items\n  marked **(review 1)**); round 2 added the `Waiting for you` prefix and the Windows hiding in slice 1\n  (**(review 2)**). Re-approved 2026-10-28, \"Approve the spec\".\n- Gate 2, plan approved: 2026-10-28, execution: subagent-driven, \"Approve, subagent-driven\"\n\n## Skipped\n\n- 2026-10-28: started as `/research-flow`; moved to `/feature-flow` after the user ruled out a measurable target\n  (\"for this task we cant have numbers so skip that!\", then \"yes\" to switching). The Evidence section stays as\n  background; Hypothesis and Results are dropped.\n\n## Grounding\n\nThis repo (explorer, 2026-10-28):\n\n- Flow state: `docs/features/\u003cslug>/flow.md`, frontmatter `flow:`/`phase:` (older files lack `flow:`), free-text Gate\n  lines, varying Deviations formats (`plugins/flows/references/flow-rules.md` State). Open now: flow-observability,\n  per-plugin-versions (evaluate), skill-composition (validate), web-mcp (execute), web-mcp-search (execute).\n- Per-task build state lives only in the SDD ledger `.superpowers/sdd/\u003cplan>/progress.md` (per working tree,\n  git-ignored), not in flow.md, until the Rulings copy at the end.\n- The flows band (flow-pane run, PR #46) showed one run per AbovePrompt line (`slug · phase · gates · deviations · +N\nopen`, research numbers on a second line, resume hotkey), polling `docs/features/*/flow.md` every 5 s across\n  worktrees. Removed in c2032c1 on 2026-10-20: \"thats too much in my opinion. Lets disable our bands for now and use\n  the ponytail band\" (`docs/features/ponytail-v5/flow.md`). Only one AbovePrompt band wins.\n- Questions today: only a desktop notification (`plugins/default/hooks/hooks.json`: Stop, Notification\n  `permission_prompt|elicitation_dialog`, PreToolUse `AskUserQuestion`; `lib.mjs` takes the first question's text).\n- Mod API (generated typings, tui-review `.claude-plugin/types/claude-code/index.d.ts`): `$.agent.list()` gives this\n  session's agents with `status` (`pending|running|waiting|idle|completed|failed|killed`) and `parentId`, dropped soon\n  after they end; `$.session` reads a subagent's transcript by `agentId`; `tool.call`/`turn.complete` carry `agentId`;\n  `ui.render` on `AskUserQuestion` is hookable; panes via `$.ui.open`. Nothing for other sessions.\n\nNexus (explorer, 2026-10-28):\n\n- Observation is 7 command hooks (SessionStart, UserPromptSubmit, Notification, Stop, SubagentStart/Stop,\n  SessionEnd) → `POST /api/hook` on a local Fastify server → in-memory `SessionStore` state machine\n  (idle/running/waiting/ended, stale after 30 min) → SSE → React web UI. `packages/core/src/sessions/SessionStore.ts`.\n- Subagents: type, running/ended and runtime only; no tool calls, no transcript.\n- Questions are board-DB records raised by `harness board question add`, decided only by humans in the web UI; they\n  reach a session only through `additionalContext` on the next UserPromptSubmit, and only via tickets. No\n  AskUserQuestion or permission handling.\n- Session tracking, waiting toasts and the sessions list are keyed on session id and work without tickets; context\n  injection, questions, comments, grouping and the dispatcher are keyed on tickets.\n\nClaude Code itself (claude-code-guide, code.claude.com/docs, 2026-10-28; desktop app unverified):\n\n- `claude agents`: states Needs input/Working/Idle/Completed/Failed/Stopped, peek panel shows the question, permission\n  prompts need attach; only background sessions (foreground ones after `/bg`); subagents not rows.\n  `claude agents --json` gives `state` and `waitingFor` (agent-view). `~/.claude/jobs/` is not a stable interface.\n- Subagents: panel below the prompt + Enter for a fork's transcript, Ctrl+O transcript viewer, `/tasks`; on disk\n  `~/.claude/projects/{project}/{sessionId}/subagents/agent-{agentId}.jsonl` (schema undocumented). Pre/PostToolUse\n  fire for subagent calls with `agent_id`; SubagentStop has `agent_transcript_path`.\n- Answering from outside: PermissionRequest hook decides allow/deny; PreToolUse on AskUserQuestion can return\n  `updatedInput.answers` (documented for `-p`, interactive implied). Injecting into an interactive session: channels\n  (research preview, claude.ai/Console auth) or the cross-session inbox socket (goes to Claude, not the keyboard);\n  tmux send-keys undocumented. Remote Control mirrors subagent progress to claude.ai/mobile, per session.\n- OTel: `tool_result` only on completion, `subagent_completed`; traces beta, 5 s batches. Mods: `$.agent.list()` this\n  session only, `$.session.send({sessionId})`, no enumeration of other sessions.\n\n## Prior art\n\nAgent report, 2026-10-28 (sources fetched in that run):\n\n- **A. tmux/PTY wrapper TUI**: [allenan/herd](https://github.com/allenan/herd#how-it-works-1),\n  [Claude Squad](https://github.com/smtg-ai/claude-squad#how-it-works),\n  [CCManager](https://github.com/kbwo/ccmanager#why-ccmanager-over-claude-squad),\n  [Agent Deck](https://github.com/asheshgoplani/agent-deck#status-detection). Sessions must start inside the tool;\n  status partly from pane reading (\"slower and occasionally wrong\", Agent Deck); no subagent view; answer by attaching.\n- **B. Hooks → event store → viewer**:\n  [disler/claude-code-hooks-multi-agent-observability](https://github.com/disler/claude-code-hooks-multi-agent-observability#-architecture)\n  (12 hook events incl. SubagentStart/Stop, PermissionRequest → Bun + SQLite → WebSocket → Vue). Only one with a live\n  per-subagent tool timeline; read-only; web UI.\n- **C. First-party supervisor**: [`claude agents` agent view](https://code.claude.com/docs/en/agent-view) (research\n  preview): rows grouped Needs input / Working / Completed, Haiku summary per row, answer AskUserQuestion in a peek\n  panel, permission prompts need attach; `claude agents --json` (`state`, `waitingFor`); only backgrounded sessions;\n  subagents are not rows; no notion of flow.md runs.\n- **D. Work-item board**: [Vibe Kanban](https://github.com/BloopAI/vibe-kanban) (\"sunsetting\"), Agent Deck's Fleet\n  board (web mode).\n- Docs: hooks carry `session_id`, `transcript_path`, subagent events `agent_id`/`agent_type`; SubagentStop carries\n  `agent_transcript_path`; Notification types incl. `agent_needs_input`; `PermissionRequest` fires immediately and can\n  decide; a PreToolUse hook can answer AskUserQuestion via `updatedInput.answers`; HTTP hooks; `permission_prompt`\n  fires after ~6 s, `idle_prompt` ~60 s ([hooks](https://code.claude.com/docs/en/hooks#notification)). Transcripts\n  `~/.claude/projects/\u003cproject>/\u003csession-id>.jsonl`, format changes between versions\n  ([sessions](https://code.claude.com/docs/en/sessions#where-transcripts-are-stored)).\n- No tool tracks flow.md phases. \"herd\" is ambiguous (allenan/herd TUI vs poddubnyoleg/herd browser multiplexer).\n\n## Evidence\n\nLiterature agent, 2026-10-28 (web-mcp papers search, DOIs via Crossref; abstracts only, no full texts). E10 re-fetched\nby the main session ([arXiv:2609.33113](https://arxiv.org/abs/2609.33113)).\n\n| #   | claim                                                                                                   | source                                               | type              | setting                                  | result                                                                                 | transfers here?                                        | strength |\n| --- | ------------------------------------------------------------------------------------------------------- | ---------------------------------------------------- | ----------------- | ---------------------------------------- | -------------------------------------------------------------------------------------- | ------------------------------------------------------ | -------- |\n| E1  | Multi-agent supervision hinges on situation awareness (SA) and calibrated trust                         | 10.1109/THMS.2013.2293535, Chen & Barnes, 2014       | survey            | multi-robot/UxV HRI                      | qualitative                                                                            | partly: same 1:N structure                             | High     |\n| E2  | Agent transparency improves SA and performance without adding workload                                  | 10.1177/00187208221077804, van de Merwe et al., 2022 | systematic review | 17 experiments, safety-critical          | beneficial trend; depends on integration into the main display                         | partly                                                 | High     |\n| E3  | Operator capacity is limited by wait time from lost SA, not interaction time                            | hdl 1721.1/90280, Cummings & Mitchell, 2008          | theory + sim      | independent UAVs                         | wait times cut predicted fan-out up to 67%                                             | yes: \"who is blocked on what\" is that wait             | Low      |\n| E4  | A predictive overload display backfired; management-by-exception best                                   | hdl 1721.1/46751, Cummings et al., 2005              | experiment        | 1 operator, 4 UAVs                       | predictive level worst                                                                 | partly: against forecast-heavy views                   | Low      |\n| E5  | More transparency: better performance and calibration, slower responses                                 | 10.1109/THMS.2020.2978041, Stowers et al., 2020      | experiment        | heterogeneous UxV                        | no workload rise; response time up                                                     | partly                                                 | Med      |\n| E6  | Transparency had no effect for a monitor-only role                                                      | 10.1109/THMS.2019.2925717, Wright et al., 2020       | experiment        | observer of simulated squad              | null                                                                                   | partly: a passive glance view may not gain from detail | Med      |\n| E7  | Interruptions at (coarse) subtask boundaries cost least                                                 | hdl 2142/11088, Iqbal et al., 2005                   | experiment        | lab desktop tasks                        | cost reduced at boundaries                                                             | yes: non-blocking events can wait for a breakpoint     | Low      |\n| E8  | Batched notifications beat immediate and none                                                           | 10.1016/j.chb.2019.07.016, Fitz et al., 2019         | field RCT         | n=237 phone users                        | more attention/control, less stress; none raised anxiety                               | partly: progress yes, blocking questions no            | Med      |\n| E9  | Alerts during heavy dual-task load are disregarded; right after a task they aren't                      | 10.1287/isre.2016.0644, Jenkins et al., 2016         | experiment        | security warnings                        | timing removes the effect                                                              | partly                                                 | Med      |\n| E10 | Planning view + run log + ambient dashboard raised throughput and concurrent agents for parallel coding | arXiv 2609.33113, ParallelPilot, 2026                | preprint          | N=16 within-subjects, short coding tasks | +63% throughput, +1 agent at peak, less tracking/context switching; no gain in control | yes, closest; short tasks not hour-long flows          | Low      |\n\n- **Agrees:** lost SA limits fan-out (E1, E3, E4); an at-a-glance status/intent view helps at little cost (E2, E10);\n  non-urgent events cost less deferred or batched (E7, E8, E9).\n- **Conflicts:** transparency slows responses (E5) vs no effect when only monitoring (E6) vs overload from more\n  predictive detail (E4). Reading: blocking questions and state prominent, subagent detail one keystroke away (E10's\n  own recommendation: \"pair high-level awareness with low-cost paths back to the implementation evidence\").\n- **Gaps:** no study compares task boards with run-centric views; nothing on nested sub-agents or hour-long resumable\n  runs; no terminal-UI evidence; agent tracing work (arXiv 2411.05285) is taxonomy without user studies.\n- **Proposed effect:** blocked-wait latency from hook logs (blocking event → next input in that session), median and\n  p90 per day, plus waits over 10 min; aim ≥30% lower than a 1–2 week baseline (E3, E10). Guardrail: focus switches\n  into a session that end without input should not rise (E4, E7, E8).\n\nChecked in this session (2026-10-28):\n\n- Subagent transcripts on disk (`~/.claude/projects/\u003cproj>/\u003csession>/subagents/agent-\u003cid>.jsonl`, plus a\n  `.meta.json` with `agentType`, `description`, `model`, `finished`) hold tool calls with inputs and results, but\n  every `thinking` block's text is empty (literature agent: 10 thinking blocks, all length 0; the main session's too).\n  \"What it thinks\" can't be read back from disk; only the text it writes and its tool inputs.\n- Agent teams ([docs](https://code.claude.com/docs/en/agent-teams#choose-a-display-mode)): experimental\n  (`CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS=1`); `teammateMode: \"tmux\"`/`\"auto\"` puts each teammate, a full Claude Code\n  session, in its own tmux split pane; click a pane to talk to it; permission prompts go to the lead. A named Agent\n  call becomes a teammate. Not supported natively in Windows Terminal or Ghostty (tmux inside Ghostty is fine);\n  in-process mode works everywhere (agent panel, Enter opens a teammate). Limits: in-process teammates not restored on\n  `/resume`, one team per session, no nested teams, higher token cost. Shared task list has dependencies and a\n  blocked state.\n\n## Brainstorm answers\n\n- 2026-10-28: current setup covers \"maybe like 10% of the goal\"; \"quit annoying\".\n- 2026-10-28: \"i often dont do parallel work. I ususaly do one or at most two sessions in parallel and I like to\n  actually see what the agents does. What it edits what it thinks and I think about the problems as well and give\n  input where needed. With the current setup I often have no idea on which task the agent is. Does it have any\n  problems etc. Also did I forget to finish a flow etc.\"\n- 2026-10-28: \"im not sure if its really optimal what im doing but software factories just feel wrong idk. What im\n  missing is just good visualisation of the markdown files. Mermaid diagrams or uml or whatever would be awesome.\n  Espeically with sdd I dont really see what the agent is doing or at least not really well\"\n- 2026-10-28 (visual companion, picked A \"flow map\"): \"For A I probably would need a better visualization how are\n  they connected maybe they can run in parallel. Also what problems where found would be interesting. What i was\n  initionally thinking and abolsutly no idea if its possible to essentialy have these claude 1 conducter window |\n  subagent one | subagent two grid or something\"\n- 2026-10-28: \"the agent should know that im able to properly see them but I dont want the agent to force to write\n  them since not every task requires it! Also important is that similar to pi the app is easily changable and\n  customizable from agents!\" pi: extensions are TypeScript modules auto-discovered in `~/.pi/agent/extensions/` or\n  `.pi/extensions/`, hot-reloaded with `/reload`, \"pi can create extensions. Ask it to build one for your use case.\"\n  ([pi extensions.md](https://github.com/earendil-works/pi/blob/main/packages/coding-agent/docs/extensions.md), text\n  read via the mirror https://github.com/pi0/pi-mono/blob/main/packages/coding-agent/docs/extensions.md).\n- 2026-10-28: A means \"the different conductor runs and then when we switch to sdd to see the different tasks that\n  should be done reviews etc\" (runs-v3 mockup: \"A looks awesome\").\n- 2026-10-28: \"teammates sound interesting but do they work onj windows? and A looks awesome but I dont think\n  integrating it in claude code is possible\"; then \"I want ot also improve the visulization of the flows, specs etc\n  with for example mermaid diagrams etc. I just dont see this working good in claude code allone.\"\n\n## Options\n\n### Surface and shape\n\nPicked: Claude Code stays in the user's terminal, and a separate desktop window (Tauri) draws what the sessions and\ntheir subagents do, from captured events, flow.md, the SDD ledgers and transcripts; watching only, no interacting\nwith Claude.\n\nOffered 2026-10-28, with evidence: E2, E10 back an at-a-glance state view with detail one step away; E4, E5 warn\nagainst always-on detail; E6 says showing more pays off for people working with the agents, not people who only\nwatch. Nothing in the literature compares surfaces.\n\n- Diagrams in the docs only, viewed in existing Markdown renderers (S). Kept as a slice, not the whole answer.\n- Own desktop window, Tauri (L).\n- Terminal viewer in its own pane (L): rejected by the user, diagrams don't work well in a terminal.\n- Desktop cockpit hosting Claude Code in embedded PTYs (L+): replaced; running Claude Code inside the app is the risky\n  part.\n- Terminal cockpit hosting Claude Code (like CCManager): rejected, text-only diagrams and a terminal in a terminal.\n- Agent teams in tmux panes: Linux only (no Windows Terminal split panes); separate question, not picked.\n- **Picked (user's proposal, recommended):** Claude Code stays in the user's terminal; hooks and a mod capture what the\n  session and its subagents do into per-session event files; a separate desktop window (Tauri) follows those files\n  plus flow.md, the SDD ledgers and transcripts, and draws runs, phases, the task graph and review loops, live agent\n  activity, and the docs with Mermaid. **Scope (user, 2026-10-28):** \"lets first just focus on the visulisation and\n  capturing what claude code and the subagents to do just visulize everything that happens with the flows and keep\n  the actually interacting with claude out of it for now\". No answering questions, no starting flows, no typing.\n\n### Language\n\nPicked: Rust core, TypeScript views (user, 2026-10-28).\n\nRust extensions considered: a 15-line serde cdylib built in 6.4 s clean, 0.75 s release / 0.32 s debug incremental on\nthis machine (24 cores), so compile time isn't the objection; drawing in the webview, no stable plugin ABI, a\ntoolchain on every machine and a longer agent loop are.\n\n### Spike\n\nPicked: a throwaway clickable prototype from real data, agreed 2026-10-28.\n\n\"Lets create a prototype for that. So my inial idea was to have a drop down\nto select the projects im working on. And a list of flows that currently run or have run with filter and sort. I can\nsee on which steps they are, are they waiting, what kind of flow was it etc. When I click of them I get the detailed\nview with task list chat out put etc\". Built as a clickable page in the brainstorm companion from real data (a\nscratchpad extraction script), not Tauri; nothing of it is kept without going through the plan.\n\nWhat the spike showed (2026-10-28):\n\n- Reading everything from disk is cheap: 19 flows, 638 sessions (750 MB of transcripts), build logs and subagent\n  files in about 1.4 s, using one `grep` pass to link sessions to flows.\n- A project is more than one folder: sessions ran in `~/dead-claude-skills`, the flows now live in\n  `~/projects/dead-claude-skills`, plus worktrees under `.claude/worktrees/`. The prototype folds them by folder name.\n- Linking a session to a flow works when the session edited or wrote that flow's flow.md; a mere mention links nearly\n  every session to every flow.\n- \"Waiting on you\" from \"the last message ends with a question\" flagged web-mcp, idle 5 days, with 16 of 18 tasks done:\n  a forgotten run, not a live question. Live state needs the capture; disk alone gives history.\n- No plan declares task dependencies, so the graph can only show plan order. No existing spec or plan has a Mermaid\n  block.\n- The brainstorm companion reloads or blanks a full-document page; the prototype is served on its own port instead.\n- User, 2026-10-28: \"the shape feels right but most of it have really hard edges. Its really important that its easy\n  and nice to read\". Readability is a goal of its own, not polish.\n- Restyle (hallmark, app scope, fast mode): Night City's own palette from `plugins/default/themes/night-city.json`\n  instead of saturated ad-hoc colours, IBM Plex Sans 16px body, tone-stepped surfaces instead of 1px borders, rounded\n  rows and panels, prose capped at 72–75ch, tool calls as one quiet line that opens to the diff or command, Mermaid\n  themed dark to match, inline code rendered in log lines. `sloplint --scope app`: clean. The blank pages seen while\n  testing were the headless test browser dropping every tab about 10 s after it opened (an untouched list page too),\n  not the page or Mermaid.\n- User, 2026-10-28: \"table good, but the individual runs are still quit messy and really hard to read or not able to\n  read at all\". Run view rebuilt around reading: the Build tab opens with a two-sentence summary (\"16 of 18 tasks\n  done. Next up: …\"), one line per task with a plain state (\"Done after 2 fix rounds\"), and a task opens to \"What\n  happened\" as numbered sentences, then Security, Decisions (decision, why, if wrong) and Left for later. The plan-order\n  diagram is gone (a straight line says nothing). The Conversation tab groups the transcript into turns, newest first:\n  your prompt, the work folded into one line (\"Changed 6 files, ran 16 commands\"), earlier notes folded, Claude's\n  answer; older turns clamp to six lines. Wrapped build-log lines are now joined by the extractor.\n- User, 2026-10-28: \"task view is shit, i see there are 10 task but what do they do I cant see at a glance. Decisions\n  are really hard to read. COnversations is just a long list of text. Its so hard to read. Docs same issue again and\n  overview not sure about that\". Diagnosis: the source text is written for agents (a plan task is a title plus a dense\n  interface spec, no plain \"what it does\" line; ledger lines and rulings are compressed technical prose; transcripts\n  are long by nature). Restyling can't make that glanceable; it needs a distilling step, written by the flows or by a\n  model in the app.\n- For the real app: rendered Markdown from transcripts and build logs is untrusted (web pages end up in them), so it\n  needs a sanitiser before it reaches the DOM; the prototype doesn't have one.\n\n### Readable documents or model summaries\n\nPicked: better source documents, which the viewer draws as UI by their structure; Haiku summaries not picked.\n\n- User, 2026-10-28, on \"flows write it\" vs \"Haiku summarises\": \"instead of just rendering markdown could we just\n  enhance whats written. I will change the flow.md and shit a bit better etc\". Direction: better source documents\n  (the user reworks them), and a viewer that recognises their structure and draws it as UI instead of rendering\n  Markdown as is. Haiku summaries not picked.\n\n### Which documents get the readable format\n\nPicked: flow.md and the plan; the build log stays as it is for now.\n\n- 2026-10-28, which documents get the readable format: offered flow.md only / flow.md + plan / + build log\n  (recommended flow.md + plan). User: \"2\". The plan's part (one plain line per task, dependencies) goes in through a\n  conductor override of `writing-plans`; the build log stays as it is for now.\n\n### Mod or no mod\n\nPicked: no mod. The capture and transcripts cover agent state, questions and permission prompts; a mod is revisited\nonly if a gap shows (plan review round 1, 2026-10-28).\n\n### Flow run view\n\nPicked: the mockup in `crates/flow-cockpit/design/run-view.html` after three reworks, approved 2026-10-28 (\"its\nfucking awesome!!! lets goo\"): an app window on one grid; Build is a phase track and one-line task rail beside the\nselected task, with folds styled as rows; Decisions and Docs are master and detail; installed fonts; the Night City\npalette unchanged.\n\nMockup round 1 (2026-10-28, `crates/flow-cockpit/design/run-view.html`): the user likes the theme and the colouring,\nand hates the alignment: \"it 100% looks like ai and kinda lazy\", \"also half the screen is empty\" (a centred capped\ncolumn at ~1880 px). Fonts: installed ones, no bundled or downloaded font. Reworking it as an app window that fills\nthe width on one grid, with fewer boxes; not picked yet.\n\nMockup round 2 (2026-10-28): \"definetly a good step up but now its just bam 3 or 4 walls of text. Its overwhelming a\nbit but definetly the right direction\"; the user asked Claude to analyse it. Reworking for one focal point per\nscreen: the selected task on Build, phases as one line, one-line task rows, decisions as expandable lists, no task\nrail on Decisions and Docs.\n\nMockup round 3 (2026-10-28): \"Rest awesome except the decissions tab\". The user moved the chapters to the right on\nDocs, with the documents on the left. Two changes asked: the clickable inline links in Build (\"the build log, 1\nentry\") don't fit the scheme; Decisions should be decisions and deviations on the left with the text in the middle.\n\n### Slice 2\n\nPicked: go for slice 2 (Tasks 10 to 13), user, 2026-10-29, after using slice 1's window (\"I like what you build\").\nAt the checkpoint the Nix-built window died on the user's NVIDIA card under Wayland (\"Error 71 (Protocol error)\");\n`WEBKIT_DISABLE_DMABUF_RENDERER=1` fixed it, and the app now sets it itself (Rulings, Task 9 follow-up).\n\n## Plan review\n\n**Round 1 (2026-10-28).** Reviewers: Correctness (fable), Fit (opus, blast-radius), Simpler (sonnet, ponytail-review).\n37 findings, about 30 after merging; none dropped (each traced to a file:line or a fetched doc). Decisions by the user:\n
