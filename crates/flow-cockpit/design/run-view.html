<script type="application/json" id="flow-json">{"decisions":[{"body":"Offered 2026-10-28, with evidence: E2, E10 back an at-a-glance state view with detail one step away; E4, E5 warn\nagainst always-on detail; E6 says showing more pays off for people working with the agents, not people who only\nwatch. Nothing in the literature compares surfaces.\n\n- Diagrams in the docs only, viewed in existing Markdown renderers (S). Kept as a slice, not the whole answer.\n- Own desktop window, Tauri (L).\n- Terminal viewer in its own pane (L): rejected by the user, diagrams don't work well in a terminal.\n- Desktop cockpit hosting Claude Code in embedded PTYs (L+): replaced; running Claude Code inside the app is the risky\n  part.\n- Terminal cockpit hosting Claude Code (like CCManager): rejected, text-only diagrams and a terminal in a terminal.\n- Agent teams in tmux panes: Linux only (no Windows Terminal split panes); separate question, not picked.\n- **Picked (user's proposal, recommended):** Claude Code stays in the user's terminal; hooks and a mod capture what the\n  session and its subagents do into per-session event files; a separate desktop window (Tauri) follows those files\n  plus flow.md, the SDD ledgers and transcripts, and draws runs, phases, the task graph and review loops, live agent\n  activity, and the docs with Mermaid. **Scope (user, 2026-10-28):** \"lets first just focus on the visulisation and\n  capturing what claude code and the subagents to do just visulize everything that happens with the flows and keep\n  the actually interacting with claude out of it for now\". No answering questions, no starting flows, no typing.","picked":"Claude Code stays in the user's terminal, and a separate desktop window (Tauri) draws what the sessions and their subagents do, from captured events, flow.md, the SDD ledgers and transcripts; watching only, no interacting with Claude.","title":"Surface and shape"},{"body":"Rust extensions considered: a 15-line serde cdylib built in 6.4 s clean, 0.75 s release / 0.32 s debug incremental on\nthis machine (24 cores), so compile time isn't the objection; drawing in the webview, no stable plugin ABI, a\ntoolchain on every machine and a longer agent loop are.","picked":"Rust core, TypeScript views (user, 2026-10-28).","title":"Language"},{"body":"\"Lets create a prototype for that. So my inial idea was to have a drop down\nto select the projects im working on. And a list of flows that currently run or have run with filter and sort. I can\nsee on which steps they are, are they waiting, what kind of flow was it etc. When I click of them I get the detailed\nview with task list chat out put etc\". Built as a clickable page in the brainstorm companion from real data (a\nscratchpad extraction script), not Tauri; nothing of it is kept without going through the plan.\n\nWhat the spike showed (2026-10-28):\n\n- Reading everything from disk is cheap: 19 flows, 638 sessions (750 MB of transcripts), build logs and subagent\n  files in about 1.4 s, using one `grep` pass to link sessions to flows.\n- A project is more than one folder: sessions ran in `~/dead-claude-skills`, the flows now live in\n  `~/projects/dead-claude-skills`, plus worktrees under `.claude/worktrees/`. The prototype folds them by folder name.\n- Linking a session to a flow works when the session edited or wrote that flow's flow.md; a mere mention links nearly\n  every session to every flow.\n- \"Waiting on you\" from \"the last message ends with a question\" flagged web-mcp, idle 5 days, with 16 of 18 tasks done:\n  a forgotten run, not a live question. Live state needs the capture; disk alone gives history.\n- No plan declares task dependencies, so the graph can only show plan order. No existing spec or plan has a Mermaid\n  block.\n- The brainstorm companion reloads or blanks a full-document page; the prototype is served on its own port instead.\n- User, 2026-10-28: \"the shape feels right but most of it have really hard edges. Its really important that its easy\n  and nice to read\". Readability is a goal of its own, not polish.\n- Restyle (hallmark, app scope, fast mode): Night City's own palette from `plugins/default/themes/night-city.json`\n  instead of saturated ad-hoc colours, IBM Plex Sans 16px body, tone-stepped surfaces instead of 1px borders, rounded\n  rows and panels, prose capped at 72–75ch, tool calls as one quiet line that opens to the diff or command, Mermaid\n  themed dark to match, inline code rendered in log lines. `sloplint --scope app`: clean. The blank pages seen while\n  testing were the headless test browser dropping every tab about 10 s after it opened (an untouched list page too),\n  not the page or Mermaid.\n- User, 2026-10-28: \"table good, but the individual runs are still quit messy and really hard to read or not able to\n  read at all\". Run view rebuilt around reading: the Build tab opens with a two-sentence summary (\"16 of 18 tasks\n  done. Next up: …\"), one line per task with a plain state (\"Done after 2 fix rounds\"), and a task opens to \"What\n  happened\" as numbered sentences, then Security, Decisions (decision, why, if wrong) and Left for later. The plan-order\n  diagram is gone (a straight line says nothing). The Conversation tab groups the transcript into turns, newest first:\n  your prompt, the work folded into one line (\"Changed 6 files, ran 16 commands\"), earlier notes folded, Claude's\n  answer; older turns clamp to six lines. Wrapped build-log lines are now joined by the extractor.\n- User, 2026-10-28: \"task view is shit, i see there are 10 task but what do they do I cant see at a glance. Decisions\n  are really hard to read. COnversations is just a long list of text. Its so hard to read. Docs same issue again and\n  overview not sure about that\". Diagnosis: the source text is written for agents (a plan task is a title plus a dense\n  interface spec, no plain \"what it does\" line; ledger lines and rulings are compressed technical prose; transcripts\n  are long by nature). Restyling can't make that glanceable; it needs a distilling step, written by the flows or by a\n  model in the app.\n- For the real app: rendered Markdown from transcripts and build logs is untrusted (web pages end up in them), so it\n  needs a sanitiser before it reaches the DOM; the prototype doesn't have one.","picked":"a throwaway clickable prototype from real data, agreed 2026-10-28.","title":"Spike"},{"body":"- User, 2026-10-28, on \"flows write it\" vs \"Haiku summarises\": \"instead of just rendering markdown could we just\n  enhance whats written. I will change the flow.md and shit a bit better etc\". Direction: better source documents\n  (the user reworks them), and a viewer that recognises their structure and draws it as UI instead of rendering\n  Markdown as is. Haiku summaries not picked.","picked":"better source documents, which the viewer draws as UI by their structure; Haiku summaries not picked.","title":"Readable documents or model summaries"},{"body":"- 2026-10-28, which documents get the readable format: offered flow.md only / flow.md + plan / + build log\n  (recommended flow.md + plan). User: \"2\". The plan's part (one plain line per task, dependencies) goes in through a\n  conductor override of `writing-plans`; the build log stays as it is for now.","picked":"flow.md and the plan; the build log stays as it is for now.","title":"Which documents get the readable format"},{"body":"","picked":"no mod. The capture and transcripts cover agent state, questions and permission prompts; a mod is revisited only if a gap shows (plan review round 1, 2026-10-28).","title":"Mod or no mod"},{"body":"Mockup round 1 (2026-10-28, `crates/flow-cockpit/design/run-view.html`): the user likes the theme and the colouring,\nand hates the alignment: \"it 100% looks like ai and kinda lazy\", \"also half the screen is empty\" (a centred capped\ncolumn at ~1880 px). Fonts: installed ones, no bundled or downloaded font. Reworking it as an app window that fills\nthe width on one grid, with fewer boxes; not picked yet.\n\nMockup round 2 (2026-10-28): \"definetly a good step up but now its just bam 3 or 4 walls of text. Its overwhelming a\nbit but definetly the right direction\"; the user asked Claude to analyse it. Reworking for one focal point per\nscreen: the selected task on Build, phases as one line, one-line task rows, decisions as expandable lists, no task\nrail on Decisions and Docs.\n\nMockup round 3 (2026-10-28): \"Rest awesome except the decissions tab\". The user moved the chapters to the right on\nDocs, with the documents on the left. Two changes asked: the clickable inline links in Build (\"the build log, 1\nentry\") don't fit the scheme; Decisions should be decisions and deviations on the left with the text in the middle.","picked":"the mockup in `crates/flow-cockpit/design/run-view.html` after three reworks, approved 2026-10-28 (\"its fucking awesome!!! lets goo\"): an app window on one grid; Build is a phase track and one-line task rail beside the selected task, with folds styled as rows; Decisions and Docs are master and detail; installed fonts; the Night City palette unchanged.","title":"Flow run view"}],"deviations":[{"body":"The plan asked for trimmed real transcripts. Copying them into the public repo was blocked, so the implementer reads\nreal transcripts only for their JSON shapes and field names and writes the fixture lines with invented text.","status":{"Decided":{"date":"2026-10-28","what":"hand-written in the real shape"}},"title":"Task 3 transcript fixtures are hand-written, not trimmed real ones"},{"body":"The plan's `Text` carries no agent, so Task 3 dropped every subagent reply, final reports included; only their tool\ncalls showed.","status":{"Decided":{"date":"2026-10-28","what":"`Text` gains `agent: Option\u003cString>`, and subagent replies land in the turn open at their time"}},"title":"Subagent text replies have no place in the activity model"},{"body":"Status was derived only when a project's files changed, so a run whose Claude session stopped stayed Working.","status":{"Decided":{"date":"2026-10-28","what":"`Index::refresh(now)` re-derives every status from cached facts without reading the disk; Task 6's poll calls it each tick"}},"title":"Status never decays without a file change"}],"flow":"feature","gates":[{"approved":"2026-10-28","n":1,"raw":"- Gate 1, spec approved: 2026-10-28, \"yes, approved\". Reopened 2026-10-28: plan review round 1 changed the capture events, the status rules, the audit `Picks:`/`Fixed` lines, the Windows delivery and added slices (spec items marked **(review 1)**); round 2 added the `Waiting for you` prefix and the Windows hiding in slice 1 (**(review 2)**). Re-approved 2026-10-28, \"Approve the spec\".","reopened":true,"what":"spec approved"},{"approved":"2026-10-28","n":2,"raw":"- Gate 2, plan approved: 2026-10-28, execution: subagent-driven, \"Approve, subagent-driven\"","reopened":false,"what":"plan approved"}],"now":"The flow run view mockup is approved; the build goes on with Task 6, the app shell.","phase":"execute","sections":[{"heading":"Request","markdown":"> Hey, so im currently thinking a lot about ai harnesses. I tried herd but not really my thing. Collegues at work build\n> this project: /home/deadmade/projects/Nexus but it tries to solve an issue I dont really have using the conducters\n> because splitting up work even on larger tasks works perfectly using the conductors. The Problem im having is more\n> centerd around how i can properly see flows and also open flows. Questions from agents, and also watching what\n> subagents are doing. Using just claude code with the mods just does not really cut it for me but I havent really found\n> a solution for it that works well. What my thinking was to utilize the basic idea of nexus and adapt it to how my flows\n> work but im not sure how since I also dont really want to have a website I just host locally and also want to see what\n> my agents are doing properly. Also im not sure if the task based system of nexus maks a lot of sense at the moment.\n> Could you help me analyze this problem properly and decide on how to resolve it?"},{"heading":"Artifacts","markdown":"- Spec: [spec.md](spec.md) (builder check and grill rounds 1-2 folded in, 2026-10-28)\n- Plan: [plan.md](plan.md) (12 tasks, self-reviewed 2026-10-28)\n- ADRs: [0005](../../adr/0005-flow-cockpit-outside-claude-code.md)\n- Glossary: `GLOSSARY.md` § Flow cockpit (Flow cockpit, Flow run, Audit, Claude session, Loose session, Capture)"},{"heading":"Gates","markdown":"- Gate 1, spec approved: 2026-10-28, \"yes, approved\". Reopened 2026-10-28: plan review round 1 changed the capture\n  events, the status rules, the audit `Picks:`/`Fixed` lines, the Windows delivery and added slices (spec items\n  marked **(review 1)**); round 2 added the `Waiting for you` prefix and the Windows hiding in slice 1\n  (**(review 2)**). Re-approved 2026-10-28, \"Approve the spec\".\n- Gate 2, plan approved: 2026-10-28, execution: subagent-driven, \"Approve, subagent-driven\""},{"heading":"Skipped","markdown":"- 2026-10-28: started as `/research-flow`; moved to `/feature-flow` after the user ruled out a measurable target\n  (\"for this task we cant have numbers so skip that!\", then \"yes\" to switching). The Evidence section stays as\n  background; Hypothesis and Results are dropped."},{"heading":"Grounding","markdown":"This repo (explorer, 2026-10-28):\n\n- Flow state: `docs/features/\u003cslug>/flow.md`, frontmatter `flow:`/`phase:` (older files lack `flow:`), free-text Gate\n  lines, varying Deviations formats (`plugins/flows/references/flow-rules.md` State). Open now: flow-observability,\n  per-plugin-versions (evaluate), skill-composition (validate), web-mcp (execute), web-mcp-search (execute).\n- Per-task build state lives only in the SDD ledger `.superpowers/sdd/\u003cplan>/progress.md` (per working tree,\n  git-ignored), not in flow.md, until the Rulings copy at the end.\n- The flows band (flow-pane run, PR #46) showed one run per AbovePrompt line (`slug · phase · gates · deviations · +N\nopen`, research numbers on a second line, resume hotkey), polling `docs/features/*/flow.md` every 5 s across\n  worktrees. Removed in c2032c1 on 2026-10-20: \"thats too much in my opinion. Lets disable our bands for now and use\n  the ponytail band\" (`docs/features/ponytail-v5/flow.md`). Only one AbovePrompt band wins.\n- Questions today: only a desktop notification (`plugins/default/hooks/hooks.json`: Stop, Notification\n  `permission_prompt|elicitation_dialog`, PreToolUse `AskUserQuestion`; `lib.mjs` takes the first question's text).\n- Mod API (generated typings, tui-review `.claude-plugin/types/claude-code/index.d.ts`): `$.agent.list()` gives this\n  session's agents with `status` (`pending|running|waiting|idle|completed|failed|killed`) and `parentId`, dropped soon\n  after they end; `$.session` reads a subagent's transcript by `agentId`; `tool.call`/`turn.complete` carry `agentId`;\n  `ui.render` on `AskUserQuestion` is hookable; panes via `$.ui.open`. Nothing for other sessions.\n\nNexus (explorer, 2026-10-28):\n\n- Observation is 7 command hooks (SessionStart, UserPromptSubmit, Notification, Stop, SubagentStart/Stop,\n  SessionEnd) → `POST /api/hook` on a local Fastify server → in-memory `SessionStore` state machine\n  (idle/running/waiting/ended, stale after 30 min) → SSE → React web UI. `packages/core/src/sessions/SessionStore.ts`.\n- Subagents: type, running/ended and runtime only; no tool calls, no transcript.\n- Questions are board-DB records raised by `harness board question add`, decided only by humans in the web UI; they\n  reach a session only through `additionalContext` on the next UserPromptSubmit, and only via tickets. No\n  AskUserQuestion or permission handling.\n- Session tracking, waiting toasts and the sessions list are keyed on session id and work without tickets; context\n  injection, questions, comments, grouping and the dispatcher are keyed on tickets.\n\nClaude Code itself (claude-code-guide, code.claude.com/docs, 2026-10-28; desktop app unverified):\n\n- `claude agents`: states Needs input/Working/Idle/Completed/Failed/Stopped, peek panel shows the question, permission\n  prompts need attach; only background sessions (foreground ones after `/bg`); subagents not rows.\n  `claude agents --json` gives `state` and `waitingFor` (agent-view). `~/.claude/jobs/` is not a stable interface.\n- Subagents: panel below the prompt + Enter for a fork's transcript, Ctrl+O transcript viewer, `/tasks`; on disk\n  `~/.claude/projects/{project}/{sessionId}/subagents/agent-{agentId}.jsonl` (schema undocumented). Pre/PostToolUse\n  fire for subagent calls with `agent_id`; SubagentStop has `agent_transcript_path`.\n- Answering from outside: PermissionRequest hook decides allow/deny; PreToolUse on AskUserQuestion can return\n  `updatedInput.answers` (documented for `-p`, interactive implied). Injecting into an interactive session: channels\n  (research preview, claude.ai/Console auth) or the cross-session inbox socket (goes to Claude, not the keyboard);\n  tmux send-keys undocumented. Remote Control mirrors subagent progress to claude.ai/mobile, per session.\n- OTel: `tool_result` only on completion, `subagent_completed`; traces beta, 5 s batches. Mods: `$.agent.list()` this\n  session only, `$.session.send({sessionId})`, no enumeration of other sessions."},{"heading":"Prior art","markdown":"Agent report, 2026-10-28 (sources fetched in that run):\n\n- **A. tmux/PTY wrapper TUI**: [allenan/herd](https://github.com/allenan/herd#how-it-works-1),\n  [Claude Squad](https://github.com/smtg-ai/claude-squad#how-it-works),\n  [CCManager](https://github.com/kbwo/ccmanager#why-ccmanager-over-claude-squad),\n  [Agent Deck](https://github.com/asheshgoplani/agent-deck#status-detection). Sessions must start inside the tool;\n  status partly from pane reading (\"slower and occasionally wrong\", Agent Deck); no subagent view; answer by attaching.\n- **B. Hooks → event store → viewer**:\n  [disler/claude-code-hooks-multi-agent-observability](https://github.com/disler/claude-code-hooks-multi-agent-observability#-architecture)\n  (12 hook events incl. SubagentStart/Stop, PermissionRequest → Bun + SQLite → WebSocket → Vue). Only one with a live\n  per-subagent tool timeline; read-only; web UI.\n- **C. First-party supervisor**: [`claude agents` agent view](https://code.claude.com/docs/en/agent-view) (research\n  preview): rows grouped Needs input / Working / Completed, Haiku summary per row, answer AskUserQuestion in a peek\n  panel, permission prompts need attach; `claude agents --json` (`state`, `waitingFor`); only backgrounded sessions;\n  subagents are not rows; no notion of flow.md runs.\n- **D. Work-item board**: [Vibe Kanban](https://github.com/BloopAI/vibe-kanban) (\"sunsetting\"), Agent Deck's Fleet\n  board (web mode).\n- Docs: hooks carry `session_id`, `transcript_path`, subagent events `agent_id`/`agent_type`; SubagentStop carries\n  `agent_transcript_path`; Notification types incl. `agent_needs_input`; `PermissionRequest` fires immediately and can\n  decide; a PreToolUse hook can answer AskUserQuestion via `updatedInput.answers`; HTTP hooks; `permission_prompt`\n  fires after ~6 s, `idle_prompt` ~60 s ([hooks](https://code.claude.com/docs/en/hooks#notification)). Transcripts\n  `~/.claude/projects/\u003cproject>/\u003csession-id>.jsonl`, format changes between versions\n  ([sessions](https://code.claude.com/docs/en/sessions#where-transcripts-are-stored)).\n- No tool tracks flow.md phases. \"herd\" is ambiguous (allenan/herd TUI vs poddubnyoleg/herd browser multiplexer)."},{"heading":"Evidence","markdown":"Literature agent, 2026-10-28 (web-mcp papers search, DOIs via Crossref; abstracts only, no full texts). E10 re-fetched\nby the main session ([arXiv:2609.33113](https://arxiv.org/abs/2609.33113)).\n\n| #   | claim                                                                                                   | source                                               | type              | setting                                  | result                                                                                 | transfers here?                                        | strength |\n| --- | ------------------------------------------------------------------------------------------------------- | ---------------------------------------------------- | ----------------- | ---------------------------------------- | -------------------------------------------------------------------------------------- | ------------------------------------------------------ | -------- |\n| E1  | Multi-agent supervision hinges on situation awareness (SA) and calibrated trust                         | 10.1109/THMS.2013.2293535, Chen & Barnes, 2014       | survey            | multi-robot/UxV HRI                      | qualitative                                                                            | partly: same 1:N structure                             | High     |\n| E2  | Agent transparency improves SA and performance without adding workload                                  | 10.1177/00187208221077804, van de Merwe et al., 2022 | systematic review | 17 experiments, safety-critical          | beneficial trend; depends on integration into the main display                         | partly                                                 | High     |\n| E3  | Operator capacity is limited by wait time from lost SA, not interaction time                            | hdl 1721.1/90280, Cummings & Mitchell, 2008          | theory + sim      | independent UAVs                         | wait times cut predicted fan-out up to 67%                                             | yes: \"who is blocked on what\" is that wait             | Low      |\n| E4  | A predictive overload display backfired; management-by-exception best                                   | hdl 1721.1/46751, Cummings et al., 2005              | experiment        | 1 operator, 4 UAVs                       | predictive level worst                                                                 | partly: against forecast-heavy views                   | Low      |\n| E5  | More transparency: better performance and calibration, slower responses                                 | 10.1109/THMS.2020.2978041, Stowers et al., 2020      | experiment        | heterogeneous UxV                        | no workload rise; response time up                                                     | partly                                                 | Med      |\n| E6  | Transparency had no effect for a monitor-only role                                                      | 10.1109/THMS.2019.2925717, Wright et al., 2020       | experiment        | observer of simulated squad              | null                                                                                   | partly: a passive glance view may not gain from detail | Med      |\n| E7  | Interruptions at (coarse) subtask boundaries cost least                                                 | hdl 2142/11088, Iqbal et al., 2005                   | experiment        | lab desktop tasks                        | cost reduced at boundaries                                                             | yes: non-blocking events can wait for a breakpoint     | Low      |\n| E8  | Batched notifications beat immediate and none                                                           | 10.1016/j.chb.2019.07.016, Fitz et al., 2019         | field RCT         | n=237 phone users                        | more attention/control, less stress; none raised anxiety                               | partly: progress yes, blocking questions no            | Med      |\n| E9  | Alerts during heavy dual-task load are disregarded; right after a task they aren't                      | 10.1287/isre.2016.0644, Jenkins et al., 2016         | experiment        | security warnings                        | timing removes the effect                                                              | partly                                                 | Med      |\n| E10 | Planning view + run log + ambient dashboard raised throughput and concurrent agents for parallel coding | arXiv 2609.33113, ParallelPilot, 2026                | preprint          | N=16 within-subjects, short coding tasks | +63% throughput, +1 agent at peak, less tracking/context switching; no gain in control | yes, closest; short tasks not hour-long flows          | Low      |\n\n- **Agrees:** lost SA limits fan-out (E1, E3, E4); an at-a-glance status/intent view helps at little cost (E2, E10);\n  non-urgent events cost less deferred or batched (E7, E8, E9).\n- **Conflicts:** transparency slows responses (E5) vs no effect when only monitoring (E6) vs overload from more\n  predictive detail (E4). Reading: blocking questions and state prominent, subagent detail one keystroke away (E10's\n  own recommendation: \"pair high-level awareness with low-cost paths back to the implementation evidence\").\n- **Gaps:** no study compares task boards with run-centric views; nothing on nested sub-agents or hour-long resumable\n  runs; no terminal-UI evidence; agent tracing work (arXiv 2411.05285) is taxonomy without user studies.\n- **Proposed effect:** blocked-wait latency from hook logs (blocking event → next input in that session), median and\n  p90 per day, plus waits over 10 min; aim ≥30% lower than a 1–2 week baseline (E3, E10). Guardrail: focus switches\n  into a session that end without input should not rise (E4, E7, E8).\n\nChecked in this session (2026-10-28):\n\n- Subagent transcripts on disk (`~/.claude/projects/\u003cproj>/\u003csession>/subagents/agent-\u003cid>.jsonl`, plus a\n  `.meta.json` with `agentType`, `description`, `model`, `finished`) hold tool calls with inputs and results, but\n  every `thinking` block's text is empty (literature agent: 10 thinking blocks, all length 0; the main session's too).\n  \"What it thinks\" can't be read back from disk; only the text it writes and its tool inputs.\n- Agent teams ([docs](https://code.claude.com/docs/en/agent-teams#choose-a-display-mode)): experimental\n  (`CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS=1`); `teammateMode: \"tmux\"`/`\"auto\"` puts each teammate, a full Claude Code\n  session, in its own tmux split pane; click a pane to talk to it; permission prompts go to the lead. A named Agent\n  call becomes a teammate. Not supported natively in Windows Terminal or Ghostty (tmux inside Ghostty is fine);\n  in-process mode works everywhere (agent panel, Enter opens a teammate). Limits: in-process teammates not restored on\n  `/resume`, one team per session, no nested teams, higher token cost. Shared task list has dependencies and a\n  blocked state."},{"heading":"Brainstorm answers","markdown":"- 2026-10-28: current setup covers \"maybe like 10% of the goal\"; \"quit annoying\".\n- 2026-10-28: \"i often dont do parallel work. I ususaly do one or at most two sessions in parallel and I like to\n  actually see what the agents does. What it edits what it thinks and I think about the problems as well and give\n  input where needed. With the current setup I often have no idea on which task the agent is. Does it have any\n  problems etc. Also did I forget to finish a flow etc.\"\n- 2026-10-28: \"im not sure if its really optimal what im doing but software factories just feel wrong idk. What im\n  missing is just good visualisation of the markdown files. Mermaid diagrams or uml or whatever would be awesome.\n  Espeically with sdd I dont really see what the agent is doing or at least not really well\"\n- 2026-10-28 (visual companion, picked A \"flow map\"): \"For A I probably would need a better visualization how are\n  they connected maybe they can run in parallel. Also what problems where found would be interesting. What i was\n  initionally thinking and abolsutly no idea if its possible to essentialy have these claude 1 conducter window |\n  subagent one | subagent two grid or something\"\n- 2026-10-28: \"the agent should know that im able to properly see them but I dont want the agent to force to write\n  them since not every task requires it! Also important is that similar to pi the app is easily changable and\n  customizable from agents!\" pi: extensions are TypeScript modules auto-discovered in `~/.pi/agent/extensions/` or\n  `.pi/extensions/`, hot-reloaded with `/reload`, \"pi can create extensions. Ask it to build one for your use case.\"\n  ([pi extensions.md](https://github.com/earendil-works/pi/blob/main/packages/coding-agent/docs/extensions.md), text\n  read via the mirror https://github.com/pi0/pi-mono/blob/main/packages/coding-agent/docs/extensions.md).\n- 2026-10-28: A means \"the different conductor runs and then when we switch to sdd to see the different tasks that\n  should be done reviews etc\" (runs-v3 mockup: \"A looks awesome\").\n- 2026-10-28: \"teammates sound interesting but do they work onj windows? and A looks awesome but I dont think\n  integrating it in claude code is possible\"; then \"I want ot also improve the visulization of the flows, specs etc\n  with for example mermaid diagrams etc. I just dont see this working good in claude code allone.\""},{"heading":"Options","markdown":"### Surface and shape\n\nPicked: Claude Code stays in the user's terminal, and a separate desktop window (Tauri) draws what the sessions and\ntheir subagents do, from captured events, flow.md, the SDD ledgers and transcripts; watching only, no interacting\nwith Claude.\n\nOffered 2026-10-28, with evidence: E2, E10 back an at-a-glance state view with detail one step away; E4, E5 warn\nagainst always-on detail; E6 says showing more pays off for people working with the agents, not people who only\nwatch. Nothing in the literature compares surfaces.\n\n- Diagrams in the docs only, viewed in existing Markdown renderers (S). Kept as a slice, not the whole answer.\n- Own desktop window, Tauri (L).\n- Terminal viewer in its own pane (L): rejected by the user, diagrams don't work well in a terminal.\n- Desktop cockpit hosting Claude Code in embedded PTYs (L+): replaced; running Claude Code inside the app is the risky\n  part.\n- Terminal cockpit hosting Claude Code (like CCManager): rejected, text-only diagrams and a terminal in a terminal.\n- Agent teams in tmux panes: Linux only (no Windows Terminal split panes); separate question, not picked.\n- **Picked (user's proposal, recommended):** Claude Code stays in the user's terminal; hooks and a mod capture what the\n  session and its subagents do into per-session event files; a separate desktop window (Tauri) follows those files\n  plus flow.md, the SDD ledgers and transcripts, and draws runs, phases, the task graph and review loops, live agent\n  activity, and the docs with Mermaid. **Scope (user, 2026-10-28):** \"lets first just focus on the visulisation and\n  capturing what claude code and the subagents to do just visulize everything that happens with the flows and keep\n  the actually interacting with claude out of it for now\". No answering questions, no starting flows, no typing.\n\n### Language\n\nPicked: Rust core, TypeScript views (user, 2026-10-28).\n\nRust extensions considered: a 15-line serde cdylib built in 6.4 s clean, 0.75 s release / 0.32 s debug incremental on\nthis machine (24 cores), so compile time isn't the objection; drawing in the webview, no stable plugin ABI, a\ntoolchain on every machine and a longer agent loop are.\n\n### Spike\n\nPicked: a throwaway clickable prototype from real data, agreed 2026-10-28.\n\n\"Lets create a prototype for that. So my inial idea was to have a drop down\nto select the projects im working on. And a list of flows that currently run or have run with filter and sort. I can\nsee on which steps they are, are they waiting, what kind of flow was it etc. When I click of them I get the detailed\nview with task list chat out put etc\". Built as a clickable page in the brainstorm companion from real data (a\nscratchpad extraction script), not Tauri; nothing of it is kept without going through the plan.\n\nWhat the spike showed (2026-10-28):\n\n- Reading everything from disk is cheap: 19 flows, 638 sessions (750 MB of transcripts), build logs and subagent\n  files in about 1.4 s, using one `grep` pass to link sessions to flows.\n- A project is more than one folder: sessions ran in `~/dead-claude-skills`, the flows now live in\n  `~/projects/dead-claude-skills`, plus worktrees under `.claude/worktrees/`. The prototype folds them by folder name.\n- Linking a session to a flow works when the session edited or wrote that flow's flow.md; a mere mention links nearly\n  every session to every flow.\n- \"Waiting on you\" from \"the last message ends with a question\" flagged web-mcp, idle 5 days, with 16 of 18 tasks done:\n  a forgotten run, not a live question. Live state needs the capture; disk alone gives history.\n- No plan declares task dependencies, so the graph can only show plan order. No existing spec or plan has a Mermaid\n  block.\n- The brainstorm companion reloads or blanks a full-document page; the prototype is served on its own port instead.\n- User, 2026-10-28: \"the shape feels right but most of it have really hard edges. Its really important that its easy\n  and nice to read\". Readability is a goal of its own, not polish.\n- Restyle (hallmark, app scope, fast mode): Night City's own palette from `plugins/default/themes/night-city.json`\n  instead of saturated ad-hoc colours, IBM Plex Sans 16px body, tone-stepped surfaces instead of 1px borders, rounded\n  rows and panels, prose capped at 72–75ch, tool calls as one quiet line that opens to the diff or command, Mermaid\n  themed dark to match, inline code rendered in log lines. `sloplint --scope app`: clean. The blank pages seen while\n  testing were the headless test browser dropping every tab about 10 s after it opened (an untouched list page too),\n  not the page or Mermaid.\n- User, 2026-10-28: \"table good, but the individual runs are still quit messy and really hard to read or not able to\n  read at all\". Run view rebuilt around reading: the Build tab opens with a two-sentence summary (\"16 of 18 tasks\n  done. Next up: …\"), one line per task with a plain state (\"Done after 2 fix rounds\"), and a task opens to \"What\n  happened\" as numbered sentences, then Security, Decisions (decision, why, if wrong) and Left for later. The plan-order\n  diagram is gone (a straight line says nothing). The Conversation tab groups the transcript into turns, newest first:\n  your prompt, the work folded into one line (\"Changed 6 files, ran 16 commands\"), earlier notes folded, Claude's\n  answer; older turns clamp to six lines. Wrapped build-log lines are now joined by the extractor.\n- User, 2026-10-28: \"task view is shit, i see there are 10 task but what do they do I cant see at a glance. Decisions\n  are really hard to read. COnversations is just a long list of text. Its so hard to read. Docs same issue again and\n  overview not sure about that\". Diagnosis: the source text is written for agents (a plan task is a title plus a dense\n  interface spec, no plain \"what it does\" line; ledger lines and rulings are compressed technical prose; transcripts\n  are long by nature). Restyling can't make that glanceable; it needs a distilling step, written by the flows or by a\n  model in the app.\n- For the real app: rendered Markdown from transcripts and build logs is untrusted (web pages end up in them), so it\n  needs a sanitiser before it reaches the DOM; the prototype doesn't have one.\n\n### Readable documents or model summaries\n\nPicked: better source documents, which the viewer draws as UI by their structure; Haiku summaries not picked.\n\n- User, 2026-10-28, on \"flows write it\" vs \"Haiku summarises\": \"instead of just rendering markdown could we just\n  enhance whats written. I will change the flow.md and shit a bit better etc\". Direction: better source documents\n  (the user reworks them), and a viewer that recognises their structure and draws it as UI instead of rendering\n  Markdown as is. Haiku summaries not picked.\n\n### Which documents get the readable format\n\nPicked: flow.md and the plan; the build log stays as it is for now.\n\n- 2026-10-28, which documents get the readable format: offered flow.md only / flow.md + plan / + build log\n  (recommended flow.md + plan). User: \"2\". The plan's part (one plain line per task, dependencies) goes in through a\n  conductor override of `writing-plans`; the build log stays as it is for now.\n\n### Mod or no mod\n\nPicked: no mod. The capture and transcripts cover agent state, questions and permission prompts; a mod is revisited\nonly if a gap shows (plan review round 1, 2026-10-28).\n\n### Flow run view\n\nPicked: the mockup in `crates/flow-cockpit/design/run-view.html` after three reworks, approved 2026-10-28 (\"its\nfucking awesome!!! lets goo\"): an app window on one grid; Build is a phase track and one-line task rail beside the\nselected task, with folds styled as rows; Decisions and Docs are master and detail; installed fonts; the Night City\npalette unchanged.\n\nMockup round 1 (2026-10-28, `crates/flow-cockpit/design/run-view.html`): the user likes the theme and the colouring,\nand hates the alignment: \"it 100% looks like ai and kinda lazy\", \"also half the screen is empty\" (a centred capped\ncolumn at ~1880 px). Fonts: installed ones, no bundled or downloaded font. Reworking it as an app window that fills\nthe width on one grid, with fewer boxes; not picked yet.\n\nMockup round 2 (2026-10-28): \"definetly a good step up but now its just bam 3 or 4 walls of text. Its overwhelming a\nbit but definetly the right direction\"; the user asked Claude to analyse it. Reworking for one focal point per\nscreen: the selected task on Build, phases as one line, one-line task rows, decisions as expandable lists, no task\nrail on Decisions and Docs.\n\nMockup round 3 (2026-10-28): \"Rest awesome except the decissions tab\". The user moved the chapters to the right on\nDocs, with the documents on the left. Two changes asked: the clickable inline links in Build (\"the build log, 1\nentry\") don't fit the scheme; Decisions should be decisions and deviations on the left with the text in the middle."},{"heading":"Plan review","markdown":"**Round 1 (2026-10-28).** Reviewers: Correctness (fable), Fit (opus, blast-radius), Simpler (sonnet, ponytail-review).\n37 findings, about 30 after merging; none dropped (each traced to a file:line or a fetched doc). Decisions by the user:\n\n- Slicing: nothing visible before task 10 of 12 → **two slices** (slice 1 used daily before slice 2). Picked.\n- Capture duplicated transcripts, and \"Stop after a question\" never fires interactively → **capture only what\n  transcripts lack**; waiting = an unfinished AskUserQuestion or a permission prompt with no later event; working =\n  transcript grew in 2 minutes. Picked. Spec edit, Gate 1 reopened.\n- Windows: the installer keeps only the exe from a zip, the app isn't on PATH → **built-in views embedded**,\n  `--print-view`, the app at `%USERPROFILE%\\.claude\\bin\\flow-cockpit.exe` with its path printed, no shortcut. Picked.\n- Technical fixes, all applied as recommended (\"Apply all\"): workspace grows with the tasks; ts-rs bindings exported\n  to `crates/flow-cockpit/bindings/` with a drift test ignoring line endings; vendored libs and bindings excluded from\n  treefmt and kept LF; numbered gate lines in implement/fix-flow/upgrade and no `\u003cdate>` placeholders; checkTemplates\n  covers gates, `Depends on:` and implement/upgrade; audit `Picks:`/`Fixed` lines (spec edit); views loaded as\n  source over IPC from a `blob:` URL instead of a custom scheme (no path escapes, no CORS); no inline style or script\n  in the shell; a 2 s poll instead of notify; link scan cached and after first paint; worktrees found without\n  sessions; CI core jobs `-p flow-cockpit-core`, Nix install action pinned; Windows icon and no console window;\n  `wrapGAppsHook3`, workspace version in the flake, timing tests skipped in the Nix build; Nix hint pinned to the\n  release; installer reuses `applyBin` with a Linux hint; DOMPurify tested under jsdom (devDependency); parallel\n  append test at the largest line; capture folder 0700; partial lines tolerated in transcripts; SubagentStop without\n  start ignored; Task 1 (mod probe) dropped, \"no mod\" recorded; the mockup kept as the run view's reference.\n\n**Round 2 (2026-10-28).** One reviewer (opus) on the rewrite: every round-1 decision was in place; 15 findings in what\nthe rewrite introduced, none changing a decision. User: \"Apply all\". Changed: the runtime, blocks, vendored libraries\nand tokens move to `app/shell/` as JS with JSDoc types checked by `tsc --checkJs` (blob-imported views can't import\nfiles; views get everything through `ctx`, a value `import` is an error); the views tests run only in\n`flow-cockpit.yml` after `npm ci`; bindings exported by one ignored test per crate for every crossing type, compared\nby `bindings_are_current`; `--print-types` for views outside the repo; Tauri capability file, `identifier`, `app/gen/`\nignored; `Index::build` without links plus `scan_links` and `rebuild_project`; the poll covers the capture folder and\nfolders created later; missing Files entries (Cargo.toml/lock, the `.ico`, dump tests, fixtures); `include_dir!` from\n`$CARGO_MANIFEST_DIR`; Windows `--version` readable through a pipe; audit and session summaries defined and tested;\n`now:` starts with \"Waiting for you\" at every stop (spec edit); the plugin hidden on Windows in slice 1 and offered\nagain in Task 13 with the missing installer files; capture drops `last_message`; the flow-rules line reference fixed."},{"heading":"Tasks","markdown":"Task 1: base 7bfc93e, untracked at start: none; head 1803f42, files check clean; review approved, 3 minors deferred\nTask 2: base 1803f42, untracked at start: none; head 595cbca, files check clean; review: 1 fix round (4 Important addressed), 7 minors deferred\nTask 3: base 595cbca, untracked at start: none; head 83976f1, files check clean; review: 1 fix round (2 Important addressed), 4 minors deferred\nTask 4: base 83976f1, untracked at start: none; head b1f0975, files check clean (ignored included); review: 1 fix round (1 Critical, 2 Important, 3 decided addressed), 7 minors deferred\nTask 5: base b1f0975, untracked at start: none; mockup approved after 3 reworks"},{"heading":"Rulings","markdown":"- 2026-10-28, setup: Task 5 keeps every existing flow.md section while converting; the controller writes flow.md only\n  between tasks — both write flow.md — costs a manual merge if a line lands mid-task.\n- 2026-10-28, setup: the brief clause and Global Constraints go verbatim into the build workspace's `rules.md`, which\n  every implementer and reviewer prompt names first — one copy of the same text — costs a subagent that skips it.\n- 2026-10-28, setup: Task 9 Step 5 runs as `claude -p --plugin-dir` — no interactive session from the controller —\n  costs not seeing the live reload by eye until the slice checkpoint.\n- 2026-10-28, Task 2: ts-rs 12 writes type-only `.ts` bindings, taken as the \"generated `.d.ts`\" since\n  `--print-types` joins them into one declaration file — costs a rename there if tsc objects.\n- 2026-10-28, Task 2: the copied real fixtures in `core/tests/fixtures/` are excluded from treefmt — a reformatted copy\n  no longer tests the real shape — costs those fixtures staying unformatted.\n- 2026-10-28, Task 3: a user entry opens a turn only when it isn't `isMeta` and its text (a string or an array's text\n  blocks) doesn't start with `\u003c` — the literal rule made real meta entries into prompts and dropped image prompts —\n  costs a fix round.\n- 2026-10-28, Task 4: status precedence is Done, Waiting, Working, Stale, Idle — the spec lists Waiting first and a run\n  waiting on the user stays theirs to act on — costs a wait of 4 days never reading Stale.\n- 2026-10-28, Task 4: `Config::parse`/`load`, `Default` on `LinkCache` and `LinkCache::bytes_read()` are implied by the\n  brief, not deviations — none crosses to the views — costs three public items the plan didn't name.\n- 2026-10-28, Task 4: a per-line head cap and `rebuild_project` recomputing roots first join the fix round — both made\n  a session vanish, against \"any Claude session's activity can be found\" — costs a larger fix round; folders that match\n  no root wait for Task 6, which calls `build` when a new folder appears in `~/.claude/projects`."},{"heading":"Deviations","markdown":"### Task 3 transcript fixtures are hand-written, not trimmed real ones\n\nThe plan asked for trimmed real transcripts. Copying them into the public repo was blocked, so the implementer reads\nreal transcripts only for their JSON shapes and field names and writes the fixture lines with invented text.\n\nStatus: decided 2026-10-28: hand-written in the real shape\n\n### Subagent text replies have no place in the activity model\n\nThe plan's `Text` carries no agent, so Task 3 dropped every subagent reply, final reports included; only their tool\ncalls showed.\n\nStatus: decided 2026-10-28: `Text` gains `agent: Option\u003cString>`, and subagent replies land in the turn open at their\ntime\n\n### Status never decays without a file change\n\nStatus was derived only when a project's files changed, so a run whose Claude session stopped stayed Working.\n\nStatus: decided 2026-10-28: `Index::refresh(now)` re-derives every status from cached facts without reading the disk;\nTask 6's poll calls it each tick"},{"heading":"Follow-ups","markdown":"- **Headless browsers break on this machine** (seen 2026-10-28 in Task 5; the user asked to fix it later):\n  - The Chrome that agent-browser installs (Chrome for Testing) doesn't start here: it lacks libglib on NixOS. That\n    leaves hallmark's `sloplint --render` without a browser; the implementer pointed puppeteer-core at Helium by hand.\n  - Headless Helium reloads any page that links the Google Fonts stylesheet (\"Execution context was destroyed\"),\n    traced to that one `\u003clink>`.\n  - web-mcp's `browser` on the same page showed the first screenshot, then the tab was on `about:blank` after a\n    scroll and `document.body` was null; likely the same cause."},{"heading":"Walkthrough","markdown":"| spec goal | plan task | file:line | test |\n| --------- | --------- | --------- | ---- |"},{"heading":"Run verdict","markdown":""}],"title":"Flow observability: flow"}</script>
<script type="application/json" id="plan-json">{"tasks":[{"depends_on":[],"does":"Makes every new flow run write a `now:` line, numbered gate lines, `###` decisions and deviations, a plain purpose and dependencies for each plan task, and audit picks and fixes, and makes check-repo fail when one goes missing.","markdown":"**Does:** Makes every new flow run write a `now:` line, numbered gate lines, `###` decisions and deviations, a plain\npurpose and dependencies for each plan task, and audit picks and fixes, and makes check-repo fail when one goes missing.\n**Depends on:** none\n\n**Files:**\n\n- Modify: `plugins/flows/skills/feature-flow/references/flow-template.md`,\n  `plugins/flows/skills/research-flow/references/research-template.md`, `plugins/flows/references/build-template.md`\n- Modify: `plugins/flows/references/flow-rules.md` (State :13-18, Gates :36-37, the fifth stop :46-47, Calling another\n  conductor :132, Reports :201-211, one diagram line), `plugins/flows/skills/feature-flow/SKILL.md` (:28, Phase 2\n  Options :67-70, Phase 4 :106-111), `plugins/flows/skills/implement/SKILL.md` (plan input :42-47, Gate :49-51),\n  `plugins/flows/skills/fix-flow/SKILL.md` (Gate :48), `plugins/flows/skills/upgrade/SKILL.md` (plan :38, Gate :39-40)\n- Modify: `scripts/flows-uses.mjs` (new `checkTemplates`), `scripts/check-repo.mjs:63`, `scripts/flows-uses.test.mjs`\n\n**Interfaces:**\n\n- Produces: `export function checkTemplates(root: string): string[]`; the template shapes below (Task 2 parses them).\n\n- [ ] **Step 1: Write the failing tests** in `scripts/flows-uses.test.mjs`:\n      `checkTemplates on the real repo returns []`; one fixture test per missing part, each asserting one problem string naming the file: `now:` in a template's\n      frontmatter, the `Waiting for you` rule in flow-rules State, the Gates line shape (`- Gate \u003cn>, \u003cwhat>:` in the\n      comment), `Picked:`, `Status:`, `**Does:**` and `**Depends on:**` in feature-flow, implement and upgrade\n      SKILL.md, `Picks:` and `Fixed` in flow-rules Reports.\n- [ ] **Step 2:** `node --test scripts/flows-uses.test.mjs`; expect FAIL (`checkTemplates is not a function`).\n- [ ] **Step 3: Templates.** In all three: `now: \u003cone plain sentence: where the run stands and what comes next>`\n      after `phase:`; `## Gates` with a comment giving `- Gate \u003cn>, \u003cwhat>: \u003cdate>[, \u003cextra>]`, the date empty while\n      open (replace the `\u003cdate>` placeholders), a reopening appended as `Reopened \u003cdate>: \u003cwhy>`; `## Options` (added to\n      build-template) with `### \u003cdecision>` then `Picked: \u003cthe choice in plain words>`; `## Deviations` with\n      `### \u003cdeviation>` then `Status: open` or `Status: decided \u003cdate>: \u003cwhat>`.\n- [ ] **Step 4: Conductor text.** flow-rules State: the conductor rewrites `now:` after every phase and at every stop\n      where it waits for the user, and at such a stop it starts with `Waiting for you`; a flow.md without `now:` gets it\n      when resumed (next to the Tasks/Rulings sentence); a conductor called inline writes into its caller's `now:`.\n      Gates: the line shape. Fifth stop: `### \u003cdeviation>` with `Status: open`, then `Status: decided \u003cdate>: \u003cwhat>`.\n      Reports: `Picks: \u003cfinding numbers> | none` and `Fixed \u003cdate>: \u003cnumber>` per pick once its check passes.\n      feature-flow :28 adds `now:`; Phase 2 Options: `###` with `Picked:`; Phase 4, implement's plan input (next to the\n      Files rule) and upgrade's plan line: every task gets\n      `**Does:** \u003cone plain sentence for a reader who doesn't know the code>` and `**Depends on:** Task \u003cn>, … | none` right below its heading. implement, fix-flow and upgrade name\n      their gate lines (`- Gate 1, \u003cwhat>: \u003cdate>`). One line in flow-rules: \"The user reads specs, plans and flow.md in\n      the flow cockpit, which draws Mermaid: use a diagram where it explains something better than prose; never\n      required.\" No `overrides` marker is needed.\n- [ ] **Step 5: Implement `checkTemplates(root)`;** spread it into `check-repo.mjs:63`.\n- [ ] **Step 6:** `npm test`; expect PASS (`checkOverrides` included).\n- [ ] **Step 7:** Commit: `Give flow.md, plans and audits a format the flow cockpit can read.`","n":1,"title":"The format contract in the flows"},{"depends_on":[1],"does":"Creates the Rust core that turns flow.md, plan.md, audit reports and SDD build logs into typed data, old shapes included.","markdown":"**Does:** Creates the Rust core that turns flow.md, plan.md, audit reports and SDD build logs into typed data, old\nshapes included.\n**Depends on:** Task 1\n\n**Files:**\n\n- Create: `crates/flow-cockpit/Cargo.toml` (`[workspace] members = [\"core\"]`, `[workspace.package] version` and\n  edition 2024), `crates/flow-cockpit/Cargo.lock`, `crates/flow-cockpit/core/Cargo.toml` (package\n  `flow-cockpit-core`; `serde`, `ts-rs`), `core/src/lib.rs`, `core/src/doc/{mod,flow,plan,audit,ledger}.rs`,\n  `core/src/bindings.rs` (`export_bindings`, `bindings_are_current`), `core/tests/fixtures/docs/` (the three templates\n  filled in; real old flow.md files: click-to-read, cyberpunk-theme, language-skills, web-mcp, web-mcp-search,\n  flow-pane, agent-browser-pr-review-fixes; web-mcp's build-log excerpt; an audit report in the new shape and one\n  without `Picks:`), `crates/flow-cockpit/bindings/` (generated, committed)\n- Modify: `scripts/check-repo.mjs:94-101` (`CRATES` gains `crates/flow-cockpit` with lock name `flow-cockpit-core`),\n  `scripts/release.mjs` (the crate list), `treefmt.toml` and `flake.nix` `vendored` (exclude\n  `crates/flow-cockpit/bindings/`), `.gitattributes` (`crates/flow-cockpit/bindings/** eol=lf`)\n\n**Interfaces (all `#[derive(Serialize, TS)]`):**\n\n- `pub fn parse_flow(text: &str) -> FlowDoc`;\n\n  `FlowDoc { flow: Option\u003cString>, phase: Option\u003cString>, now: Option\u003cString>, title: Option\u003cString>, gates: Vec\u003cGate>, decisions: Vec\u003cDecision>, deviations: Vec\u003cDeviation>, sections: Vec\u003cSection> }`; `Gate { n: u8, what: String, approved: Option\u003cString>, reopened: bool, raw: String }`;\n  `Decision { title: String, picked: Option\u003cString>, body: String }`;\n  `Deviation { title: String, status: DeviationStatus, body: String }`;\n  `DeviationStatus = Open | Decided { date: Option\u003cString>, what: String } | Unknown`; `Section { heading: String, markdown: String }`.\n\n- `pub fn parse_plan(text: &str) -> PlanDoc`; `PlanDoc { title: Option\u003cString>, tasks: Vec\u003cPlanTask> }`;\n  `PlanTask { n: u32, title: String, does: Option\u003cString>, depends_on: Option\u003cVec\u003cu32>>, markdown: String }`\n  (`None` = not written, `Some(vec![])` = `none`).\n- `pub fn parse_audit(text: &str) -> AuditDoc`;\n  `AuditDoc { scope: Option\u003cString>, findings: Vec\u003cFinding>, picks: Option\u003cVec\u003cu32>>, fixed: Vec\u003cu32>, open: Option\u003cbool> }` (`open: None` without a `Picks:` line);\n  `Finding { n: u32, severity: String, location: String, text: String }`.\n- `pub fn parse_ledger(text: &str) -> Ledger`;\n  `Ledger { plan: Option\u003cString>, tasks: Vec\u003cLedgerTask>, rulings: Vec\u003cString> }`;\n  `LedgerTask { n: u32, state: TaskState, fix_rounds: u32, security: Vec\u003cString>, later: Vec\u003cString>, story: Vec\u003cString>, model: Option\u003cString> }`; `TaskState = NotStarted | Building | Review | Waiting | Done`.\n\n- [ ] **Step 1: Write the failing tests:** `flow_reads_now_and_numbered_gates`; `gate_without_date_is_open` (empty\n      and `\u003cdate>`); `gate_reopened_without_reapproval_is_open` and `gate_reopened_then_reapproved` (the removed band's\n      rule: the last date counts only if it comes after the last \"reopened\"); `decisions_read_picked`;\n      `deviation_status_open_and_decided`; `old_deviation_shapes_are_unknown_not_lost`; `missing_frontmatter_is_none`;\n      `crlf_is_read`; `plan_reads_does_and_depends`; `ledger_joins_wrapped_lines`;\n      `ledger_counts_fix_rounds_and_security` (web-mcp excerpt → task 5: 2 fix rounds); `audit_reads_picks_and_fixed`\n      (open while a pick lacks `Fixed`); `audit_without_picks_is_unknown`; `parses_every_flow_md_in_repo` (walks\n      `docs/features/*/flow.md` from the repo root: no panic, `phase` read where present);\n      `templates_parse_with_every_part`; `bindings_are_current`.\n- [ ] **Step 2:** `cargo test -p flow-cockpit-core` in `crates/flow-cockpit`; expect FAIL.\n- [ ] **Step 3: Implement** the parsers line by line: frontmatter as flat `key: value` lines between the first two\n      `---` (no YAML crate); sections split on `## `; `###` entries inside Options and Deviations; `\u003c!-- -->` stripped.\n      No input panics. Generate the bindings with `cargo test -p flow-cockpit-core export_bindings -- --ignored`.\n- [ ] **Step 4:** `cargo test -p flow-cockpit-core`,\n      `cargo clippy -p flow-cockpit-core --all-targets -- -D warnings`, `npm test`; expect PASS, and `git status` shows no untracked file outside this task's list.\n- [ ] **Step 5:** Commit: `Add the flow cockpit core with parsers for flow runs, plans, audits and build logs.`","n":2,"title":"The core crate and the document parsers"},{"depends_on":[2],"does":"Lets the core show what a Claude session and each of its subagents did, turn by turn, from the transcripts.","markdown":"**Does:** Lets the core show what a Claude session and each of its subagents did, turn by turn, from the transcripts.\n**Depends on:** Task 2\n\n**Files:**\n\n- Create: `core/src/activity/{mod,transcript}.rs`, `core/tests/fixtures/transcripts/` (trimmed real main and subagent\n  transcripts with their `.meta.json`, one ending in a half line)\n- Modify: `core/Cargo.toml` and `crates/flow-cockpit/Cargo.lock` (`serde_json`), `core/src/lib.rs`,\n  `core/src/bindings.rs`, `crates/flow-cockpit/bindings/`\n\n**Interfaces (crossing types derive `TS`):**\n\n- Produces: `pub fn read_transcript(main: &Path) -> Transcript` (subagents from `\u003csession>/subagents/agent-*.jsonl`\n  and their `.meta.json`); `pub fn activity(t: &Transcript) -> Activity`;\n  `Activity { turns: Vec\u003cTurn>, agents: Vec\u003cAgentInfo>, live: Live }`; `Turn { prompt: Option\u003cText>, replies: Vec\u003cText>, tools: Vec\u003cToolCall> }`;\n  `Text { at: String, text: String }`;\n  `ToolCall { id: String, at: String, agent: Option\u003cString>, tool: String, summary: String, detail: ToolDetail, failed: bool }`;\n  `ToolDetail = Edit { file, old, new } | Write { file, content } | Command { command, description: Option\u003cString> } | Other { json }`;\n  `AgentInfo { id, description: Option\u003cString>, kind: Option\u003cString>, model: Option\u003cString>, started: Option\u003cString>, ended: Option\u003cString> }`;\n  `Live { waiting: Option\u003cString> }` (always `None` until Task 11). `Transcript` is internal.\n\n- [ ] **Step 1: Write the failing tests:** `ignores_partial_last_line`; `skips_unknown_entries`;\n      `turns_group_by_prompt`; `tool_results_mark_failures`; `subagent_tools_carry_agent`; `edit_detail_has_old_and_new`;\n      `thinking_blocks_are_skipped` (empty thinking never becomes a reply).\n- [ ] **Step 2:** `cargo test -p flow-cockpit-core activity`; expect FAIL.\n- [ ] **Step 3: Implement.** A user entry with string content not starting with `\u003c` opens a turn. Regenerate bindings.\n- [ ] **Step 4:** Tests (`bindings_are_current` included) and clippy PASS.\n- [ ] **Step 5:** Commit: `Read transcripts into turns, tool calls and agents.`","n":3,"title":"Activity from transcripts"},{"depends_on":[2,3],"does":"Finds the user's projects and, per project, its flow runs, audits and loose sessions with their status.","markdown":"**Does:** Finds the user's projects and, per project, its flow runs, audits and loose sessions with their status.\n**Depends on:** Task 2, Task 3\n\n**Files:**\n\n- Create: `core/src/index/{mod,projects,entries,status,links,config}.rs`, `core/tests/fixtures/home/` (a fake\n  `~/.claude/projects` with two checkouts of one repo, a `.claude/worktrees/x` and a `.worktrees/y` no session ran in,\n  a `docs/audits/` report, transcripts, and a `config.toml`)\n- Modify: `core/Cargo.toml` and `crates/flow-cockpit/Cargo.lock` (`toml`, `jiff`), `core/src/lib.rs`,\n  `core/src/bindings.rs`, `crates/flow-cockpit/bindings/`\n\n**Interfaces (crossing types derive `TS`):**\n\n- Produces: `pub struct Index` with `pub fn build(home: &Home, config: &Config, now: jiff::Timestamp) -> Index` (no\n  link scan), `pub fn scan_links(&mut self, cache: &mut LinkCache)`,\n  `pub fn rebuild_project(&mut self, id: &str, now: jiff::Timestamp)`, `projects(&self) -> Vec\u003cProject>`, `entries(&self, project: &str) -> Vec\u003cEntry>`,\n  `flow_run(&self, project: &str, slug: &str) -> Option\u003cFlowRun>`,\n  `doc(&self, project: &str, slug: &str, name: DocName) -> Option\u003cString>`, `session(&self, id: &str) -> Option\u003cActivity>`.\n- `Home { claude_projects: PathBuf, capture_dir: PathBuf }`; `Config { trusted: Vec\u003cPathBuf>, hidden: Vec\u003cString> }`\n  from `config.toml`; `LinkCache` keyed by (path, size, mtime), in memory.\n- `Project { id, name, roots: Vec\u003cPathBuf> }`;\n  `Entry = FlowRun(FlowRunSummary) | Audit(AuditSummary) | Loose(SessionSummary)`;\n  `FlowRunSummary { slug, conductor, phase, now: Option\u003cString>, status: Status, gates: Vec\u003cGate>, open_deviations: u32, progress: Option\u003c(u32, u32)>, last_activity: String, copies: u32 }`;\n\n  `AuditSummary { file: String, date: String, conductor: String, scope: Option\u003cString>, findings_by_severity: Vec\u003c(String, u32)>, open: Option\u003cbool> }`;\n  `SessionSummary { id: String, started: String, last_activity: String, first_prompt: Option\u003cString> }`; `Status = Working | Waiting | Idle | Stale | Done`;\n  `FlowRun { summary, flow: FlowDoc, plan: Option\u003cPlanDoc>, ledger: Option\u003cLedger>, sessions: Vec\u003cString> }`; `DocName = Flow | Spec | Plan`.\n\n- [ ] **Step 1: Write the failing tests:** `folds_checkouts_by_remote` (same `origin` url in `.git/config`);\n      `folds_by_folder_name_without_remote`; `finds_worktrees_without_sessions` (`.claude/worktrees/*`, `.worktrees/*`,\n      `.git/worktrees/*/gitdir`); `hidden_project_is_left_out`; `newest_copy_wins`; `finds_audits_with_picks_state`;\n      `session_links_by_editing_flow_md` (after `scan_links`); `mention_does_not_link`; `status_rules` (a table: `now:`\n      starting `Waiting for you` → Waiting; done → Done; 4 days quiet → Stale; transcript grew 1 minute ago → Working;\n      else Idle); `loose_sessions_only_last_7_days`; `rebuild_project_touches_one_project`;\n      `second_link_scan_reads_under_2mb` (a 50 MB transcript generated in the test: the first `scan_links` may read it,\n      a second with the same `LinkCache` reads under 2 MB).\n- [ ] **Step 2:** Run; expect FAIL.\n- [ ] **Step 3: Implement.** Project identity from `.git/config` `[remote \"origin\"] url`, else the folder name; no\n      `git` process. A session's cwd from the first `cwd` field in its first 40 lines. Links from Edit/Write tool inputs\n      whose path ends in `docs/features/\u003cslug>/flow.md`. Regenerate bindings.\n- [ ] **Step 4:** Tests and clippy PASS.\n- [ ] **Step 5:** Commit: `Index projects, flow runs, audits and loose sessions with their status.`","n":4,"title":"Projects, entries and status"},{"depends_on":[2],"does":"Shows the user a clickable mockup of the flow run view built from this run's own documents in the new format, and stops until they approve it; the approved page is what the real view is ported from.","markdown":"**Does:** Shows the user a clickable mockup of the flow run view built from this run's own documents in the new\nformat, and stops until they approve it; the approved page is what the real view is ported from.\n**Depends on:** Task 2\n\n**Files:**\n\n- Modify: `docs/features/flow-observability/flow.md` (rewritten into the new format; content kept)\n- Create: `core/tests/dump_this_run.rs` (an `#[ignore]`d test writing this run's `FlowDoc`, `PlanDoc` and `Ledger`\n  JSON to the design folder), `crates/flow-cockpit/design/run-view.html` and its JSON (kept as the reference for Task 8)\n\n- [ ] **Step 1:** Rewrite this run's flow.md into the new format; `parses_every_flow_md_in_repo` still passes.\n- [ ] **Step 2:** Build the mockup with hallmark (app scope, Night City tokens): the `now:` header, the phase stepper\n      with gates, task cards from plan.md (`Does:`, state, problems, the dependency graph in Mermaid), decisions,\n      deviations, docs. Sentences, not log lines; detail one click away.\n- [ ] **Step 3:** Stop. Show the user the mockup; record their decision under Options (`### Flow run view`,\n      `Picked: …`). Changes they ask for go into this file before Task 8 starts.\n- [ ] **Step 4:** Commit: `Add the approved flow run view design.`","n":5,"title":"Design checkpoint: the flow run view"},{"depends_on":[4],"does":"Opens the window and gives views read-only access to the core's data and to their own code, refreshed when files change.","markdown":"**Does:** Opens the window and gives views read-only access to the core's data and to their own code, refreshed when\nfiles change.\n**Depends on:** Task 4\n\n**Files:**\n\n- Create: `crates/flow-cockpit/app/Cargo.toml` (package `flow-cockpit`; `tauri`, `tauri-build`, `include_dir`, the oxc\n  crates, `flow-cockpit-core`), `app/build.rs`, `app/tauri.conf.json`, `app/capabilities/default.json`\n  (`\"windows\": [\"main\"]`, `\"permissions\": [\"core:default\"]`), `app/icons/` (`icon.png`, `icon.ico`, generated once from\n  the mascot PNG that `scripts/draw-mascot.mjs` writes, committed),\n  `app/src/{main,commands,poll,strip,views,paths, bindings}.rs`, `app/shell/index.html`, `app/shell/boot.js`, `app/views/builtin/.gitkeep`\n- Modify: `crates/flow-cockpit/Cargo.toml` (`members = [\"core\", \"app\"]`), `crates/flow-cockpit/Cargo.lock`,\n  `scripts/check-repo.mjs` and `scripts/release.mjs` (lock name `flow-cockpit` added), `.gitignore`\n  (`crates/flow-cockpit/app/gen/`), `crates/flow-cockpit/bindings/`\n\n**Interfaces:**\n\n- Consumes: Task 4's `Index` and types.\n- Produces (Tauri commands, read-only): `projects()`, `entries(project)`, `flow_run(project, slug)`,\n  `doc(project, slug, name)`, `session(id)`, `views() -> Vec\u003cViewInfo>` with\n  `ViewInfo { id, source: Builtin | Global | Repo, replaced: bool }` (derives `TS`), `view_source(id) -> Result\u003cString, String>` (types stripped; the error names the\n  line). Events: `changed { project: Option\u003cString> }`, `views-changed {}`.\n- `flow-cockpit --version` prints `flow-cockpit \u003cversion>`; `--print-view \u003cid>` prints a built-in's TypeScript;\n  `--print-types` prints `api.d.ts` and the bindings as one declaration file.\n- `pub fn capture_dir(env, platform) -> PathBuf` and `pub fn config_dir(env, platform) -> PathBuf` in `paths.rs`;\n  `paths_match_capture_rules` defines the cases (XDG_STATE_HOME set and unset, LOCALAPPDATA) that Task 10 mirrors.\n\n- [ ] **Step 1: Write the failing tests:** `strip_keeps_es_syntax` (optional chaining, class fields, `export default`\n      stay; annotations, `interface`, `import type` go); `value_import_is_an_error` (names the line);\n      `strip_reports_syntax_errors`; `view_lookup_order` (global replaces built-in and is marked `replaced`);\n      `print_view_prints_builtin`; `poll_emits_once_per_change` (10 writes within one 2 s interval → one `changed`);\n      `poll_sees_folders_created_later`; `first_paint_before_link_scan`; `paths_match_capture_rules`;\n      `bindings_are_current` (app types).\n- [ ] **Step 2:** `cargo test -p flow-cockpit`; expect FAIL.\n- [ ] **Step 3: Implement.** `tauri.conf.json`: `identifier: \"dev.deadmade.flow-cockpit\"`, `frontendDist: \"shell\"`,\n      `withGlobalTauri: true`, `bundle.active: false`, one window labelled s`, `noEmit`, includes `api.d.ts` and the bindings), `app/shell/runtime.test.mjs`\n- Modify: `app/shell/index.html` (links `tokens.css`, `vendor/mermaid.min.js` as a classic script, `boot.js`),\n  `app/shell/boot.js`, `app/src/main.rs` (`--print-types` reads `app/shell/api.d.ts` via `include_str!`),\n  `package.json` (devDependency `jsdom`), `treefmt.toml`, `flake.nix` `vendored` and `.gitattributes` (the vendor\n  folder), `THIRD_PARTY.md` (marked MIT, DOMPurify Apache-2.0 or MPL-2.0, mermaid MIT)\n\n**Interfaces:**\n\n- Produces (`api.d.ts`):\n  `export interface View { id: string; title: string; slot: 'list' | 'run' | 'run-tab' | 'doc'; render(ctx: ViewContext): Node | Promise\u003cNode> }`;\n  `ViewContext { data: DataApi; blocks: Blocks; navigate(to: Route): void }`; `DataApi` mirrors Task 6's commands with the bindings' types;\n\n  `Blocks { markdown(text: string): Node; mermaid(source: string): Node; diff(old: string, next: string): Node; stepper(steps: Step[]): Node; card(opts: CardOpts): Node }`. A view file `export default`s a `View`.\n\n- [ ] **Step 1: Write the failing tests** (jsdom): `markdown_strips_script_and_handlers` (`\u003cscript>`, `\u003cimg onerror>`,\n      `javascript:` links gone); `mermaid_fences_become_diagram_nodes` (a fenced `mermaid` block becomes a node handed\n      to mermaid with `securityLevel: 'strict'`); `broken_view_falls_back` (a view whose `view_source` errors, that\n      throws, or that has no default export shows its error card; the built-in renders below it; other views\n      unaffected); `reload_replaces_view_on_change`; `blob_urls_are_revoked`.\n- [ ] **Step 2:** `npm ci && node --test crates/flow-cockpit/app/shell/runtime.test.mjs`; expect FAIL.\n- [ ] **Step 3: Implement** the runtime (`view_source` → `Blob` with `type: 'text/javascript'` → `import()` → revoke;\n      listens to `views-changed`) and the blocks.\n- [ ] **Step 4:** Tests PASS; `npx tsc -p crates/flow-cockpit/app/shell` PASS; `sloplint --scope app` clean; in the\n      real window on Linux, one test view loads and one Mermaid diagram renders.\n- [ ] **Step 5:** Commit: `Add the view runtime and sanitised building blocks.`","n":7,"title":"The view runtime and shared blocks"},{"depends_on":[7],"does":"Draws the list, the flow run, the docs and the activity views as replaceable view files, the run view ported from the approved design.","markdown":"**Does:** Draws the list, the flow run, the docs and the activity views as replaceable view files, the run view ported\nfrom the approved design.\n**Depends on:** Task 7\n\n**Files:**\n\n- Create: `app/views/builtin/{list,run,docs,activity}.ts`, `app/views/builtin/views.test.ts`,\n  `app/views/builtin/fixtures/*.json` (written by an `#[ignore]`d core test `dump_view_fixtures` from the Task 4 home\n  fixture), `core/tests/dump_view_fixtures.rs`, `app/views/tsconfig.json` (type-checks the views against\n  `../shell/api.d.ts`)\n- Delete: `app/views/builtin/.gitkeep`\n\n**Interfaces:**\n\n- Consumes: Task 7's `View` and `Blocks`; `crates/flow-cockpit/design/run-view.html`.\n\n- [ ] **Step 1: Write the failing tests** (jsdom; Node strips the views' types): `list_groups_runs_audits_loose`;\n      `list_filters_and_sorts` (status, conductor, search; activity, needs-you-first, furthest along, name);\n      `run_shows_now_or_phase`; `run_task_cards_use_does_and_graph_only_when_all_depends_written`;\n      `docs_enhances_known_parts` (Gates as stepper, Options as decision cards, the rest Markdown);\n      `activity_groups_turns_newest_first`; `audit_shows_unknown_without_picks`.\n- [ ] **Step 2:** `node --test crates/flow-cockpit/app/views/builtin/views.test.ts`; expect FAIL.\n- [ ] **Step 3: Implement** the four views; only `import type` in them.\n- [ ] **Step 4:** Tests PASS; `npx tsc -p crates/flow-cockpit/app/views` PASS; `sloplint --scope app` clean;\n      `cargo run -p flow-cockpit` shows this repository's runs.\n- [ ] **Step 5:** Commit: `Add the built-in list, flow run, docs /README.md`\n\n**Interfaces:**\n\n- Produces (capture line, JSON, `v: 1`):\n  `{ v, ts, session, cwd, event, agent?, agent_type?, tool_use_id?, questions?, notification_type?, message?, permission_tool?, transcript?, agent_transcript? }`; `questions` from\n  AskUserQuestion input, cut at 16 KiB.\n- Produces: `export function captureDir(env, platform): string`, `export function toLine(input, now): string | null`,\n  `export function prune(dir, now, maxAgeDays = 30): void`, `export async function main({ stdin, env, platform, now })`.\n\n- [ ] **Step 1: Write the failing tests** (`node:test`): `toLine maps PreToolUse AskUserQuestion with tool_use_id`;\n      `toLine maps PermissionRequest without deciding` (no output); `toLine maps SubagentStart with agent_type`;\n      `toLine returns null for invalid JSON`; `captureDir follows XDG_STATE_HOME and LOCALAPPDATA` (Task 6's\n      `paths_match_capture_rules` cases); `prune deletes files older than 30 days only`;\n      `main exits 0 and prints nothing when the capture dir is a file` (ENOTDIR on both OSes); `parallel_appends_stay_whole` (20 spawned\n      writers × 50 lines with 16 KiB `questions`, JSON-escaped → every line parses).\n- [ ] **Step 2:** `node --test plugins/opt-in/flow-cockpit/hooks/lib.test.mjs`; expect FAIL.\n- [ ] **Step 3: Implement.** One `fs.appendFileSync` of the whole line per event; folder\n      `mkdirSync(…, { recursive: true, mode: 0o700 })`, file mode `0o600`; `main` swallows every error. `hooks.json`: SessionStart (also prunes),\n      SessionEnd, UserPromptSubmit, Stop, SubagentStart, SubagentStop, Notification, PermissionRequest, and PreToolUse,\n      PostToolUse, PostToolUseFailure with `\"matcher\": \"AskUserQuestion\"`; each\n      `{\"type\":\"command\",\"command\":\"node \\\"${CLAUDE_PLUGIN_ROOT}/hooks/capture.mjs\\\"\",\"async\":true}`.\n- [ ] **Step 4:** Tests and `npm test` PASS. One real session with `--plugin-dir`: an AskUserQuestion and a permission\n      prompt show in the capture file.\n- [ ] **Step 5:** Commit: `Capture questions, permission prompts and agents per Claude session.`","n":10,"title":"Capture hooks"},{"depends_on":[10,4],"does":"Makes a flow run show \"waiting on you\" while one of its sessions has an open question or permission prompt.","markdown":"**Does:** Makes a flow run show \"waiting on you\" while one of its sessions has an open question or permission prompt.\n**Depends on:** Task 10, Task 4\n\n**Files:**\n\n- Create: `core/src/activity/capture.rs`, `core/tests/fixtures/capture/*.jsonl`\n- Modify: `core/src/activity/mod.rs` (`Live`), `core/src/index/{status,entries,mod}.rs` (read each linked session's\n  capture file), `core/src/bindings.rs` if a crossing type changes\n\n**Interfaces:**\n\n- Consumes: Task 10's line format.\n- Produces: `pub fn read_capture(path: &Path) -> Vec\u003cCaptureEvent>`; `pub fn live(events: &[CaptureEvent]) -> Live`\n  (`waiting`: the question, or the tool waiting for permission); `Status::Waiting` when any linked session's\n  `live.waiting` is set.\n\n- [ ] **Step 1: Write the failing tests:** `open_question_waits` (PreToolUse AskUserQuestion, no PostToolUse,\n      PostToolUseFailure or UserPromptSubmit after it); `answered_question_clears`; `permission_prompt_waits`;\n      `any_later_event_clears_permission` (a denial too: a later PreToolUse or Stop); `stop_without_start_is_ignored`;\n      `capture_ignores_partial_last_line`; `status_waiting_from_capture`.\n- [ ] **Step 2:** Run; expect FAIL.\n- [ ] **Step 3: Implement.**\n- [ ] **Step 4:** Tests and clippy PASS; with the plugin, a question in a running session turns its flow run to\n      \"Waiting on you\" within one poll (Task 6 already polls the capture folder).\n- [ ] **Step 5:** Commit: `Show waiting on you from the capture.`","n":11,"title":"\"Waiting on you\" from the capture"},{"depends_on":[9],"does":"Lets a repository carry its own views, loaded only when the user has trusted that repository.","markdown":"**Does:** Lets a r
