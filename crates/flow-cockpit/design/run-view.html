tional `targets: string[]` and `linuxHint: (version: string) => string`; `flow-cockpit` with\n  `key: 'appPath'`, `targets: ['win32-x64']`, `linuxHint` giving\n  `nix run github:deadmade/dead-claude-skills/v${version}#flow-cockpit`; `binAsset` returns `undefined` outside `targets`),\n  `installer/steps/binaries.ts` (`applyBin`: with a `linuxHint` on Linux, push the hint to `done`; the `build` hint\n  names the plugin's own crate), `installer/install.ts:254-255` (call `applyBin` for flow-cockpit),\n  `installer/core/options.ts` (`unavailable` treats a platform with a `linuxHint` as offered; the win32 hiding from\n  Task 9 goes), `installer/core/binaries.test.ts` (`dirs` gains `plugins/opt-in/flow-cockpit`),\n  `installer/core/options.test.ts`, `plugins/opt-in/flow-cockpit/.claude-plugin/plugin.json` (`userConfig.appPath`),\n  `plugins/opt-in/flow-cockpit/skills/views/SKILL.md` (Windows path), `README.md`, `CLAUDE.md`\n\n- [ ] **Step 1: Write the failing tests:** `binAsset gives the Windows zip for flow-cockpit`;\n      `binAsset has no linux asset for flow-cockpit`; `flow-cockpit has a pinned linux hint` (contains `v${version}`);\n      `applyBin prints the hint on linux` (in `done`, not `failures`); `flow-cockpit is offered on win32 and linux`.\n- [ ] **Step 2:** `npm test`; expect FAIL.\n- [ ] **Step 3: Implement**; the summary line on Windows names `%USERPROFILE%\\.claude\\bin\\flow-cockpit.exe`.\n- [ ] **Step 4:** `npm test`, `npm run typecheck` PASS. On Windows (or the Windows CI build): the app opens, one view\n      loads through a blob in WebView2, and a Mermaid diagram renders. `gh workflow run build-flow-cockpit.yml` only with\n      the user's go (it needs a push).\n- [ ] **Step 5:** Commit: `Ship the flow cockpit to Windows through the installer.`\n","Spec":"# Flow cockpit: design\n\nStatus: approved at Gate 1 (2026-10-28); four items changed by plan review round 1 (marked **(review 1)**), waiting for re-approval. Terms follow `GLOSSARY.md` § Flow cockpit. Calls marked\n**(my call)** were made by Claude, not by the user. The shape is recorded in\n[ADR 0005](../../adr/0005-flow-cockpit-outside-claude-code.md).\n\n## Intent\n\nThe user runs one, at most two, Claude sessions at a time and works alongside them: they read what the agent edits\nand thinks, think about the problem too, and step in where needed. The conductors (`plugins/flows`) already split the\nwork well. What is missing is seeing it:\n\n- which flow runs are open, where each one stands, and which were never finished;\n- during a build: what each task is for, which one is running, what went wrong (fix rounds, findings, decisions);\n- what the main session and its subagents are doing right now.\n\nToday that lives in long Markdown files written for agents, in the SDD build log and in transcripts, and the only\nin-session view (the flows band) was turned off as \"too much\". The user wants a separate window that shows all of it\nand is easy and nice to read. They don't want a website they host, and they want the app easy to change by agents,\nthe way pi's extensions are.\n\n## Goals\n\n1. **Everything at a glance.** A project picker and a list of what ran in that project's checkouts and worktrees:\n   - **flow runs**, with conductor, phase, gates, open deviations, task progress during a build, status and last\n     activity, with filter and sort; unfinished ones stand out;\n   - **audits**, with their scope line, findings per severity, the user's picks and how many were fixed; an audit is\n     open while a pick has no fix recorded;\n   - **loose sessions** from the last 7 days, in their own group, so any Claude session's activity can be found.\n2. **A flow run you can read.** Selecting one shows, built from the documents' structure rather than rendered\n   Markdown: the `now:` sentence, the phases and gates as a stepper, the decisions taken, open deviations, and during a\n   build each task as a card with what it does, its state and what went wrong, and a graph when the plan names\n   dependencies.\n3. **Docs drawn properly.** spec.md, plan.md and flow.md shown through the same enhancer: recognised parts as UI,\n   everything else as Markdown, Mermaid blocks as diagrams.\n4. **Live activity.** What the Claude session and each subagent are doing: tool calls with their input (edits as\n   diffs, commands), replies, agent start and stop, questions and permission prompts that came up. The raw\n   conversation is one click away, not the main view.\n5. **Readable documents at the source.** flow.md and plan.md follow a format the app recognises (below). The build\n   adds the format's parts to all three templates (`feature-flow`, `research-flow`, the shared `build-template.md`)\n   and the conductor text that keeps them filled; the user reshapes the rest of the wording afterwards, and the checks\n   catch a part that goes missing.\n6. **Changeable by agents.** Every view, the built-in ones included, is a TypeScript file in a folder the app watches\n   and reloads on change, against a documented interface. A skill tells Claude how to write or change a view.\n7. **Linux (through Nix) and Windows x64.**\n\n## Non-goals\n\n- Interacting with Claude from the app: no answering questions or permissions, no starting or resuming flows, no\n  typing into sessions. Also no command in Claude Code that opens the app.\n- Notifications from the app. The existing ones (Stop, questions, permission prompts) stay as they are.\n- Model-written summaries (Haiku). Considered and not picked: the documents get better instead.\n- A readable format for the SDD build log, or for audit reports beyond the `Picks:`/`Fixed` lines. The app reads the\n  rest as it is.\n- Migrating older flow.md files.\n- Running plan tasks in parallel. `Depends on:` is for drawing; the build still runs tasks in order.\n- A hosted or browser web UI, macOS, ARM, Linux outside Nix, team or multi-user use, tickets.\n\n## Anti-goals\n\n- **A second place where work is managed.** flow.md stays the record; the app never writes to a repository or to\n  Claude Code's files. No tickets, no state of its own about runs beyond caches it can rebuild.\n- **Noise.** Detail stays one step away (E4, E5, E10 in flow.md's Evidence): the list shows state, a run shows its\n  shape, the raw conversation and tool output open on demand.\n- **Hard to read.** If a part of a run can't be shown as a short sentence or a small component, it waits for the\n  format to say it better rather than being dumped as text.\n\n## Constraints\n\n- Repo rules (CLAUDE.md): one version for everything, `check-repo` consistency, the installer downloads binaries per\n  `BIN_TARGETS`, no runtime npm dependencies in the installer, vendored packs are never edited (changes to pack rules\n  go through conductor text with an `overrides` marker).\n- Claude Code formats are not stable: hook payloads are documented, transcript JSONL and `~/.claude/jobs/` are not.\n  Subagent transcripts keep tool calls and text, but thinking blocks are stored empty (checked in this session).\n- Hooks run per event; on every tool call they must not slow Claude Code (async, no output).\n- Transcripts and build logs carry text from web pages and tools: untrusted.\n- The user's terminal setup (Ghostty, tmux, Windows Terminal, Night City) stays as it is.\n\n## Approaches\n\nRecorded in flow.md **Options** with the evidence, and in ADR 0005. Picked: Claude Code stays in the user's terminal;\nhooks record what transcripts lack; a separate desktop window (Tauri: Rust core,\nTypeScript views, the system's webview) reads that capture plus the run documents. Rejected: a pane inside Claude Code,\na terminal viewer, a cockpit hosting Claude Code in embedded terminals, agent teams in tmux panes, a local web server,\nElectron, Rust views.\n\nThe throwaway prototype (scratchpad, recorded in flow.md) settled the list's shape (\"the shape feels right\") and\nshowed that styling raw agent text doesn't make it readable.\n\n## The document format (the contract)\n\nThe app recognises these parts. Wording around them is free; a document without them still shows, as Markdown.\n\n**flow.md**\n\n- Frontmatter: `flow:` and `phase:` (as today), plus `now:`, one plain sentence of where the run stands and what comes\n  next. **(my call: frontmatter, so it parses without reading the body)** The conductor rewrites it after every phase\n  and at every stop where it waits for the user (a gate, a deviation, a question); a conductor called inline writes\n  into its caller's flow.md. At every such stop it starts with `Waiting for you` **(review 2)**. Example:\n  `now: Waiting for you to approve the plan (Gate 2).`\n- `## Gates`: one line per gate, `- Gate \u003cn>, \u003cwhat>: \u003cdate>[, \u003cextra>]`; empty after the colon while open; a\n  reopening appended as `Reopened \u003cdate>: \u003cwhy>`. (Today's shape, made strict.)\n- `## Options`: one `### \u003cdecision>` per decision, with a `Picked:` line naming the choice in plain words, then the\n  reasons and rejected options as free text.\n- `## Deviations`: one `### \u003cdeviation>` each, with a `Status: open` or `Status: decided \u003cdate>: \u003cwhat>` line.\n- Other sections (Request, Grounding, Prior art, Tasks, Rulings, Walkthrough, Run verdict) keep their headings so the\n  app can place them; their content is shown as Markdown.\n- An older flow.md without these parts shows what parses (phase, gates, the build log) and Markdown for the rest; with\n  no `now:`, the app shows the phase in its place.\n\n**plan.md**\n\n- Each task stays `### Task \u003cn>: \u003ctitle>` and gains, right below it:\n  - `**Does:** \u003cone plain sentence: what this task changes, for a reader who doesn't know the code>`\n  - `**Depends on:** Task \u003cn>, Task \u003cm>` or `none`\n- `**Files:**` and the rest stay as `writing-plans` writes them.\n- `writing-plans` is vendored, so the requirement goes into flows' Phase 4 text with an\n  `\u003c!-- overrides superpowers/skills/writing-plans/SKILL.md: \"...\" -->` marker if it contradicts a pack sentence.\n\n**Diagrams.** One line in `flow-rules.md`: the user reads specs, plans and flow.md in a viewer that draws Mermaid;\nuse a diagram where it explains something better than prose. Never required.\n\n**Audit reports** **(review 1)**. flow-rules' Reports section gains one line shape: `Picks: \u003cfinding numbers> | none`,\nand per picked finding a `Fixed \u003cdate>: \u003cnumber>` line once its fix passed its check. An audit is open while a pick has\nno `Fixed` line. Older reports without these lines show as Markdown with their state unknown.\n\n**Gates in the build conductors** **(review 1)**. `/implement`, `/fix-flow` and `/upgrade` write numbered gate lines\nin the same shape (`- Gate 1, \u003cwhat>: \u003cdate>`), and the templates leave the date empty while open instead of a\n`\u003cdate>` placeholder.\n\n**Checks.** check-repo fails when a template lacks a contract part (`now:`, the Gates shape, `Does:`/`Depends on:` in\nthe plan instructions of feature-flow, implement and upgrade, the `Picks:` line). The app's parser tests run against the real templates and against older flow.md files from\n`docs/features/`, which must still load.\n\n## Design checkpoint\n\nThe flow run view is the part the user found unreadable twice. The plan stops once the core reads the new format:\na clickable mockup of the flow run view, built from this run's own flow.md and plan in the new format, goes to the\nuser, and the real views are built only after they approve it.\n\n## Status\n\n- **Waiting on you** **(review 1)**: the capture shows an AskUserQuestion that started and hasn't ended (no later\n  result, failure or prompt), or a permission prompt with no later event in that Claude session; or the flow run's\n  `now:` starts with `Waiting for you`. Without capture, only `now:` counts. (A Stop doesn't fire while a question\n  dialog is open, so \"Stop after a question\" is not a signal.)\n- **Working** **(review 1)**: the Claude session's transcript grew in the last 2 minutes. Transcripts are written as\n  the session runs, so this needs no capture.\n- **Idle:** not done, not waiting, not working.\n- **Stale:** not done and nothing happened for 3 days.\n- **Done:** `phase: done`.\n\n## The parts\n\n1. **The flow-cockpit plugin** (a plain opt-in under `plugins/opt-in/flow-cockpit`; flows doesn't depend on it). It\n   holds the capture hooks and the skill that teaches Claude to write or change a view. Command hooks, one\n   stdlib Node script like `plugins/default/hooks/notify.mjs`, async, append one JSON line per event to a\n   per-session file under the user's home (outside any repo, user-only permissions). **(review 1)** The capture\n   records only what transcripts lack: SessionStart, SessionEnd, UserPromptSubmit, Stop, SubagentStart, SubagentStop,\n   Notification, PermissionRequest (observed only, never decided), and PreToolUse, PostToolUse and PostToolUseFailure\n   for AskUserQuestion only. Tool calls, edits, replies and results come from the transcripts. No mod (recorded in\n   flow.md Options; revisited only if a gap shows).\n2. **The flow-cockpit app** (Rust, `crates/flow-cockpit`, binary `flow-cockpit`). The core discovers projects from the folders\n   Claude Code has run in (checkouts folded by git remote, by folder name without one; a project can be hidden in the\n   config), their worktrees, flow runs, audits and Claude sessions; parses flow.md, plan.md and audit reports into a\n   typed model; reads SDD build logs; links Claude sessions to flow runs (a session that wrote or edited the run's\n   flow.md); takes activity from transcripts and live state from the capture; checks the known folders for changes\n   and pushes them to the views. Read-only on everything it\n   doesn't own.\n3. **Views** (TypeScript, in the Tauri window). The built-in ones (list, flow run, docs, activity) are embedded in\n   the app binary; `flow-cockpit --print-view \u003cid>` prints one **(review 1)**. A same-named file in a views folder replaces one, a new name adds one:\n   - global: `~/.config/flow-cockpit/views/` on Linux, `%APPDATA%\\flow-cockpit\\views\\` on Windows;\n   - per repository: `.flow-cockpit/views/`, loaded only for repositories trusted in the config;\n   - settings: `config.toml` next to the global views folder (trusted repositories, hidden projects).\n     To change a built-in, the skill writes the printed copy into the global folder and edits it; the app marks replaced views,\n     deleting the copy restores the original, and app updates never touch the copies. `flow-cockpit --print-types`\n     prints the view interface and data types for views outside the repo **(review 2)**. Types are stripped on load; the\n     interface is a generated `.d.ts`. Shared building blocks: sanitised Markdown, Mermaid, diffs, stepper, cards.\n4. **Distribution.** Linux: a package in the repo's `flake.nix` (`nix run`, or the user's system config), because a\n   Tauri window links the system's GTK and WebKit and can't be a static musl download like tui-review and web-mcp.\n   Windows x64: a release build the installer downloads. The installer offers the flow-cockpit plugin as opt-in on\n   both; on Windows it also downloads the app to `%USERPROFILE%\\.claude\\bin\\flow-cockpit.exe` and prints that path\n   (no shortcut) **(review 1)**; on Linux it prints how to get it, pinned to the installed release\n   (`nix run github:deadmade/dead-claude-skills/v\u003cversion>#flow-cockpit`, or the package for the system config).\n\n## Slices **(review 1)**\n\n1. **Slice 1, used daily before slice 2 starts:** the format, the parsers, the index (status from `now:`, transcripts\n   and documents), the window, the view runtime, the built-in views, the views skill, the Nix package and CI.\n   On Windows the plugin stays hidden until slice 2 ships the app there **(review 2)**.\n2. **Slice 2:** the capture hooks and live \"waiting\" state, per-repository views and trust, the Windows release and\n   installer step.\n\n## Trust and history **(my calls, from the builder check)**\n\n- **Views are code.** The built-in views and the user's global views folder load always. A repository's own views\n  folder loads only for repositories the user has listed in the app's config file; a repository can't put code in the\n  window by being cloned. Views run under a strict content policy (no network, no remote scripts) and get data only\n  through the core's read-only interface.\n- **History without capture.** Every Claude session shows its conversation and tool calls from its transcript, as the\n  prototype did. Without capture, only \"waiting on you\" is limited (to `now:`). The transcript reader is the fallback, not a second\n  event source, and it tolerates entries it doesn't know.\n\n## Where each cross-cutting concern is decided\n\n- The document format (flow.md, plan.md, audit reports): resolved in the core's document parser; never seen by the\n  views (they get the typed model plus raw Markdown for unrecognised parts) or by capture.\n- Which Claude session belongs to which flow run, and status: resolved in the core's run index; never seen by capture\n  (it records session facts only) or by the views.\n- Project identity (several checkouts, worktrees): resolved in the core's project index; the views see a project id\n  and name.\n- Claude Code's formats (hook payloads, transcript JSONL): resolved in capture (payload to event line) and in the\n  core's transcript reader; never seen by the views.\n- Untrusted text to HTML: resolved in the views' shared Markdown block (sanitiser); the core emits text, never HTML;\n  individual views never inject raw HTML from data.\n- Types across Rust and TypeScript: resolved in the generated `.d.ts`; never written by hand in a view.\n\n## Decided by the user\n\n- One or two sessions, working alongside them; not a fleet of parallel agents (2026-10-28).\n- A separate window, not a hosted website; Claude Code stays in the terminal (2026-10-28).\n- Watch only, no interaction for now (2026-10-28).\n- Rust core, TypeScript views (2026-10-28).\n- Agents may write diagrams, never forced to (2026-10-28).\n- The app easy to change by agents, like pi (2026-10-28).\n- Readable documents at the source, flow.md and plan.md, not Haiku summaries (2026-10-28).\n- Easy and nice to read is a goal of its own (2026-10-28).\n- The prototype's list-then-run shape (2026-10-28).\n- No measurable target; moved from `/research-flow` to `/feature-flow` (2026-10-28).\n- Linux through a Nix package, Windows through a release download (2026-10-28, builder check).\n- The build adds the format parts to the templates; the user polishes the wording (2026-10-28, builder check).\n- The list holds flow runs, audits and loose sessions (2026-10-28, builder check).\n- Grill round 1 (2026-10-28): the glossary terms; the names flow-cockpit and flow-capture (merged into one plugin, flow-cockpit, in round 2); the plugin a plain\n  opt-in, the Rust app in `crates/`; who rewrites `now:`; the status rules; audits as written; loose sessions from 7\n  days; projects found automatically; no migration of older runs; no command to open the app from Claude Code; no\n  notifications from the app; ADR 0005; the six seam lines.\n- Plan review round 2 (2026-10-28): all fixes applied, including `now:` starting with `Waiting for you` at every stop\n  and the plugin hidden on Windows during slice 1.\n- Plan review round 1 (2026-10-28): two slices; capture only what transcripts lack; built-in views embedded, the\n  Windows app at a fixed path with no shortcut; the review's technical fixes, including the audit `Picks:` line.\n- Grill round 2 (2026-10-28): one plugin named flow-cockpit (capture hooks and the views skill); the installer prints\n  the Nix command on Linux; the views and config paths; built-ins changed through copies in the global folder;\n  `Depends on:` for drawing only; the design checkpoint before the views.\n\n## Left to the builder\n\nThe Tauri, file-watching, type-stripping, type-generation, Markdown, sanitiser and Mermaid libraries and versions;\nthe exact view interface (within: small, typed, hot-reloaded); where capture files live and how long they are kept;\nthe \"working\" threshold; the visual design within the Night City palette and the readability bar the prototype set.\n"}</script>

<script>
"use strict";
// This page mirrors what the run view will get: FlowDoc, PlanDoc | null, Ledger | null (bindings/*.ts), and the raw
// text of a doc by DocName. It reads no document format itself; where it still has to, a comment says so.
const load = (id) => { try { return JSON.parse(document.getElementById(id).textContent || "null"); } catch { return undefined; } };
const DATA = { flow: load("flow-json"), plan: load("plan-json"), ledger: load("ledger-json"), docs: load("docs-json") };

const $ = (id) => document.getElementById(id);
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
// The views' shared Markdown block: marked, then DOMPurify. Nothing from the data reaches the DOM any other way.
const md = (s) => DOMPurify.sanitize(marked.parse(String(s ?? ""), { gfm: true }));
const inline = (s) => DOMPurify.sanitize(marked.parseInline(String(s ?? ""), { gfm: true }));
const plainText = (s) => String(s ?? "").replace(/`|\*\*/g, "");
const plural = (n, one, many = one + "s") => `${n} ${n === 1 ? one : many}`;
const times = (n) => n === 1 ? "once" : n === 2 ? "twice" : `${n} times`;
// Capitalises a plain first word only; an identifier such as `list_items` keeps its case.
const capital = (s) => /^[a-z]+(\s|$)/.test(s) ? s.charAt(0).toUpperCase() + s.slice(1) : s;
const day = (iso) => { const d = new Date(iso + "T00:00:00Z"); return isNaN(d) ? iso : d.toLocaleDateString("en-GB", { day: "numeric", month: "short", timeZone: "UTC" }); };
const list = (xs) => xs.length < 2 ? xs.join("") : `${xs.slice(0, -1).join(", ")} and ${xs.at(-1)}`;

mermaid.initialize({
  startOnLoad: false, securityLevel: "strict", theme: "base",
  // Mermaid 12's default "neo" look gives every node a 120px minimum; the classic look sizes nodes to their label.
  look: "classic", htmlLabels: false,
  flowchart: { useMaxWidth: false, minNodeWidth: 0, rankSpacing: 26, nodeSpacing: 14, padding: 9, curve: "basis" },
  themeVariables: {
    darkMode: true, background: css("--color-paper"), fontFamily: css("--font-body"), fontSize: "13px",
    primaryColor: css("--color-paper-3"), primaryTextColor: css("--color-ink"), primaryBorderColor: css("--color-paper-4"),
    lineColor: css("--color-paper-4"), secondaryColor: css("--color-paper-2"), tertiaryColor: css("--color-paper-2"),
  },
});

// Which phases each conductor has and where its gates sit. Not in the typed model: the view keeps this per conductor.
const PHASES = {
  feature: { phases: ["ground", "brainstorm", "grill", "plan", "evaluate", "execute", "finish"], gateAfter: { 1: "grill", 2: "evaluate" } },
};
const PHASE_LABEL = { execute: "Build", finish: "Verify and finish" };
const phaseName = (p) => PHASE_LABEL[p] ?? capital(p);

// Stands in for FlowRunSummary.status, which the index derives; here only `now:` and `phase:` are known.
function status(flow) {
  if (flow.phase === "done") return "Done";
  if ((flow.now ?? "").startsWith("Waiting for you")) return "Waiting";
  return "Idle";
}
const STATUS_LABEL = { Waiting: "Waiting on you", Working: "Working", Idle: "Idle", Stale: "Stale", Done: "Done" };

// The rail names a state only when it is the exception.
const MARK = { Building: "Now", Review: "Review", Waiting: "Needs you" };
function taskState(t) {
  if (!t) return { cls: "NotStarted", text: "Not started" };
  if (t.state === "Done") return { cls: "Done", text: t.fix_rounds ? `Done after ${plural(t.fix_rounds, "fix round")}` : "Done" };
  if (t.state === "Review") return { cls: "Review", text: t.fix_rounds ? `In review, fix round ${t.fix_rounds + 1}` : "In review" };
  return { cls: t.state, text: { Building: "Being built", Waiting: "Waiting on you", NotStarted: "Not started" }[t.state] };
}
// The build log writes `minor (deferred): …` and `parked: …`; the core should hand these over without the tag.
const untag = (s) => s.replace(/^(minor \(deferred\)|parked):\s*/i, "");

// ---------- routing: #build/<n>, #decisions/<dev|dec|rul>-<i>, #docs/<Spec|Plan|Flow> ----------

const TABS = [["build", "Build"], ["decisions", "Decisions"], ["docs", "Docs"]];
const DOCS = [["Spec", "Spec", "spec.md"], ["Plan", "Plan", "plan.md"], ["Flow", "Flow", "flow.md"]];
const tasks = () => (DATA.plan?.tasks ?? []).map((p) => ({ p, t: DATA.ledger?.tasks.find((x) => x.n === p.n) }));
function defaultTask() {
  const all = tasks();
  return (all.find((x) => x.t && x.t.state !== "Done" && x.t.state !== "NotStarted") ?? all.find((x) => x.t?.state !== "Done") ?? all[0])?.p.n ?? null;
}
function route() {
  const [tab, arg] = location.hash.slice(1).split("/");
  const r = { tab: TABS.some(([k]) => k === tab) ? tab : "build", doc: "Spec", task: null, item: arg ?? null };
  if (r.tab === "docs") r.doc = DOCS.some(([k]) => k === arg) ? arg : "Spec";
  if (r.tab === "build") r.task = tasks().some((x) => x.p.n === Number(arg)) ? Number(arg) : defaultTask();
  return r;
}

function render() {
  const { flow } = DATA;
  if (!flow) {
    $("content").innerHTML = `<div class="error" role="alert"><h2>This run can't be shown.</h2><p>Its flow.md data is ${flow === undefined ? "not valid JSON" : "missing"}.</p><p>Run the dump test to write it: <code>cargo test -p flow-cockpit-core --test dump_this_run -- --ignored</code>.</p></div>`;
    return;
  }
  const r = route();
  const st = status(flow);
  $("run-name").textContent = plainText((flow.title ?? "Untitled run").replace(/:\s*flow$/i, ""));
  $("tabs").innerHTML = TABS.map(([k, label]) => `<button type="button" role="tab" class="tab" id="tab-${k}" aria-selected="${k === r.tab}" aria-controls="content" data-tab="${k}">${label}</button>`).join("");
  $("tabs").querySelectorAll(".tab").forEach((b) => (b.onclick = () => { location.hash = b.dataset.tab; }));
  $("content").setAttribute("aria-labelledby", `tab-${r.tab}`);
  const kind = flow.flow ? `${capital(flow.flow)} flow` : "Flow run";
  $("where").innerHTML = `${esc(kind)}${flow.phase ? `, in ${esc(phaseName(flow.phase))}` : ""}<span class="status st-${st}">${STATUS_LABEL[st]}</span>`;
  if (r.tab === "build") build(flow, r.task, st);
  if (r.tab === "decisions") decisions(flow, r.item);
  if (r.tab === "docs") docsTab(flow, r.doc);
}

// ---------- Build: phases and tasks on the left, the selected task as the one focal point ----------

function build(flow, n, st) {
  $("left").setAttribute("aria-label", "Phases and tasks");
  $("left").innerHTML = `<section class="group" aria-label="Phases">${track(flow)}</section>${taskList(n)}`;
  wireTrack($("left"), flow);
  const all = tasks();
  $("content").innerHTML = `${nowBlock(flow, st, all)}${taskView(all, n)}`;
  if (graphable(all) && all.some((x) => x.p.n === n)) drawGraph(all, n);
  diagrams($("content"));
}

function nowBlock(flow, st, all) {
  const done = all.filter((x) => x.t?.state === "Done").length;
  const sentence = flow.now ?? (flow.phase ? `In ${phaseName(flow.phase)}. This run doesn't say what comes next.` : "This run doesn't say where it stands.");
  const L = DATA.ledger;
  const rounds = L ? L.tasks.reduce((a, t) => a + t.fix_rounds, 0) : 0;
  const sec = L ? L.tasks.reduce((a, t) => a + t.security.length, 0) : 0;
  const open = flow.deviations.filter((d) => d.status === "Open").length;
  const summary = [
    L && all.length ? `${done} of ${all.length} tasks done.` : "",
    rounds ? `Reviews sent work back ${times(rounds)}.` : "",
    sec ? `${plural(sec, "security note")}.` : "",
    open ? `${plural(open, "deviation")} ${open === 1 ? "waits" : "wait"} for you.` : "No deviation is open.",
  ].filter(Boolean).join(" ");
  return `<section class="now ${st === "Waiting" ? "waiting" : ""}" aria-label="Where this run stands">
    <p class="sentence">${inline(sentence)}</p><p class="summary">${esc(summary)}</p></section>`;
}

function track(flow) {
  const shape = PHASES[flow.flow];
  const gates = flow.gates;
  const passed = gates.filter((g) => g.approved);
  const dates = [...new Set(passed.map((g) => g.approved))];
  const gateLine = !gates.length ? ""
    : passed.length === gates.length ? `${gates.length === 2 ? "Both gates" : gates.length === 1 ? "The gate" : `All ${gates.length} gates`} passed${dates.length === 1 ? ` ${day(dates[0])}` : ""}.`
    : `${list(gates.filter((g) => !g.approved).map((g) => `gate ${g.n}`)).replace(/^./, (c) => c.toUpperCase())} ${gates.length - passed.length === 1 ? "is" : "are"} open.`;
  const gateRow = (g) => `<li><button type="button" class="row gate ${g.approved ? "passed" : "open"}" aria-expanded="false" data-gate="${g.n}">
      <span class="k num">G${g.n}</span><span class="ttl">Gate ${g.n}, ${esc(g.what)}</span><span class="mark">${g.approved ? `Passed ${day(g.approved)}` : "Open"}</span>
      <span class="gate-note" hidden></span></button></li>`;
  if (!shape) {
    return `<p class="track-text">${esc(flow.phase ? `${phaseName(flow.phase)}. ` : "")}${esc(gateLine)}</p>${gates.length ? `<ol class="rows phase-list">${gates.map(gateRow).join("")}</ol>` : ""}`;
  }
  const at = flow.phase === "done" ? shape.phases.length : shape.phases.indexOf(flow.phase);
  const segs = [];
  const rows = [];
  shape.phases.forEach((p, i) => {
    const cls = i < at ? "done" : i === at ? "current" : "";
    segs.push(`<span class="seg ${cls}"></span>`);
    rows.push(`<li class="row phase ${cls}" ${i === at ? 'aria-current="step"' : ""}><span class="k num">${i + 1}</span><span class="ttl">${phaseName(p)}</span><span class="mark">${i < at ? "Done" : i === at ? "Now" : ""}</span></li>`);
    for (const [gn, after] of Object.entries(shape.gateAfter)) {
      if (after !== p) continue;
      const g = gates.find((x) => x.n === Number(gn));
      segs.push(`<span class="tick ${g?.approved ? "passed" : ""}"></span>`);
      rows.push(g ? gateRow(g) : `<li class="row gate open"><span class="k num">G${gn}</span><span class="ttl">Gate ${gn}</span><span class="mark">Not written</span></li>`);
    }
  });
  const where = flow.phase === "done" ? "Done, every phase passed." : `<b>${phaseName(flow.phase)}</b>, phase ${at + 1} of ${shape.phases.length}.`;
  return `<button type="button" class="track" aria-expanded="false" aria-controls="phase-list">
      <span class="segs" aria-hidden="true">${segs.join("")}</span>
      <span class="track-text">${where}</span></button>
    ${gateLine ? `<p class="track-gates">${esc(gateLine)}</p>` : ""}
    <ol class="rows phase-list" id="phase-list" hidden>${rows.join("")}</ol>`;
}

function wireTrack(root, flow) {
  const t = root.querySelector(".track");
  if (t) t.onclick = () => { const open = t.getAttribute("aria-expanded") === "true"; t.setAttribute("aria-expanded", String(!open)); $("phase-list").hidden = open; };
  root.querySelectorAll(".gate[data-gate]").forEach((b) => (b.onclick = () => {
    const open = b.getAttribute("aria-expanded") === "true";
    const note = b.querySelector(".gate-note");
    b.setAttribute("aria-expanded", String(!open));
    note.hidden = open;
    if (open || note.childElementCount) return;
    const g = flow.gates.find((x) => x.n === Number(b.dataset.gate));
    const verdict = g.approved
      ? `${capital(g.what)} on ${day(g.approved)}${g.reopened ? ", after it was reopened once and approved again" : ""}.`
      : `${capital(g.what)}: not yet${g.reopened ? "; it was reopened and waits for approval again" : ""}.`;
    note.innerHTML = `<span class="verdict">${esc(verdict)}</span><span class="rawline">${inline(g.raw.replace(/^[-*]\s+/, ""))}</span>`;
  }));
}

function taskList(n) {
  const all = tasks();
  if (!all.length) return `<section class="group" aria-labelledby="tk-h"><h2 class="group-h" id="tk-h">Tasks</h2><div class="empty"><p>No plan with tasks yet.</p><p>They show once plan.md holds <code>### Task &lt;n&gt;</code> headings.</p></div></section>`;
  const done = all.filter((x) => x.t?.state === "Done").length;
  const rows = all.map(({ p, t }) => {
    const state = t?.state ?? "NotStarted";
    // One mark at most: the state when it is the exception, else a count that carries meaning.
    let mark = "";
    if (MARK[state]) mark = `<span class="mark ${state}">${MARK[state]}</span>`;
    else if (t?.security.length) mark = `<span class="mark sec">${plural(t.security.length, "security note")}</span>`;
    else if (t?.fix_rounds) mark = `<span class="mark fix">${plural(t.fix_rounds, "fix")}</span>`;
    const label = `Task ${p.n}, ${plainText(p.title)}: ${taskState(t).text.toLowerCase()}`;
    return `<li><a class="row ${state === "Done" ? "done" : ""}" href="#build/${p.n}" title="${esc(label)}" ${n === p.n ? 'aria-current="true"' : ""}>
      <span class="k num">${p.n}</span><span class="ttl">${inline(p.title)}</span>${mark}</a></li>`;
  }).join("");
  return `<section class="group" aria-labelledby="tk-h"><h2 class="group-h" id="tk-h"><span>Tasks</span><span class="aside">${DATA.ledger ? `${done} of ${all.length} done` : "Not started in this checkout"}</span></h2><ol class="rows">${rows}</ol></section>`;
}

// What happened, in sentences built from typed fields only; the build log's own lines are one click away.
function happened(t) {
  if (!t) return "Nothing has happened on this task yet.";
  const by = t.model ? ` by ${t.model}` : "";
  const sent = t.fix_rounds ? `review sent it back ${times(t.fix_rounds)}` : "";
  let s;
  if (t.state === "Done") s = `Built${by}${sent ? `; ${sent}, and the fix ${t.fix_rounds === 1 ? "round" : "rounds"} closed every finding` : " and approved in the first review"}.`;
  else if (t.state === "Review") s = `Built${by} and now in review${sent ? `; ${sent} so far` : ""}.`;
  else if (t.state === "Waiting") s = `Built${by}, and waiting for your decision before it goes on.`;
  else if (t.state === "Building") s = `Being built${by}${sent ? `; ${sent} so far` : ""}.`;
  else s = "Nothing has happened on this task yet.";
  return s;
}

function taskView(all, n) {
  const x = all.find((y) => y.p.n === n);
  if (!x) return `<div class="empty"><p>This run has no plan with tasks yet.</p><p>Task cards show once plan.md holds <code>### Task &lt;n&gt;</code> headings.</p></div>`;
  const { p, t } = x;
  const st = taskState(t);
  const facts = [];
  if (p.depends_on?.length) facts.push(`Needs ${list(p.depends_on.map((d) => `task ${d}`))} first.`);
  else if (p.depends_on) facts.push("Needs nothing else first.");
  const after = all.filter((y) => y.p.depends_on?.includes(p.n)).map((y) => `task ${y.p.n}`);
  if (after.length) facts.push(`${capital(list(after))} ${after.length === 1 ? "waits" : "wait"} for it.`);
  const items = (xs, f = (s) => s) => xs.map((s) => `<li>${inline(capital(f(s)))}</li>`).join("");
  const sec = t?.security.length ? `<p class="sec">${capital(plural(t.security.length, "security note"))} came up in review.</p>` : "";
  // Short content shows as it is; longer content folds behind a row in the page's own style.
  const shown = (xs, tag, f) => `<${tag} class="items">${items(xs, f)}</${tag}>`;
  const fold = (label, count, body) => `<details class="unfold"><summary><span>${label}</span><span class="count">${count}</span></summary><div class="unfold-body">${body}</div></details>`;
  const log = t?.story.length ? (t.story.length <= 2 ? shown(t.story, "ol") : fold("Build log", plural(t.story.length, "entry", "entries"), shown(t.story, "ol"))) : "";
  const later = t?.later.length ? (t.later.length <= 3 ? shown(t.later, "ul", untag) : fold("As the reviews wrote them", plural(t.later.length, "small issue"), shown(t.later, "ul", untag))) : "";
  return `<article class="task" aria-labelledby="task-title">
    <div>
      <div class="task-h"><h2 id="task-title"><span class="n num">${p.n}</span>${inline(p.title)}</h2><span class="state ${st.cls}">${st.text}</span></div>
      ${p.does ? `<p class="does">${inline(p.does)}</p>` : `<p class="does quiet">The plan doesn't say what this task does.</p>`}
      ${facts.length ? `<p class="facts">${facts.join(" ")}</p>` : ""}
      <section class="part" aria-labelledby="hap-h"><h3 class="part-h" id="hap-h">What happened</h3><p>${esc(happened(t))}</p>${sec}${log}</section>
      ${t?.later.length ? `<section class="part" aria-labelledby="later-h"><h3 class="part-h" id="later-h">Left for later</h3>${later}</section>` : ""}
      <section class="part" aria-labelledby="plan-h"><h3 class="part-h" id="plan-h">In the plan</h3>${fold("Files, steps and tests", "", `<div class="md">${md(p.markdown)}</div>`)}</section>
    </div>
    ${graphable(all) ? `<section class="where-graph" aria-labelledby="graph-h"><h3 class="visually-hidden" id="graph-h">Where it sits in the plan</h3>
      <p class="key"><span class="k-done">Done</span>, <span class="k-now">being built</span>, <span class="k-wait">waiting on you</span>, not started; ringed is this task.</p>
      <div class="graph" id="graph"><p class="quiet">Drawing the graph…</p></div></section>` : ""}
  </article>`;
}

const graphable = (all) => all.length > 0 && all.every((x) => Array.isArray(x.p.depends_on));
async function drawGraph(all, selected) {
  const box = $("graph");
  const kind = (t) => !t ? "todo" : t.state === "Done" ? "done" : t.state === "Waiting" ? "wait" : t.state === "NotStarted" ? "todo" : "busy";
  const fill = (v) => `fill:${css("--color-paper-2")},stroke:${css(v)},color:${css("--color-ink-2")}`;
  const lines = ["flowchart LR"];
  // Numbers only, so the whole graph reads at full size; the titles are in the rail and on each node's tooltip.
  for (const { p } of all) lines.push(`  T${p.n}(("${p.n}"))`);
  for (const { p } of all) for (const d of p.depends_on) lines.push(`  T${d} --> T${p.n}`);
  for (const k of ["done", "busy", "wait", "todo"]) {
    const ids = all.filter((x) => kind(x.t) === k).map((x) => `T${x.p.n}`);
    if (ids.length) lines.push(`  class ${ids.join(",")} ${k}`);
  }
  lines.push(`  classDef done ${fill("--color-done")}`, `  classDef busy ${fill("--color-current")}`,
    `  classDef wait ${fill("--color-accent")}`, `  classDef todo fill:${css("--color-paper")},stroke:${css("--color-paper-4")},color:${css("--color-muted")}`,
    `  style T${selected} fill:${css("--color-paper-4")},stroke-width:3px,color:${css("--color-ink")}`);
  try {
    const { svg } = await mermaid.render("task-graph", lines.join("\n"));
    box.innerHTML = svg;
    box.querySelectorAll("g.node").forEach((g) => {
      const n = /T(\d+)/.exec(g.id)?.[1];
      if (!n) return;
      const x = all.find((y) => y.p.n === Number(n));
      const words = `Task ${n}, ${plainText(x.p.title)}: ${taskState(x.t).text.toLowerCase()}`;
      g.setAttribute("tabindex", "0");
      g.setAttribute("role", "link");
      g.setAttribute("aria-label", words);
      const tip = document.createElementNS("http://www.w3.org/2000/svg", "title");
      tip.textContent = words;
      g.prepend(tip);
      const go = () => { location.hash = `build/${n}`; };
      g.addEventListener("click", go);
      g.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
    });
  } catch (err) {
    box.innerHTML = `<div class="error" role="alert"><h2>The graph couldn't be drawn.</h2><p>${esc(err?.message ?? err)}</p></div>`;
  }
}

// ---------- Decisions: deviations on the left, open first; decisions as rows that open to their reasons ----------

function deviationList(flow) {
  if (!flow.deviations.length) return `<div class="empty"><p>No deviations so far.</p><p>The plan has held.</p></div>`;
  const order = (d) => d.status === "Open" ? 0 : d.status === "Unknown" ? 2 : 1;
  return `<ol class="devs">${[...flow.deviations].sort((a, b) => order(a) - order(b)).map((d) => {
    const s = d.status;
    const v = s === "Open" ? "Open, needs your decision" : s === "Unknown" ? "No status line" : `Decided${s.Decided.date ? ` ${day(s.Decided.date)}` : ""}`;
    const what = s !== "Open" && s !== "Unknown" ? `<p class="what">${inline(capital(s.Decided.what))}.</p>` : "";
    return `<li><details class="dev ${s === "Open" ? "open" : ""}"><summary>${inline(d.title)}<span class="v">${v}</span></summary>
      <div class="dev-body">${what}${d.body ? `<div class="md">${md(d.body)}</div>` : ""}</div></details></li>`;
  }).join("")}</ol>`;
}

// The Rulings section is Markdown: one list item per call, `<date>, <scope>: <call> — <why> — costs <what>`.
// Not in the typed model yet: the view splits it here, and the core should hand rulings over as { date, scope, what,
// why, cost } instead.
function rulingsOf(flow) {
  const section = flow.sections.find((s) => s.heading.toLowerCase() === "rulings");
  if (!section?.markdown) return [];
  const list = marked.lexer(section.markdown).find((t) => t.type === "list");
  return (list?.items ?? []).map((item) => {
    const text = item.text.replace(/\s*\n\s*/g, " ").trim();
    const head = /^(\d{4}-\d{2}-\d{2}),\s*([^:]+):\s*/.exec(text);
    const [what, why, ...rest] = (head ? text.slice(head[0].length) : text).split(/\s+—\s+/);
    return { date: head?.[1] ?? null, scope: head?.[2] ?? null, what, why: why ?? null, cost: rest.length ? rest.join(" — ").replace(/^costs\s+/i, "") : null };
  });
}

// Every item of the Decisions tab, in list order: open deviations, decided ones, decisions, then the build's calls.
function decisionItems(flow) {
  const devs = flow.deviations.map((d, i) => ({ id: `dev-${i}`, kind: "dev", d }));
  const rank = (x) => x.d.status === "Open" ? 0 : x.d.status === "Unknown" ? 2 : 1;
  return {
    devs: devs.sort((a, b) => rank(a) - rank(b)),
    decs: flow.decisions.map((d, i) => ({ id: `dec-${i}`, kind: "dec", d })),
    rules: rulingsOf(flow).map((d, i) => ({ id: `rul-${i}`, kind: "rul", d })),
  };
}

let focusListAfterRender = false;
function decisions(flow, wanted) {
  const { devs, decs, rules } = decisionItems(flow);
  const all = [...devs, ...decs, ...rules];
  const selected = all.find((x) => x.id === wanted) ?? devs.find((x) => x.d.status === "Open") ?? decs[0] ?? all[0];
  const row = (x, title, mark, cls = "") => `<li><a class="row plain ${cls}" href="#decisions/${x.id}" data-item="${x.id}" title="${esc(plainText(title))}" ${x === selected ? 'aria-current="true"' : ""}>
      <span class="ttl">${esc(capital(plainText(title)))}</span>${mark}</a></li>`;
  const open = devs.filter((x) => x.d.status === "Open").length;
  const unpicked = decs.filter((x) => !x.d.picked).length;
  $("left").setAttribute("aria-label", "Deviations, decisions and the build's own calls");
  $("left").innerHTML = `
    <section class="group" aria-labelledby="dev-h"><h2 class="group-h" id="dev-h"><span>Deviations</span><span class="aside">${open ? `${open} open` : "None open"}</span></h2>
      ${devs.length ? `<ol class="rows">${devs.map((x) => {
        const s = x.d.status;
        if (s === "Open") return row(x, x.d.title, `<span class="mark">Open</span>`, "open-dev");
        const date = s !== "Unknown" && s.Decided.date ? day(s.Decided.date) : "";
        return row(x, x.d.title, `<span class="mark">${date}</span>`, "quiet-row");
      }).join("")}</ol>` : `<p class="quiet">None so far. The plan has held.</p>`}</section>
    <section class="group" aria-labelledby="dec-h"><h2 class="group-h" id="dec-h"><span>Decisions</span><span class="aside">${unpicked ? `${unpicked} not picked` : plural(decs.length, "decision")}</span></h2>
      ${decs.length ? `<ol class="rows">${decs.map((x) => row(x, x.d.title, x.d.picked ? "" : `<span class="mark Open">Not picked</span>`)).join("")}</ol>` : `<p class="quiet">None recorded yet.</p>`}</section>
    ${rules.length ? `<section class="group" aria-labelledby="rul-h"><h2 class="group-h" id="rul-h"><span>Calls the build made</span><span class="aside">${rules.length}</span></h2>
      <ol class="rows">${rules.map((x) => row(x, x.d.what, x.d.scope ? `<span class="mark">${esc(x.d.scope)}</span>` : "", "quiet-row")).join("")}</ol></section>` : ""}`;
  $("content").innerHTML = selected ? `<article class="reading item" aria-labelledby="item-h">${itemDetail(selected)}</article>`
    : `<div class="reading empty"><p>No deviations, decisions or calls recorded yet.</p><p>They show once flow.md holds them under Options, Deviations and Rulings.</p></div>`;
  diagrams($("content"));
  if (focusListAfterRender) { focusListAfterRender = false; $("left").querySelector('[aria-current="true"]')?.focus(); }
}

function itemDetail(x) {
  const d = x.d;
  const part = (id, title, body) => `<section class="part" aria-labelledby="${id}"><h3 class="part-h" id="${id}">${title}</h3>${body}</section>`;
  if (x.kind === "dec") {
    return `<h2 class="item-h" id="item-h">${inline(d.title)}</h2><p class="item-meta">A decision in Options</p>
      <p class="item-lead">${d.picked ? `<span class="tag">Picked</span>${inline(capital(d.picked))}` : `<span class="tag open">Not picked yet</span>It waits for your choice.`}</p>
      ${d.body ? part("why-h", "Why, and what else was offered", `<div class="md">${md(d.body)}</div>`) : ""}`;
  }
  if (x.kind === "dev") {
    const s = d.status;
    const meta = s === "Open" ? `<span class="tag open">Open</span>It needs your decision before the build goes on.`
      : s === "Unknown" ? "Written before the format had a status line."
      : `<span class="tag">Decided${s.Decided.date ? ` ${day(s.Decided.date)}` : ""}</span>`;
    return `<h2 class="item-h" id="item-h">${inline(d.title)}</h2><p class="item-meta">${meta}</p>
      ${d.body ? part("hap-h", "What happened", `<div class="md">${md(d.body)}</div>`) : ""}
      ${s !== "Open" && s !== "Unknown" ? part("how-h", "How it was decided", `<p class="item-lead">${inline(capital(s.Decided.what))}.</p>`) : ""}`;
  }
  return `<h2 class="item-h" id="item-h">${inline(capital(d.what))}</h2>
    <p class="item-meta">A call the build made on its own${d.scope ? `, ${esc(d.scope)}` : ""}${d.date ? `, ${day(d.date)}` : ""}.</p>
    ${d.why ? part("why-h", "Why", `<div class="md">${md(`${capital(d.why).replace(/\.$/, "")}.`)}</div>`) : ""}
    ${d.cost ? part("cost-h", "If it was the wrong call", `<div class="md">${md(`It costs ${d.cost.replace(/\.$/, "")}.`)}</div>`) : ""}`;
}

// Up and down move through the Decisions list.
document.addEventListener("keydown", (e) => {
  if (route().tab !== "decisions" || (e.key !== "ArrowDown" && e.key !== "ArrowUp") || e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.target.closest?.("input, textarea, select, [contenteditable]")) return;
  const rows = [...$("left").querySelectorAll("a.row[data-item]")];
  if (!rows.length) return;
  const at = rows.findIndex((r) => r.getAttribute("aria-current") === "true");
  const next = rows[Math.min(rows.length - 1, Math.max(0, at + (e.key === "ArrowDown" ? 1 : -1)))];
  e.preventDefault();
  if (next === rows[at]) return next.focus();
  focusListAfterRender = true;
  location.hash = `decisions/${next.dataset.item}`;
});

// ---------- Docs: a reading view; the documents on the left, the chapters on the right ----------

function docsTab(flow, which) {
  $("content").innerHTML = `<div class="docs-layout"><article class="reading" id="doc"></article><nav class="chapters" id="chapters" aria-labelledby="toc-h"></nav></div>`;
  const box = $("doc");
  if (which === "Flow") {
    // flow.md through the enhancer: the parts the core recognised as UI, every other section as Markdown.
    box.innerHTML = `<h1 class="visually-hidden">${esc(flow.title ?? "flow.md")}</h1>` + flow.sections.map((s) => {
      const h = s.heading.toLowerCase();
      const body = h === "gates" ? `<ol class="rows">${flow.gates.map((g) => `<li class="row gate ${g.approved ? "passed" : "open"}"><span class="k num">G${g.n}</span><span class="ttl">Gate ${g.n}, ${esc(g.what)}</span><span class="mark">${g.approved ? `Passed ${day(g.approved)}` : "Open"}</span></li>`).join("")}</ol>`
        : h.startsWith("deviations") && flow.deviations.length ? deviationList(flow)
        : s.markdown ? `<div class="md">${md(s.markdown)}</div>` : `<p class="quiet">Nothing here yet.</p>`;
      return `<section class="doc-section"><h2>${inline(s.heading)}</h2>${body}</section>`;
    }).join("");
  } else {
    const text = DATA.docs?.[which];
    box.innerHTML = text ? `<div class="md">${md(text)}</div>` : `<div class="empty"><p>This run has no ${which.toLowerCase()}.md.</p></div>`;
  }
  const heads = [...box.querySelectorAll(which === "Flow" ? ".doc-section > h2" : ".md > h2, .md > h3")];
  heads.forEach((h, i) => { if (!h.id) h.id = `h-${i}`; });
  $("left").setAttribute("aria-label", "Documents");
  $("left").innerHTML = `<section class="group" aria-labelledby="docs-h"><h2 class="group-h" id="docs-h">Documents</h2>
      <ol class="rows">${DOCS.map(([k, label, file]) => `<li><a class="row plain" href="#docs/${k}" ${k === which ? 'aria-current="true"' : ""}><span class="ttl">${label}</span><span class="mark">${file}</span></a></li>`).join("")}</ol></section>`;
  const chapters = $("chapters");
  if (heads.length) {
    chapters.innerHTML = `<h2 class="group-h" id="toc-h">Chapters</h2>
      <ol class="toc">${heads.map((h) => `<li class="${h.tagName === "H3" ? "h3" : ""}"><a href="#docs/${which}" data-to="${h.id}">${esc(h.textContent)}</a></li>`).join("")}</ol>`;
    chapters.querySelectorAll("[data-to]").forEach((a) => (a.onclick = (e) => { e.preventDefault(); $(a.dataset.to).scrollIntoView({ block: "start" }); }));
  } else {
    chapters.remove();
  }
  diagrams(box);
}

// Mermaid blocks in any Markdown become diagrams; a block that fails stays as its source with the reason.
let diagramId = 0;
async function diagrams(root) {
  for (const code of root.querySelectorAll("pre > code.language-mermaid")) {
    const pre = code.parentElement;
    try {
      const { svg } = await mermaid.render(`diagram-${++diagramId}`, code.textContent);
      const fig = document.createElement("div");
      fig.className = "diagram";
      fig.innerHTML = svg;
      pre.replaceWith(fig);
    } catch (err) {
      const note = document.createElement("p");
      note.className = "quiet";
      note.textContent = `This diagram couldn't be drawn: ${err?.message ?? err}`;
      pre.after(note);
    }
  }
}

window.addEventListener("hashchange", () => { render(); $("content").scrollTo(0, 0); window.scrollTo(0, 0); });
render();
</script>
</body>
