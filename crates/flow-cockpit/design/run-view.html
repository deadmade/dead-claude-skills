<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flow run view</title>
<meta name="description" content="Design reference for the flow cockpit's flow run view, drawn from this run's own flow.md, plan.md and build log.">
<script src="https://cdn.jsdelivr.net/npm/marked@18.1.2/lib/marked.umd.js" integrity="sha384-nCN5FOaVTXXYilftBH/VQuC9ypBYOxrctAZn2x7ggYClXaporWSzM0y+ODhb8MTi" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.17/dist/purify.min.js" integrity="sha384-P0JNneQf81HOl9VwNXK76cQ9VMD6Nfsnepxb0cCOg8+UzEdzgPHAPV4wVQrvYQSx" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@12.2.0/dist/mermaid.min.js" integrity="sha384-8xUhuLNMjW/cI2Dacg3DR4WliYznvIg0LVG1stctThKD/YVrJFI9TNCFxft5NYgp" crossorigin="anonymous"></script>
<style>
/* Hallmark · shape: app screen · genre: atmospheric · theme: custom (Night City, the house look, by request)
 * paper: oklch(20% 0.03 300) · accent: oklch(76% 0.12 355) · display: Adwaita Sans · body: Adwaita Sans
 * nav: a window grid, a left column per tab (phases and tasks, deviations, the outline) and tabs on the content's edge · signature: the selected task, the one block at full contrast · states: empty, error, full
 * axes: dark/grotesk-sans/chromatic-pink · posture: calm reading · contrast: pass · v2.0.0 */
/* Hallmark · pre-emit critique: P4 H5 E4 S4 R5 V4 · weakest: E, the left column changes per tab while the grid stays; each screen keeps one block of running text at full contrast and folds the rest */
:root {
  /* One spacing scale; the window grid uses --gutter and --gap only. */
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 24px; --space-6: 32px; --space-7: 48px;
  --gutter: var(--space-5); --gap: var(--space-6);
  --text-xs: 0.8125rem; --text-sm: 0.875rem; --text-md: 1rem; --text-lg: 1.1875rem;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1); --dur-micro: 120ms;
  --left: clamp(22rem, 22vw, 28rem); --measure: 70ch;
  --bar-h: 56px;

  /* Night City (plugins/default/themes/night-city.json) */
  --color-paper: #1A1626;      /* background */
  --color-paper-2: #221D33;
  --color-paper-3: #2A2340;    /* userMessageBackground */
  --color-paper-4: #362D52;    /* userMessageBackgroundHover */
  --color-ink: #E6DCF7;        /* text */
  --color-ink-2: #BDB4DE;      /* inactiveShimmer */
  --color-muted: #9A90C2;      /* inactive */
  --color-rule: #2F2848;
  --color-accent: #F08BB4;     /* claude: waiting on you */
  --color-accent-ink: #1A1626;
  --color-focus: #7CCFE0;      /* suggestion */
  --color-link: #7CCFE0;
  --color-current: #B79CF0;    /* remember: being built */
  --color-done: #8FDDB0;       /* success */
  --color-warn: #F5B97A;       /* warning: fix rounds */
  --color-error: #F2788C;      /* error: security */
  --color-selection: #463A6E;  /* selectionBg */
  --color-code-bg: #1D2840;    /* bashMessageBackgroundColor */

  /* Installed faces only: Adwaita Sans on Linux, Segoe UI on Windows. Mono only where mono is the material. */
  --font-body: "Adwaita Sans", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  --font-display: var(--font-body);
  --font-mono: "JetBrains Mono", "Cascadia Mono", Consolas, monospace;
  --radius-row: 8px; --radius-pill: 999px; --radius-code: 6px;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { overflow-x: clip; }
html { scrollbar-color: var(--color-paper-4) var(--color-paper); }
body { margin: 0; background: var(--color-paper); color: var(--color-ink); font-family: var(--font-body); font-size: var(--text-md); line-height: 1.6; -webkit-font-smoothing: antialiased; caret-color: var(--color-accent); }
::selection { background: var(--color-selection); color: var(--color-ink); }
:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
h1, h2, h3 { margin: 0; font-family: var(--font-display); font-weight: 600; overflow-wrap: break-word; min-width: 0; text-wrap: balance; }
p { margin: 0; text-wrap: pretty; }
ol, ul { margin: 0; }
a { color: var(--color-link); text-underline-offset: 0.16em; }
a:hover { color: var(--color-ink); }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { opacity: 0.55; cursor: not-allowed; }
[hidden] { display: none !important; }
.num { font-variant-numeric: tabular-nums; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.quiet { color: var(--color-muted); }
code, pre { font-family: var(--font-mono); font-size: 0.86em; }
:not(pre) > code { background: var(--color-paper-3); color: inherit; padding: 1px var(--space-1); border-radius: 4px; }
pre { background: var(--color-code-bg); padding: var(--space-3) var(--space-4); border-radius: var(--radius-code); overflow: auto; line-height: 1.5; max-height: 28rem; }
summary { cursor: pointer; }

/* ---------- the window grid ----------
 * Two column lines carry everything: the left column's and the content's. The bar's cells sit on the same lines. */
.window { display: grid; grid-template-columns: var(--left) minmax(0, 1fr); grid-template-rows: var(--bar-h) minmax(0, 1fr); height: 100vh; }
.brand, .left { padding-inline: var(--gutter) var(--gap); border-right: 1px solid var(--color-rule); }
.tabs-bar, .content { padding-inline: var(--gap) var(--gutter); }
.brand { display: flex; align-items: center; gap: var(--space-3); border-bottom: 1px solid var(--color-rule); min-width: 0; }
.brand .app { color: var(--color-muted); font-size: var(--text-sm); white-space: nowrap; }
.brand h1 { font-size: var(--text-md); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tabs-bar { display: flex; align-items: center; gap: var(--space-4); border-bottom: 1px solid var(--color-rule); }
.left, .content { overflow-y: auto; min-height: 0; }
.left { padding-block: var(--space-5) var(--space-7); }
.content { padding-block: var(--space-5) var(--space-7); }

.tabs { display: flex; gap: var(--space-1); margin-left: calc(-1 * var(--space-3)); }
.tab { border: 0; background: none; padding: var(--space-2) var(--space-3); min-height: 36px; border-radius: var(--radius-row); color: var(--color-muted); font-size: var(--text-sm); transition: background-color var(--dur-micro) var(--ease-out), color var(--dur-micro) var(--ease-out); }
.tab:hover { color: var(--color-ink); background: var(--color-paper-2); }
.tab:active { background: var(--color-paper-3); }
.tab[aria-selected="true"] { color: var(--color-ink); background: var(--color-paper-3); }
.tabs-bar .where { margin-left: auto; color: var(--color-muted); font-size: var(--text-sm); white-space: nowrap; }
.status { display: inline-block; font-size: var(--text-xs); font-weight: 500; padding: 2px var(--space-3); border-radius: var(--radius-pill); white-space: nowrap; margin-left: var(--space-2); }
.st-Waiting { background: color-mix(in oklab, var(--color-accent) 20%, transparent); color: var(--color-accent); }
.st-Working { background: color-mix(in oklab, var(--color-focus) 16%, transparent); color: var(--color-focus); }
.st-Idle { background: var(--color-paper-3); color: var(--color-muted); }
.st-Done { background: color-mix(in oklab, var(--color-done) 14%, transparent); color: var(--color-done); }

/* Group headings in the left column: the body face, a step smaller, sentence case, on the rows' edge. */
.group-h { display: flex; justify-content: space-between; gap: var(--space-3); font-size: var(--text-sm); font-weight: 600; color: var(--color-ink-2); margin-bottom: var(--space-2); }
.group-h .aside { font-weight: 400; color: var(--color-muted); font-size: var(--text-xs); align-self: baseline; }
.left .group + .group { margin-top: var(--space-6); }

/* ---------- the phase track: one line, the full list on demand ---------- */
.track { display: block; width: calc(100% + 2 * var(--space-3)); margin-inline: calc(-1 * var(--space-3)); padding: var(--space-1) var(--space-3); border: 0; border-radius: var(--radius-row); background: none; text-align: left; transition: background-color var(--dur-micro) var(--ease-out); }
.track:hover { background: var(--color-paper-2); }
.track:active, .track[aria-expanded="true"] { background: var(--color-paper-3); }
.segs { display: flex; align-items: center; gap: var(--space-1); height: 12px; }
.seg { flex: 1; height: 6px; border-radius: 3px; background: var(--color-paper-4); }
.seg.done { background: color-mix(in oklab, var(--color-done) 45%, var(--color-paper-3)); }
.seg.current { background: var(--color-current); }
.tick { width: 2px; height: 12px; border-radius: 1px; background: var(--color-accent); }
.tick.passed { background: var(--color-done); }
.track-text { display: block; margin-top: var(--space-1); font-size: var(--text-sm); color: var(--color-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.track-text b { color: var(--color-ink); font-weight: 600; }
.track-gates { font-size: var(--text-xs); color: var(--color-muted); margin-top: var(--space-1); }
.phase-list { margin-top: var(--space-2); }

/* Rows share one set of columns: number, words, mark. Hover fills edge to edge; text stays on the edge. */
.rows { list-style: none; padding: 0; }
.row { display: grid; grid-template-columns: 2rem minmax(0, 1fr) auto; gap: 0 var(--space-3); align-items: baseline; width: calc(100% + 2 * var(--space-3)); margin-inline: calc(-1 * var(--space-3)); padding: var(--space-1) var(--space-3); border: 0; border-radius: var(--radius-row); background: none; text-align: left; text-decoration: none; color: var(--color-ink-2); font-size: var(--text-sm); line-height: 1.7; transition: background-color var(--dur-micro) var(--ease-out); }
a.row:hover, button.row:hover { background: var(--color-paper-2); color: var(--color-ink); }
a.row:active, button.row:active { background: var(--color-paper-3); }
.row .k { color: var(--color-muted); }
.row .ttl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .mark { font-size: var(--text-xs); color: var(--color-muted); white-space: nowrap; }
.row[aria-current="true"] { background: var(--color-paper-3); color: var(--color-ink); }
.row[aria-current="true"] .ttl { white-space: normal; }
.row.done { color: var(--color-muted); }
.row.done .k { color: color-mix(in oklab, var(--color-muted) 70%, var(--color-paper)); }
.mark.Building, .mark.Review { color: var(--color-current); font-weight: 600; }
.mark.Waiting { color: var(--color-accent); font-weight: 600; }
.mark.fix { color: var(--color-warn); }
.mark.sec { color: var(--color-error); }
.phase.done .mark { color: var(--color-done); }
.phase.current { color: var(--color-ink); }
.phase.current .k, .phase.current .mark { color: var(--color-current); font-weight: 600; }
.gate .ttl { color: var(--color-muted); }
.gate.passed .mark { color: var(--color-done); }
.gate.open .mark { color: var(--color-accent); }
.gate[aria-expanded="true"] { background: var(--color-paper-2); }
.gate-note { grid-column: 2 / -1; padding: var(--space-1) 0 var(--space-3); font-size: var(--text-xs); color: var(--color-muted); white-space: normal; }
.gate-note > span { display: block; }
.gate-note .rawline { margin-top: var(--space-2); }
.gate-note .verdict { color: var(--color-ink-2); }

/* ---------- content ---------- */
/* The run's own sentence, full only on Build: one line where it fits, the summary quiet under it. */
.now { padding-bottom: var(--space-5); margin-bottom: var(--space-6); border-bottom: 1px solid var(--color-rule); }
.now .sentence { font-size: var(--text-lg); line-height: 1.4; color: var(--color-ink-2); max-width: var(--measure); }
.now.waiting .sentence { color: var(--color-accent); }
.now .summary { margin-top: var(--space-1); font-size: var(--text-sm); color: var(--color-muted); max-width: var(--measure); }

/* The selected task: the one block at full contrast. Beside it on wide windows, its place in the graph. */
.task { display: grid; grid-template-columns: minmax(0, var(--measure)); gap: var(--space-6) var(--space-7); align-items: start; }
@media (min-width: 110rem) { .task { grid-template-columns: minmax(0, 64ch) minmax(0, 1fr); } .task .where-graph { position: sticky; top: 0; } }
.task-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--space-1) var(--space-4); }
.task-h h2 { font-size: var(--text-lg); line-height: 1.35; }
.task-h .n { color: var(--color-muted); font-weight: 400; margin-right: var(--space-2); }
.task-h .state { font-size: var(--text-md); color: var(--color-muted); }
.task-h .state.Done { color: var(--color-done); }
.task-h .state.Building, .task-h .state.Review { color: var(--color-current); }
.task-h .state.Waiting { color: var(--color-accent); }
.does { margin-top: var(--space-3); color: var(--color-ink); }
.facts { margin-top: var(--space-2); color: var(--color-muted); }
/* Sections of the selected task share one heading style; a count sits where the rail puts its counts. */
.part { margin-top: var(--space-6); }
.part-h { display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-3); font-size: var(--text-md); color: var(--color-ink-2); margin-bottom: var(--space-1); }
.part-h .count { font-size: var(--text-xs); font-weight: 400; color: var(--color-muted); }
.part p { color: var(--color-muted); }
.part .warn { color: var(--color-warn); }
.part .sec { color: var(--color-error); }
.items { padding-left: 1.3em; color: var(--color-muted); }
.items li + li { margin-top: var(--space-2); }
.items li::marker { color: var(--color-muted); }
/* A fold that must stay folded looks like the page's own rows: the same type and edge, no link colour. */
details.unfold { margin-top: var(--space-1); }
details.unfold > summary { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--space-3); align-items: baseline; width: calc(100% + 2 * var(--space-3)); margin-inline: calc(-1 * var(--space-3)); padding: var(--space-1) var(--space-3); border-radius: var(--radius-row); font-size: var(--text-sm); line-height: 1.7; color: var(--color-ink-2); list-style: none; transition: background-color var(--dur-micro) var(--ease-out); }
details.unfold > summary::-webkit-details-marker { display: none; }
details.unfold > summary:hover { background: var(--color-paper-2); color: var(--color-ink); }
details.unfold > summary:active, details.unfold[open] > summary { background: var(--color-paper-3); }
details.unfold > summary .count { font-size: var(--text-xs); color: var(--color-muted); }
details.unfold > .unfold-body { padding: var(--space-3) 0 var(--space-2); }
.key { font-size: var(--text-sm); color: var(--color-muted); margin-bottom: var(--space-2); }
.key .k-done { color: var(--color-done); }
.key .k-now { color: var(--color-current); }
.key .k-wait { color: var(--color-accent); }
.graph { overflow-x: auto; }
.graph svg { display: block; }
.graph .node { cursor: pointer; }

/* ---------- Decisions: master and detail, like Docs ---------- */
.row.plain { grid-template-columns: minmax(0, 1fr) auto; }
.row.open-dev { background: color-mix(in oklab, var(--color-accent) 11%, var(--color-paper-2)); color: var(--color-ink); }
.row.open-dev .mark, .mark.Open { color: var(--color-accent); font-weight: 600; }
.row.quiet-row { color: var(--color-muted); }
.item-h { font-size: var(--text-lg); line-height: 1.35; color: var(--color-ink); }
.item-meta { margin-top: var(--space-1); font-size: var(--text-sm); color: var(--color-muted); }
.item-meta .tag { margin-right: var(--space-1); }
.item-lead { margin-top: var(--space-4); color: var(--color-ink); }
.item-lead .tag, .item-meta .tag { color: var(--color-done); font-weight: 600; margin-right: var(--space-2); }
.item-lead .tag.open, .item-meta .tag.open { color: var(--color-accent); }
.item .part .md { color: var(--color-ink-2); }
.devs { list-style: none; padding: 0; }
.dev + .dev { margin-top: var(--space-2); }
.dev > summary { display: block; padding: var(--space-2) var(--space-3); margin-inline: calc(-1 * var(--space-3)); border-radius: var(--radius-row); list-style: none; font-size: var(--text-sm); color: var(--color-ink-2); transition: background-color var(--dur-micro) var(--ease-out); }
.dev > summary::-webkit-details-marker { display: none; }
.dev > summary:hover { background: var(--color-paper-2); }
.dev[open] > summary { background: var(--color-paper-3); }
.dev .v { display: block; font-size: var(--text-xs); color: var(--color-muted); margin-top: 2px; }
.dev.open > summary { background: color-mix(in oklab, var(--color-accent) 11%, var(--color-paper-2)); color: var(--color-ink); }
.dev.open .v { color: var(--color-accent); }
.dev-body { padding: var(--space-2) 0 var(--space-3); font-size: var(--text-sm); color: var(--color-muted); }
.dev-body .what { color: var(--color-ink-2); }
.dev-body .md { margin-top: var(--space-2); }

/* ---------- Docs: a reading view, the documents on the left, the chapters on the right ---------- */
.docs-layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--space-6) var(--space-7); }
.reading { max-width: var(--measure); margin-inline: auto; width: 100%; }
.chapters { order: -1; }
@media (min-width: 80rem) {
  .docs-layout { grid-template-columns: minmax(0, 1fr) clamp(16rem, 18vw, 22rem); }
  .chapters { order: 0; position: sticky; top: var(--space-5); align-self: start; max-height: calc(100vh - var(--bar-h) - 2 * var(--space-5)); overflow-y: auto; }
}
.toc { list-style: none; padding: 0; }
.toc a { display: block; padding: var(--space-1) 0; color: var(--color-muted); text-decoration: none; font-size: var(--text-sm); border-radius: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.toc a:hover { color: var(--color-ink); }
.toc .h3 a { padding-left: var(--space-4); font-size: var(--text-xs); }
.doc-section + .doc-section { margin-top: var(--space-7); }
.doc-section > h2 { font-size: var(--text-lg); margin-bottom: var(--space-3); }

.md { line-height: 1.7; color: var(--color-ink-2); }
.md > * + * { margin-top: var(--space-3); }
.md h1 { font-size: var(--text-lg); color: var(--color-ink); }
.md h2 { font-size: var(--text-lg); color: var(--color-ink); margin-top: var(--space-7); }
.md h3 { font-size: var(--text-md); color: var(--color-ink); margin-top: var(--space-6); }
.md h4 { font-size: var(--text-md); color: var(--color-ink-2); margin-top: var(--space-5); }
.md > :first-child { margin-top: 0; }
.md p, .md ul, .md ol { margin-block: 0; }
.md ul, .md ol { padding-left: 1.3em; }
.md li + li { margin-top: var(--space-1); }
.md strong { color: var(--color-ink); font-weight: 600; }
.md blockquote { margin-inline: 0; padding-left: var(--space-4); border-left: 2px solid var(--color-paper-4); color: var(--color-ink-2); }
.md table { border-collapse: collapse; font-size: var(--text-sm); display: block; max-width: 100%; overflow-x: auto; }
.md th, .md td { padding: var(--space-2) var(--space-3); border-bottom: 1px solid var(--color-rule); text-align: left; vertical-align: top; }
.md th { color: var(--color-ink); font-weight: 600; }
.md th:first-child, .md td:first-child { padding-left: 0; }
.md pre code { background: none; padding: 0; }
.md .diagram { overflow-x: auto; }

.empty, .error { max-width: var(--measure); color: var(--color-ink-2); padding-block: var(--space-2); }
.empty p + p, .error p + p { margin-top: var(--space-2); color: var(--color-muted); font-size: var(--text-sm); }
.error h2 { font-size: var(--text-md); color: var(--color-error); margin-bottom: var(--space-2); }

/* Under 64rem the window becomes a page: bar, content, then the left column. */
@media (max-width: 64rem) {
  :root { --gutter: 16px; --gap: 16px; }
  .window { display: flex; flex-direction: column; height: auto; }
  .brand, .left, .tabs-bar, .content { padding-inline: var(--gutter); border-right: 0; }
  .brand { min-height: 48px; }
  .tabs-bar { min-height: 52px; flex-wrap: wrap; }
  .tabs-bar .where { display: none; }
  .left, .content { overflow: visible; }
  .left { order: 1; border-top: 1px solid var(--color-rule); }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; } }
</style>
</head>
<body>
<div class="window">
  <div class="brand"><span class="app">Flow cockpit</span><h1 id="run-name">Flow run</h1></div>
  <div class="tabs-bar"><div class="tabs" role="tablist" aria-label="Parts of this run" id="tabs"></div><p class="where" id="where"></p></div>
  <aside class="left" id="left"></aside>
  <div class="content" id="content" role="tabpanel">
    <noscript><div class="empty"><p>This design reference draws the run from its data with JavaScript.</p><p>Open it in a browser with scripting on.</p></div></noscript>
  </div>

<script type="application/json" id="flow-json">{"decisions":[{"body":"Offered 2026-10-28, with evidence: E2, E10 back an at-a-glance state view with detail one step away; E4, E5 warn\nagainst always-on detail; E6 says showing more pays off for people working with the agents, not people who only\nwatch. Nothing in the literature compares surfaces.\n\n- Diagrams in the docs only, viewed in existing Markdown renderers (S). Kept as a slice, not the whole answer.\n- Own desktop window, Tauri (L).\n- Terminal viewer in its own pane (L): rejected by the user, diagrams don't work well in a terminal.\n- Desktop cockpit hosting Claude Code in embedded PTYs (L+): replaced; running Claude Code inside the app is the risky\n  part.\n- Terminal cockpit hosting Claude Code (like CCManager): rejected, text-only diagrams and a terminal in a terminal.\n- Agent teams in tmux panes: Linux only (no Windows Terminal split panes); separate question, not picked.\n- **Picked (user's proposal, recommended):** Claude Code stays in the user's terminal; hooks and a mod capture what the\n  session and its subagents do into per-session event files; a separate desktop window (Tauri) follows those files\n  plus flow.md, the SDD ledgers and transcripts, and draws runs, phases, the task graph and review loops, live agent\n  activity, and the docs with Mermaid. **Scope (user, 2026-10-28):** \"lets first just focus on the visulisation and\n  capturing what claude code and the subagents to do just visulize everything that happens with the flows and keep\n  the actually interacting with claude out of it for now\". No answering questions, no starting flows, no typing.","picked":"Claude Code stays in the user's terminal, and a separate desktop window (Tauri) draws what the sessions and their subagents do, from captured events, flow.md, the SDD ledgers and transcripts; watching only, no interacting with Claude.","title":"Surface and shape"},{"body":"Rust extensions considered: a 15-line serde cdylib built in 6.4 s clean, 0.75 s release / 0.32 s debug incremental on\nthis machine (24 cores), so compile time isn't the objection; drawing in the webview, no stable plugin ABI, a\ntoolchain on every machine and a longer agent loop are.","picked":"Rust core, TypeScript views (user, 2026-10-28).","title":"Language"},{"body":"\"Lets create a prototype for that. So my inial idea was to have a drop down\nto select the projects im working on. And a list of flows that currently run or have run with filter and sort. I can\nsee on which steps they are, are they waiting, what kind of flow was it etc. When I click of them I get the detailed\nview with task list chat out put etc\". Built as a clickable page in the brainstorm companion from real data (a\nscratchpad extraction script), not Tauri; nothing of it is kept without going through the plan.\n\nWhat the spike showed (2026-10-28):\n\n- Reading everything from disk is cheap: 19 flows, 638 sessions (750 MB of transcripts), build logs and subagent\n  files in about 1.4 s, using one `grep` pass to link sessions to flows.\n- A project is more than one folder: sessions ran in `~/dead-claude-skills`, the flows now live in\n  `~/projects/dead-claude-skills`, plus worktrees under `.claude/worktrees/`. The prototype folds them by folder name.\n- Linking a session to a flow works when the session edited or wrote that flow's flow.md; a mere mention links nearly\n  every session to every flow.\n- \"Waiting on you\" from \"the last message ends with a question\" flagged web-mcp, idle 5 days, with 16 of 18 tasks done:\n  a forgotten run, not a live question. Live state needs the capture; disk alone gives history.\n- No plan declares task dependencies, so the graph can only show plan order. No existing spec or plan has a Mermaid\n  block.\n- The brainstorm companion reloads or blanks a full-document page; the prototype is served on its own port instead.\n- User, 2026-10-28: \"the shape feels right but most of it have really hard edges. Its really important that its easy\n  and nice to read\". Readability is a goal of its own, not polish.\n- Restyle (hallmark, app scope, fast mode): Night City's own palette from `plugins/default/themes/night-city.json`\n  instead of saturated ad-hoc colours, IBM Plex Sans 16px body, tone-stepped surfaces instead of 1px borders, rounded\n  rows and panels, prose capped at 72–75ch, tool calls as one quiet line that opens to the diff or command, Mermaid\n  themed dark to match, inline code rendered in log lines. `sloplint --scope app`: clean. The blank pages seen while\n  testing were the headless test browser dropping every tab about 10 s after it opened (an untouched list page too),\n  not the page or Mermaid.\n- User, 2026-10-28: \"table good, but the individual runs are still quit messy and really hard to read or not able to\n  read at all\". Run view rebuilt around reading: the Build tab opens with a two-sentence summary (\"16 of 18 tasks\n  done. Next up: …\"), one line per task with a plain state (\"Done after 2 fix rounds\"), and a task opens to \"What\n  happened\" as numbered sentences, then Security, Decisions (decision, why, if wrong) and Left for later. The plan-order\n  diagram is gone (a straight line says nothing). The Conversation tab groups the transcript into turns, newest first:\n  your prompt, the work folded into one line (\"Changed 6 files, ran 16 commands\"), earlier notes folded, Claude's\n  answer; older turns clamp to six lines. Wrapped build-log lines are now joined by the extractor.\n- User, 2026-10-28: \"task view is shit, i see there are 10 task but what do they do I cant see at a glance. Decisions\n  are really hard to read. COnversations is just a long list of text. Its so hard to read. Docs same issue again and\n  overview not sure about that\". Diagnosis: the source text is written for agents (a plan task is a title plus a dense\n  interface spec, no plain \"what it does\" line; ledger lines and rulings are compressed technical prose; transcripts\n  are long by nature). Restyling can't make that glanceable; it needs a distilling step, written by the flows or by a\n  model in the app.\n- For the real app: rendered Markdown from transcripts and build logs is untrusted (web pages end up in them), so it\n  needs a sanitiser before it reaches the DOM; the prototype doesn't have one.","picked":"a throwaway clickable prototype from real data, agreed 2026-10-28.","title":"Spike"},{"body":"- User, 2026-10-28, on \"flows write it\" vs \"Haiku summarises\": \"instead of just rendering markdown could we just\n  enhance whats written. I will change the flow.md and shit a bit better etc\". Direction: better source documents\n  (the user reworks them), and a viewer that recognises their structure and draws it as UI instead of rendering\n  Markdown as is. Haiku summaries not picked.","picked":"better source documents, which the viewer draws as UI by their structure; Haiku summaries not picked.","title":"Readable documents or model summaries"},{"body":"- 2026-10-28, which documents get the readable format: offered flow.md only / flow.md + plan / + build log\n  (recommended flow.md + plan). User: \"2\". The plan's part (one plain line per task, dependencies) goes in through a\n  conductor override of `writing-plans`; the build log stays as it is for now.","picked":"flow.md and the plan; the build log stays as it is for now.","title":"Which documents get the readable format"},{"body":"","picked":"no mod. The capture and transcripts cover agent state, questions and permission prompts; a mod is revisited only if a gap shows (plan review round 1, 2026-10-28).","title":"Mod or no mod"},{"body":"Mockup round 1 (2026-10-28, `crates/flow-cockpit/design/run-view.html`): the user likes the theme and the colouring,\nand hates the alignment: \"it 100% looks like ai and kinda lazy\", \"also half the screen is empty\" (a centred capped\ncolumn at ~1880 px). Fonts: installed ones, no bundled or downloaded font. Reworking it as an app window that fills\nthe width on one grid, with fewer boxes; not picked yet.\n\nMockup round 2 (2026-10-28): \"definetly a good step up but now its just bam 3 or 4 walls of text. Its overwhelming a\nbit but definetly the right direction\"; the user asked Claude to analyse it. Reworking for one focal point per\nscreen: the selected task on Build, phases as one line, one-line task rows, decisions as expandable lists, no task\nrail on Decisions and Docs.\n\nMockup round 3 (2026-10-28): \"Rest awesome except the decissions tab\". The user moved the chapters to the right on\nDocs, with the documents on the left. Two changes asked: the clickable inline links in Build (\"the build log, 1\nentry\") don't fit the scheme; Decisions should be decisions and deviations on the left with the text in the middle.","picked":"the mockup in `crates/flow-cockpit/design/run-view.html` after three reworks, approved 2026-10-28 (\"its fucking awesome!!! lets goo\"): an app window on one grid; Build is a phase track and one-line task rail beside the selected task, with folds styled as rows; Decisions and Docs are master and detail; installed fonts; the Night City palette unchanged.","title":"Flow run view"},{"body":"","picked":"go for slice 2 (Tasks 10 to 13), user, 2026-10-29, after using slice 1's window (\"I like what you build\"). At the checkpoint the Nix-built window died on the user's NVIDIA card under Wayland (\"Error 71 (Protocol error)\"); `WEBKIT_DISABLE_DMABUF_RENDERER=1` fixed it, and the app now sets it itself (Rulings, Task 9 follow-up).","title":"Slice 2"}],"deviations":[{"body":"The plan asked for trimmed real transcripts. Copying them into the public repo was blocked, so the implementer reads\nreal transcripts only for their JSON shapes and field names and writes the fixture lines with invented text.","status":{"Decided":{"date":"2026-10-28","what":"hand-written in the real shape"}},"title":"Task 3 transcript fixtures are hand-written, not trimmed real ones"},{"body":"The plan's `Text` carries no agent, so Task 3 dropped every subagent reply, final reports included; only their tool\ncalls showed.","status":{"Decided":{"date":"2026-10-28","what":"`Text` gains `agent: Option\u003cString>`, and subagent replies land in the turn open at their time"}},"title":"Subagent text replies have no place in the activity model"},{"body":"Status was derived only when a project's files changed, so a run whose Claude session stopped stayed Working.","status":{"Decided":{"date":"2026-10-28","what":"`Index::refresh(now)` re-derives every status from cached facts without reading the disk; Task 6's poll calls it each tick"}},"title":"Status never decays without a file change"},{"body":"The page parses flow.md's Rulings, keeps each conductor's phase list and gate positions, and strips the\n`minor (deferred):` tag itself, against \"the document format is resolved in the core\".","status":{"Decided":{"date":"2026-10-29","what":"a new Task 5b before Task 6 gives the core typed `Ruling`s (flow.md and build log), `FlowDoc.phases` from the conductors' phase tables (checked against each SKILL.md), and untagged deferred items; the mockup switches to those fields"}},"title":"The approved mockup reads document format in the view"},{"body":"The core's export wiped the whole `bindings/` folder and its check failed on any file it didn't write, so the app's\n`ViewInfo` would break it.","status":{"Decided":{"date":"2026-10-29","what":"each crate owns its files; the core writes and checks only its own, and the app's check covers the whole folder; `core/src/bindings.rs` joins Task 6's files"}},"title":"Two crates share one bindings folder"},{"body":"Tauri always creates the webview's data folder (`~/.local/share/dev.deadmade.flow-cockpit/`, `%LOCALAPPDATA%` on\nWindows), incognito or not; it can be moved, not stopped. \"The app writes nothing\" didn't hold.","status":{"Decided":{"date":"2026-10-29","what":"accepted; the rule reads \"our code writes nothing; the webview engine keeps its own small folder\""}},"title":"The webview writes its own data folder"},{"body":"`view_source(id)` always returns the global copy when one exists, and the built-ins live only inside the binary, so\nthe window couldn't draw the built-in under a broken copy's error.","status":{"Decided":{"date":"2026-10-29","what":"`view_source(id, builtin: Option\u003cbool>)`; with `true` it returns the built-in; the runtime uses it, views don't see it; `commands.rs` and `views.rs` join Task 7's files"}},"title":"A broken copy of a built-in view can't fall back"},{"body":"The plan's `ViewContext` had no route, so a view couldn't tell which run or doc it draws; and the approved run view\ndraws the whole window, tab bar included, with no place for `run-tab` views.","status":{"Decided":{"date":"2026-10-29","what":"`ViewContext` gains a read-only `route` and `tabs` (the loaded run-tab views); the run view puts them in its tab bar, and a selected tab's view is drawn into the run view's `data-slot=\"run-tab\"` element"}},"title":"Views don't know their route, and run tabs have no place"},{"body":"The spec lists loose sessions \"so any Claude session's activity can be found\", but no route led to a session that\nbelongs to no run.","status":{"Decided":{"date":"2026-10-29","what":"`Route` gains `{ to: 'session', project, id }`, documented in `api.d.ts`; the activity view draws it; `runtime.js`, `api.d.ts` and `runtime.test.mjs` join Task 8's files"}},"title":"Loose sessions can't be opened"},{"body":"The spec's list shows each audit's picks and how many were fixed; `AuditSummary` carried only open, closed or unknown.","status":{"Decided":{"date":"2026-10-29","what":"`AuditSummary` gains `picks: Option\u003cu32>` and `fixed: u32` from the parsed report"}},"title":"Audit rows lack picks and fixed counts"},{"body":"After using slice 1 the user asked for projects and runs to be apart, and for a switch between flow runs and loose\nsessions. Task 8's list puts projects, status and conductor filters and the sort in one left rail beside the rows.","status":{"Decided":{"date":"2026-10-29","what":"the left rail keeps only Projects; the runs side gets a switch, Flow runs or Loose sessions (audits stay under Flow runs), a filter bar (status, conductor, sort, search) and a table with column headings. Built as Task 8b, after Task 10 and before Task 11."}},"title":"The list mixes projects, filters and runs"},{"body":"The user asked for back and forward through the pages, and for a reload to keep the page. The runtime keeps the route\nin memory only, so a reload opens the list and there is no history.","status":{"Decided":{"date":"2026-10-29","what":"the route lives in the window's address (its hash), so the mouse's back and forward side buttons move through the pages and a reload (F5 or Ctrl+R) keeps the page; no top-bar buttons or keys. A fresh start opens the list, and nothing is written to disk. Built as Task 8e, after the extensions (Task 8c) and lettered task ids (Task 8d)."}},"title":"No way back, and a reload loses the page"},{"body":"Changing a default view needs a rebuild, a default can only be replaced, not switched off, and the views skill lives\nin a Claude Code plugin although the views belong to the app. The user wants the defaults shipped like extensions that\nanyone can disable, owned by the app so it runs on its own, not by a Claude Code plugin.","status":{"Decided":{"date":"2026-10-29","what":"the app gets its own extensions. An extension is a folder with one or more view files and an optional `style.css`, no manifest; the folder name is its id. The defaults (list, run, docs, activity) ship with the app (Nix: `share/flow-cockpit/extensions`; later the Windows installer's folder); the user's go in `~/.config/flow-cockpit/extensions/`, and one with a default's name replaces it. All are loaded from disk and reloaded live. `disabled = [\"\u003cname>\"]` in `config.toml`, read live, switches one off; the window stays read-only. The Claude Code plugin keeps only the views skill and the capture hooks. Built as Task 8c, after Task 8b."}},"title":"Built-in views are compiled into the app"},{"body":"The Build tab lists only plan.md's tasks, and the core reads task numbers as plain numbers, so tasks added by a\ndecision (5b, 8b, 8c, 8d, 8e) are invisible and the task card points at the wrong task while one of them is built.","status":{"Decided":{"date":"2026-10-29","what":"plan.md gets each added task under its lettered number, with a line naming the decision that added it; the core reads ids like `8b` and orders them after 8; the flows' rules say how an added task is numbered. Built as Task 8d, before back and forward (now Task 8e)."}},"title":"Tasks added during a build don't show"},{"body":"The user: Activity is slow or freezes. Every 2 s while a session runs it re-reads the whole transcript (34 MB for this\nbuild's session, about 113 MB with its 88 subagents), sends every turn with every tool input to the window and redraws\nall of it.","status":{"Decided":{"date":"2026-10-29","what":"the core reads only what was appended since the last read, outside the index lock; the window gets the newest 20 turns with a \"Show older turns\" button, and a tool call's input is fetched only when its fold opens. Measured on this session's transcript before and after. Built as Task 8f, right after the extensions' fix round, before Tasks 8d and 8e."}},"title":"Activity freezes on a large running session"},{"body":"The user asked for the Mermaid diagrams to be drawn ahead so a page doesn't flash when it first opens. Today a diagram\nshows its source text until Mermaid has drawn it, then jumps to the drawing; only a redraw of a diagram already drawn\nis instant.","status":{"Decided":{"date":"2026-10-29","what":"the window draws diagrams ahead, in idle time: on start the task graphs and document diagrams of the shown project's unfinished runs, and on opening a run the rest of that run's documents. A diagram not drawn yet shows a quiet placeholder of the right size instead of its source; the source shows only when drawing fails. Drawings are kept in memory only (nothing written to disk). Built as Task 8g, after Task 8e."}},"title":"Diagrams flash when a page first opens"}],"flow":"feature","gates":[{"approved":"2026-10-28","n":1,"raw":"- Gate 1, spec approved: 2026-10-28, \"yes, approved\". Reopened 2026-10-28: plan review round 1 changed the capture events, the status rules, the audit `Picks:`/`Fixed` lines, the Windows delivery and added slices (spec items marked **(review 1)**); round 2 added the `Waiting for you` prefix and the Windows hiding in slice 1 (**(review 2)**). Re-approved 2026-10-28, \"Approve the spec\".","reopened":true,"what":"spec approved"},{"approved":"2026-10-28","n":2,"raw":"- Gate 2, plan approved: 2026-10-28, execution: subagent-driven, \"Approve, subagent-driven\"","reopened":false,"what":"plan approved"}],"now":"Building Task 8d, tasks added during a build shown in their place (lettered ids).","phase":"execute","phases":[{"gate_after":null,"key":"ground","name":"Ground","state":"Done"},{"gate_after":null,"key":"brainstorm","name":"Brainstorm","state":"Done"},{"gate_after":1,"key":"grill","name":"Grill","state":"Done"},{"gate_after":null,"key":"plan","name":"Plan","state":"Done"},{"gate_after":2,"key":"evaluate","name":"Evaluate","state":"Done"},{"gate_after":null,"key":"execute","name":"Build","state":"Now"},{"gate_after":null,"key":"finish","name":"Verify and finish","state":"Later"}],"rulings":[{"call":"Task 5 keeps every existing flow.md section while converting; the controller writes flow.md only between tasks","cost":"a manual merge if a line lands mid-task.","date":"2026-10-28","raw":"2026-10-28, setup: Task 5 keeps every existing flow.md section while converting; the controller writes flow.md only between tasks — both write flow.md — costs a manual merge if a line lands mid-task.","scope":"setup","why":"both write flow.md"},{"call":"the brief clause and Glo
