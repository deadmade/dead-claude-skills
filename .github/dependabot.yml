version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: cargo
    directories: ['/crates/tui-review', '/crates/web-mcp']
    schedule:
      interval: weekly
      day: monday
    groups:
      cargo:
        patterns: ['*']
  - package-ecosystem: uv
    directory: /plugins/opt-in/headroom-trim/server
    schedule:
      interval: weekly
      day: monday
    groups:
      uv:
        patterns: ['*']
