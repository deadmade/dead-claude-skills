name: Sync paper-lookup

on:
  schedule:
    - cron: '30 6 * * 1' # Mondays 06:30 UTC
  workflow_dispatch:

# The sync App pushes the branch and opens the PR, so the workflow's own token only reads.
permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sync skill from upstream
        run: node scripts/sync-paper-lookup.mjs

      - name: Sanity checks
        run: |
          jq empty .claude-plugin/marketplace.json plugins/flows/packs/paper-lookup/.claude-plugin/plugin.json
          test -s plugins/flows/packs/paper-lookup/skills/paper-lookup/SKILL.md
          ! grep -q "Citing Scientific Agent Skills" plugins/flows/packs/paper-lookup/skills/paper-lookup/SKILL.md
          echo "sha=$(cat plugins/flows/packs/paper-lookup/skills/paper-lookup/UPSTREAM)" >> "$GITHUB_OUTPUT"
        id: check

      - name: Repo checks
        run: node scripts/check-repo.mjs

      - name: Skill scan
        run: npm run scan-skills

      # A PR opened with the workflow's token starts no other workflow; the sync App's lets test.yml run on it.
      - name: App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app.outputs.token }}
          branch: sync/paper-lookup
          delete-branch: true
          commit-message: 'Sync paper-lookup to ${{ steps.check.outputs.sha }}'
          title: 'Sync paper-lookup to ${{ steps.check.outputs.sha }}'
          body: |
            Automated sync of `skills/paper-lookup` from https://github.com/K-Dense-AI/scientific-agent-skills at
            https://github.com/K-Dense-AI/scientific-agent-skills/commit/${{ steps.check.outputs.sha }}.

            cc @deadmade
          add-paths: plugins/flows/packs/paper-lookup/skills/paper-lookup
