name: Sync agent-browser

on:
  schedule:
    - cron: '45 7 * * 1' # Mondays 07:45 UTC
  workflow_dispatch:

# The sync App pushes the branch and opens the PR, so the workflow's own token only reads.
permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Imports installer/core/binaries.ts, so it needs a Node that strips types.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Pin the newest agent-browser release
        id: pin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/vercel-labs/agent-browser/releases/latest > "$RUNNER_TEMP/release.json"
          node --input-type=module -e '
            import { readFileSync, writeFileSync, appendFileSync } from "node:fs";
            import { AGENT_BROWSER_FILES } from "./installer/core/binaries.ts";
            const release = JSON.parse(readFileSync(process.argv[1], "utf8"));
            const tag = /^v(\d+\.\d+\.\d+)$/.exec(release.tag_name)?.[1];
            if (!tag) throw new Error(`unexpected tag ${release.tag_name}`);
            const sha256 = Object.fromEntries(Object.entries(AGENT_BROWSER_FILES).map(([key, file]) => {
              const digest = /^sha256:([0-9a-f]{64})$/.exec(release.assets.find((a) => a.name === file)?.digest ?? "")?.[1];
              if (!digest) throw new Error(`no sha256 digest for ${file}`);
              return [key, digest];
            }));
            writeFileSync("installer/assets/agent-browser.json", JSON.stringify({ upstream: tag, sha256 }, null, 2) + "\n");
            appendFileSync(process.env.GITHUB_OUTPUT, `tag=${tag}\n`);
          ' "$RUNNER_TEMP/release.json"

      # A PR opened with the workflow's token starts no other workflow; the sync App's lets test.yml run on it.
      - name: App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app.outputs.token }}
          branch: sync/agent-browser
          delete-branch: true
          commit-message: 'Pin agent-browser to ${{ steps.pin.outputs.tag }}'
          title: 'Pin agent-browser to ${{ steps.pin.outputs.tag }}'
          body: |
            Bumps installer/assets/agent-browser.json to https://github.com/vercel-labs/agent-browser/releases/tag/v${{ steps.pin.outputs.tag }}
            and pins its Windows and Linux binaries' sha256. The installer downloads this version for web-mcp users.

            cc @deadmade
          add-paths: installer/assets/agent-browser.json
