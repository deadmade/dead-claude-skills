name: Sync agent-browser

on:
  schedule:
    - cron: '45 7 * * 1' # Mondays 07:45 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pin the newest agent-browser release
        id: pin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/vercel-labs/agent-browser/releases/latest > "$RUNNER_TEMP/release.json"
          node --input-type=module -e '
            import { readFileSync, writeFileSync, appendFileSync } from "node:fs";
            import { agentBrowserPin } from "./installer/core.mjs";
            const file = "installer/agent-browser.json";
            const read = (f) => JSON.parse(readFileSync(f, "utf8"));
            const pin = agentBrowserPin(read(process.argv[1]), read(file));
            writeFileSync(file, JSON.stringify(pin, null, 2) + "\n");
            appendFileSync(process.env.GITHUB_OUTPUT, `tag=${pin.upstream}\n`);
          ' "$RUNNER_TEMP/release.json"

      - name: Open pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: sync/agent-browser
          delete-branch: true
          commit-message: 'Pin agent-browser to ${{ steps.pin.outputs.tag }}'
          title: 'Pin agent-browser to ${{ steps.pin.outputs.tag }}'
          body: |
            Bumps installer/agent-browser.json to https://github.com/vercel-labs/agent-browser/releases/tag/v${{ steps.pin.outputs.tag }}
            and pins its Windows and Linux binaries' sha256. The installer downloads this version for web-mcp users.

            cc @deadmade
          add-paths: installer/agent-browser.json
