name: flow-cockpit

# The flow cockpit (crates/flow-cockpit, plugins/opt-in/flow-cockpit) on the PRs that touch it: the core's tests and
# clippy on Linux and Windows, the app's Windows build, the views' jsdom tests and type checks, and on Linux the Nix
# package, whose build runs the app's tests. The views tests run only here, never in npm test or the pre-commit hook.
on:
  pull_request:
    paths:
      - 'crates/flow-cockpit/**'
      - 'plugins/opt-in/flow-cockpit/**'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/flow-cockpit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Rust toolchain
        run: rustup update stable && rustup default stable && rustup component add clippy

      # The app links the system's GTK and WebKit on Linux; this pulls GTK, libsoup and JavaScriptCore with it.
      - name: WebKitGTK
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: crates/flow-cockpit

      - name: Clippy
        working-directory: crates/flow-cockpit
        run: cargo clippy --workspace --all-targets -- -D warnings

      # CI=true makes the relative-worktree test fail, not skip, when the runner's git is older than 2.48.
      - name: Core tests
        working-directory: crates/flow-cockpit
        run: |
          git --version
          cargo test -p flow-cockpit-core

      - name: App build
        if: runner.os == 'Windows'
        working-directory: crates/flow-cockpit
        run: cargo build -p flow-cockpit

      - name: Views tests and type checks
        run: |
          npm ci
          node --test 'crates/flow-cockpit/app/shell/*.test.mjs' 'crates/flow-cockpit/app/views/builtin/*.test.ts'
          npx tsc -p crates/flow-cockpit/app/shell
          npx tsc -p crates/flow-cockpit/app/views

  # The package Linux users run (nix run .#flow-cockpit); its build runs the app's tests.
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2

      - name: Nix package
        run: |
          nix build .#flow-cockpit -L
          ./result/bin/flow-cockpit --version
