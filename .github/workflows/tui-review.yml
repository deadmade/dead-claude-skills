name: tui-review

on:
  pull_request:
    paths:
      - "plugins/tui-review/**"
      - ".github/workflows/tui-review.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: plugins/tui-review/brv
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain
        run: rustup update stable && rustup default stable && rustup component add clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugins/tui-review/brv

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test

      - name: Speed and memory budgets
        run: cargo test --release --test perf -- --ignored --nocapture 2>&1 | tee "$RUNNER_TEMP/brv-budgets.txt"

      - name: Benchmarks
        run: cargo bench --bench format --bench review -- --sample-count 50 | tee "$RUNNER_TEMP/brv-bench.txt"

      - name: Mod fixture from brv gen
        run: |
          cargo run --release -- gen --out "$RUNNER_TEMP/brv-fixture" > /dev/null
          node ../tests/make-fixture.mjs "$RUNNER_TEMP/brv-fixture"

      - name: Mod tests and speed budgets
        working-directory: plugins/tui-review
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate .
          claude plugin test .

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brv-bench-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/brv-bench.txt
            ${{ runner.temp }}/brv-budgets.txt
