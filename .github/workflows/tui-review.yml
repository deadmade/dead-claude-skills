name: tui-review

on:
  pull_request:
    paths:
      - 'crates/tui-review/**'
      - 'plugins/shared/tui-review/**'
      - '.github/workflows/tui-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: crates/tui-review
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain
        run: rustup update stable && rustup default stable && rustup component add clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: crates/tui-review

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test

      - name: Speed and memory budgets
        run: cargo test --release --test perf -- --ignored --nocapture 2>&1 | tee "$RUNNER_TEMP/tui-review-budgets.txt"

      - name: Benchmarks
        run: cargo bench --bench format --bench review -- --sample-count 50 | tee "$RUNNER_TEMP/tui-review-bench.txt"

      - name: Mod fixture from tui-review gen
        run: |
          cargo run --release -- gen --out "$RUNNER_TEMP/tui-review-fixture" > /dev/null
          node ../../plugins/shared/tui-review/tests/make-fixture.mjs "$RUNNER_TEMP/tui-review-fixture"

      - name: Mod tests and speed budgets
        working-directory: plugins/shared/tui-review
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate .
          claude plugin test .

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: tui-review-bench-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/tui-review-bench.txt
            ${{ runner.temp }}/tui-review-budgets.txt
