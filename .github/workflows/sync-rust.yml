name: Sync rust-skills

on:
  schedule:
    - cron: '15 6 * * 1' # Mondays 06:15 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sync skill from upstream
        run: node scripts/sync-rust.mjs

      - name: Sanity checks
        run: |
          jq empty .claude-plugin/marketplace.json plugins/opt-in/implementation/rust-skills/.claude-plugin/plugin.json
          grep -q '^paths:' plugins/opt-in/implementation/rust-skills/skills/rust-best-practices/SKILL.md
          echo "sha=$(cat plugins/opt-in/implementation/rust-skills/UPSTREAM)" >> "$GITHUB_OUTPUT"
        id: check

      - name: Skill scan
        run: npm run scan-skills

      # A PR opened with the workflow's token starts no other workflow; the sync App's lets test.yml run on it.
      - name: Sync App token
        id: app
        if: vars.SYNC_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}

      - name: Open pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app.outputs.token || github.token }}
          branch: sync/rust-skills
          delete-branch: true
          commit-message: 'Sync rust-skills to ${{ steps.check.outputs.sha }}'
          title: 'Sync rust-skills to ${{ steps.check.outputs.sha }}'
          body: |
            Automated sync of `skills/rust-best-practices` from https://github.com/apollographql/skills at
            https://github.com/apollographql/skills/commit/${{ steps.check.outputs.sha }}.

            cc @deadmade
          add-paths: plugins/opt-in/implementation/rust-skills
