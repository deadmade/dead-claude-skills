name: Sync rust-skills

on:
  schedule:
    - cron: '15 6 * * 1' # Mondays 06:15 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sync skill from upstream
        run: node scripts/sync-rust.mjs

      - name: Sanity checks
        run: |
          jq empty .claude-plugin/marketplace.json plugins/opt-in/rust-skills/.claude-plugin/plugin.json
          grep -q '^paths:' plugins/opt-in/rust-skills/skills/rust-best-practices/SKILL.md
          echo "sha=$(cat plugins/opt-in/rust-skills/UPSTREAM)" >> "$GITHUB_OUTPUT"
        id: check

      - name: Open pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: sync/rust-skills
          delete-branch: true
          commit-message: 'Sync rust-skills to ${{ steps.check.outputs.sha }}'
          title: 'Sync rust-skills to ${{ steps.check.outputs.sha }}'
          body: |
            Automated sync of `skills/rust-best-practices` from https://github.com/apollographql/skills at
            https://github.com/apollographql/skills/commit/${{ steps.check.outputs.sha }}.

            cc @deadmade
          add-paths: plugins/opt-in/rust-skills
