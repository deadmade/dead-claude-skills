# Repo checks, installer tests, the mods' tests and the skill scan on every PR and push to main; tui-review has its own workflow.
name: test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Claude Code, for plugin validate and plugin test
        run: npm install -g @anthropic-ai/claude-code

      - name: Repo checks and installer tests
        run: npm test

      - name: Installer typecheck
        run: |
          npm ci
          npm run typecheck

      # The installer as npx gets it: built, packed with its assets and without tests, and run through npx without a
      # terminal, which it refuses only after every module has loaded.
      - name: Installer package
        run: |
          npm pack
          tar -tzf dead-claude-skills-*.tgz > packed.txt
          grep -qx package/installer/install.js packed.txt
          grep -qx package/installer/assets/agent-browser.json packed.txt
          grep -qx package/installer/system/proc.js packed.txt
          ! grep -q '\.test\.js$' packed.txt
          set +e
          out=$(npx --yes ./dead-claude-skills-*.tgz < /dev/null 2>&1)
          code=$?
          set -e
          echo "$out"
          [ "$code" = 1 ] && grep -q 'Run this in a terminal' <<< "$out"

      - name: dead-skills mod tests
        working-directory: plugins/default
        run: claude plugin test .

      - name: md-pane mod tests
        working-directory: plugins/opt-in/md-pane
        run: claude plugin test .

  # Cisco's skill-scanner over every skill under plugins/ (policy: .github/skill-scanner.yaml); fails on high or critical.
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Skill scan
        run: npm run scan-skills
