# Repo checks, installer tests and cswap's mod tests on every PR and push to main; tui-review has its own workflow.
name: test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Claude Code, for plugin validate and plugin test
        run: npm install -g @anthropic-ai/claude-code

      - name: Repo checks and installer tests
        run: npm test

      - name: cswap mod tests
        working-directory: plugins/cswap
        run: claude plugin test .

      - name: night-city mod tests
        working-directory: plugins/night-city
        run: claude plugin test .
