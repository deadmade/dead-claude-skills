name: Release

# One release for the whole repo: scripts/release.mjs bumps package.json, the marketplace and every plugin to the
# same version and tags vX.Y.Z. Every merge to main cuts a patch here (stamped on a commit off main, so main is never
# pushed to); a release you choose is `npm run release -- minor` pushed with its tag. Either way the tag's build checks
# the repo, builds tui-review and web-mcp and publishes the release. Docs-only merges don't release.
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '*.md']
    tags: ['v*']

permissions:
  contents: read

# Merges release one at a time, so each counts from the tag before it; a queued run is replaced by a newer one, which
# carries its changes too.
concurrency:
  group: release-${{ github.ref }}

jobs:
  # The tag to release: the pushed one, or a patch cut from the merge. A merge that is itself a release commit
  # (`npm run release` pushed with --follow-tags) is left to its tag's run.
  version:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag || steps.push.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Tag
        id: tag
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          elif [ -n "$(git tag --points-at HEAD --list 'v*')" ]; then
            echo "HEAD is already tagged; its tag's run releases it."
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898283+github-actions[bot]@users.noreply.github.com'
            npm run release -- patch --detach
            echo "cut=v$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"
          fi

      # Only admins and the release App may create a v* tag (.github/rulesets/release-tags.json). Its key lives in the
      # release environment, which only main and v* tags may use, and only jobs that install no packages read it.
      - name: Release App token
        id: app
        if: steps.tag.outputs.cut && vars.RELEASE_APP_CLIENT_ID
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      # A tag pushed with the release App's token starts its own run, which releases it. Without the App it goes out with the
      # workflow's token, which starts no run, so this one releases it.
      - name: Push the tag
        id: push
        if: steps.tag.outputs.cut
        env:
          TAG: ${{ steps.tag.outputs.cut }}
          TOKEN: ${{ steps.app.outputs.token || github.token }}
          OWN_RUN: ${{ steps.app.outputs.token == '' }}
        run: |
          git push "https://x-access-token:$TOKEN@github.com/$GITHUB_REPOSITORY" "$TAG"
          if [ "$OWN_RUN" = true ]; then echo "tag=$TAG" >> "$GITHUB_OUTPUT"; fi

  check:
    needs: version
    if: needs.version.outputs.tag
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - name: Tag matches package.json
        run: test "$TAG" = "v$(jq -r .version package.json)"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Repo checks and tests
        run: npm test

  tui-review:
    needs: version
    if: needs.version.outputs.tag
    uses: ./.github/workflows/build-tui-review.yml
    with:
      ref: ${{ needs.version.outputs.tag }}

  web-mcp:
    needs: version
    if: needs.version.outputs.tag
    uses: ./.github/workflows/build-web-mcp.yml
    with:
      ref: ${{ needs.version.outputs.tag }}

  publish:
    needs: [version, check, tui-review, web-mcp]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      # Every artifact of this run: the tui-review and web-mcp archives, each with its .sha256.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      # The installer as npx runs it: prepack compiles installer/**/*.ts to JS, package.json's files picks what ships.
      - name: Pack the installer
        run: |
          npm ci
          npm pack --pack-destination dist
          mv dist/dead-claude-skills-*.tgz dist/installer.tgz

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/* --title "$TAG" --generate-notes \
            --notes "Install or update with \`npx --allow-remote=root https://github.com/deadmade/dead-claude-skills/releases/download/$TAG/installer.tgz\`, which points the marketplace at the release branch (Claude Code then updates the plugins on its own) and installs this release's binaries, or with \`/plugin update\` if you added the marketplace by hand.

          installer.tgz: the installer, built to JS.

          tui-review-*: the binary behind tui-review, for each platform; the installer downloads yours.
          web-mcp-*: the binary behind the web-mcp plugin, for Windows and Linux x64; the installer downloads yours."

  release-branch:
    needs: [version, publish]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      # The branch the installer points the marketplace at (RELEASE_BRANCH in installer/core/release.ts): Claude Code's
      # marketplace auto-update follows it, so plugins update without rerunning the installer. Moved once the release
      # exists, and never back to an older one (a re-run of an old tag's run). Only admins and the release App may move it
      # (.github/rulesets/release-branch.json); a job of its own, so its key never shares a runner with npm ci.
      - name: Release App token
        id: app
        if: vars.RELEASE_APP_CLIENT_ID
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write

      - name: Move the release branch
        env:
          TOKEN: ${{ steps.app.outputs.token || github.token }}
        run: |
          if git fetch --depth=1 origin release 2>/dev/null; then
            have=$(git show FETCH_HEAD:package.json | jq -r .version)
            newest=$(printf '%s\n' "$have" "${TAG#v}" | sort -V | tail -n1)
            if [ "$newest" != "${TAG#v}" ]; then
              echo "release is at v$have, past $TAG"
              exit 0
            fi
          fi
          git push --force "https://x-access-token:$TOKEN@github.com/$GITHUB_REPOSITORY" HEAD:refs/heads/release
