name: Release

# One release for the whole repo: scripts/release.mjs bumps package.json, the marketplace and every plugin to the
# same version and tags vX.Y.Z; pushing that tag checks the repo, builds tui-review and web-mcp and
# publishes the release.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag matches package.json
        run: test "$GITHUB_REF_NAME" = "v$(jq -r .version package.json)"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Repo checks and tests
        run: npm test

  tui-review:
    uses: ./.github/workflows/build-tui-review.yml

  web-mcp:
    uses: ./.github/workflows/build-web-mcp.yml

  publish:
    needs: [check, tui-review, web-mcp]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Every artifact of this run: the tui-review and web-mcp archives, each with its .sha256.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      # The installer as npx runs it: prepack compiles installer/**/*.ts to JS, package.json's files picks what ships.
      - name: Pack the installer
        run: |
          npm ci
          npm pack --pack-destination dist
          mv dist/dead-claude-skills-*.tgz dist/installer.tgz

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes \
            --notes "Install or update with \`npx --allow-remote=root https://github.com/deadmade/dead-claude-skills/releases/download/$GITHUB_REF_NAME/installer.tgz\`, which pins the marketplace to this release, or with \`/plugin update\` if you added the marketplace by hand.

          installer.tgz: the installer, built to JS.

          tui-review-*: the binary behind tui-review, for each platform; the installer downloads yours.
          web-mcp-*: the binary behind the web-mcp plugin, for Windows and Linux x64; the installer downloads yours."
