name: Sync cswap

on:
  schedule:
    - cron: "15 7 * * 1" # Mondays 07:15 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Pin the newest stable claude-swap tag
        id: pin
        run: |
          tag=$(git ls-remote --tags --refs https://github.com/realiti4/claude-swap.git 'v*' \
            | sed 's#.*refs/tags/##' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          test -n "$tag"
          jq --arg t "$tag" '.upstream = $t' installer/cswap.json > cswap.json.tmp && mv cswap.json.tmp installer/cswap.json
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: sync/cswap
          delete-branch: true
          commit-message: "Pin cswap to claude-swap ${{ steps.pin.outputs.tag }}"
          title: "Pin cswap to claude-swap ${{ steps.pin.outputs.tag }}"
          body: |
            Bumps installer/cswap.json to https://github.com/realiti4/claude-swap/releases/tag/${{ steps.pin.outputs.tag }}.
            Merging it runs build-cswap.yml, which publishes the cswap-${{ steps.pin.outputs.tag }} release the installer downloads.

            cc @deadmade
          add-paths: installer/cswap.json
