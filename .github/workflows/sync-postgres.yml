name: Sync postgres

on:
  schedule:
    - cron: '0 8 * * 1' # Mondays 08:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Sync skills from upstream
        run: node scripts/sync-postgres.mjs

      - name: Sanity checks
        id: check
        run: |
          d=plugins/database/postgres
          jq empty .claude-plugin/marketplace.json $d/.claude-plugin/plugin.json
          test -s $d/skills/postgres-best-practices/SKILL.md
          test -s $d/skills/postgres-database-migration/SKILL.md
          echo "neon=$(cat $d/skills/postgres-best-practices/UPSTREAM)" >> "$GITHUB_OUTPUT"
          echo "pgai=$(cat $d/skills/postgres-database-migration/UPSTREAM)" >> "$GITHUB_OUTPUT"
          echo "neon7=$(cut -c1-7 $d/skills/postgres-best-practices/UPSTREAM)" >> "$GITHUB_OUTPUT"
          echo "pgai7=$(cut -c1-7 $d/skills/postgres-database-migration/UPSTREAM)" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: sync/postgres
          delete-branch: true
          commit-message: 'Sync postgres to neon ${{ steps.check.outputs.neon7 }}, pg-aiguide ${{ steps.check.outputs.pgai7 }}'
          title: 'Sync postgres to neon ${{ steps.check.outputs.neon7 }}, pg-aiguide ${{ steps.check.outputs.pgai7 }}'
          body: |
            Automated sync of the postgres plugin's vendored skills:

            - `skills/postgres-best-practices` from https://github.com/neondatabase/postgres-skills at
              https://github.com/neondatabase/postgres-skills/commit/${{ steps.check.outputs.neon }}
            - `skills/postgres-database-migration` from https://github.com/timescale/pg-aiguide at
              https://github.com/timescale/pg-aiguide/commit/${{ steps.check.outputs.pgai }}

            cc @deadmade
          add-paths: plugins/database/postgres
