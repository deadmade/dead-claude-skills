name: Sync hallmark

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync skill from upstream
        run: node scripts/sync-hallmark.mjs

      - name: Sanity checks
        run: |
          jq empty .claude-plugin/marketplace.json plugins/hallmark/.claude-plugin/plugin.json
          head -n 10 plugins/hallmark/skills/hallmark/SKILL.md | grep -q '^description: "WEB FRONTEND ONLY:'
          echo "sha=$(cat plugins/hallmark/skills/hallmark/UPSTREAM)" >> "$GITHUB_OUTPUT"
        id: check

      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: sync/hallmark
          delete-branch: true
          commit-message: "Sync hallmark to ${{ steps.check.outputs.sha }}"
          title: "Sync hallmark to ${{ steps.check.outputs.sha }}"
          body: |
            Automated sync of `skills/hallmark` from https://github.com/nutlope/hallmark at
            https://github.com/nutlope/hallmark/commit/${{ steps.check.outputs.sha }}.

            The web-frontend-only description prefix was re-applied by `scripts/sync-hallmark.mjs`.
            Review the diff before merging: merged changes reach every machine with this marketplace.

            cc @deadmade
          add-paths: plugins/hallmark/skills/hallmark
