name: Sync hallmark

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sync skill from upstream
        run: node scripts/sync-hallmark.mjs

      - name: Sanity checks
        run: |
          jq empty .claude-plugin/marketplace.json plugins/opt-in/hallmark/.claude-plugin/plugin.json
          head -n 10 plugins/opt-in/hallmark/skills/hallmark/SKILL.md | grep -q '^description: "WEB FRONTEND ONLY:'
          echo "sha=$(cat plugins/opt-in/hallmark/skills/hallmark/UPSTREAM)" >> "$GITHUB_OUTPUT"
        id: check

      - name: Skill scan
        run: npm run scan-skills

      # A PR opened with the workflow's token starts no other workflow; the sync App's lets test.yml run on it.
      - name: App token
        id: app
        if: vars.SYNC_APP_CLIENT_ID
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app.outputs.token || github.token }}
          branch: sync/hallmark
          delete-branch: true
          commit-message: 'Sync hallmark to ${{ steps.check.outputs.sha }}'
          title: 'Sync hallmark to ${{ steps.check.outputs.sha }}'
          body: |
            Automated sync of `skills/hallmark` from https://github.com/nutlope/hallmark at
            https://github.com/nutlope/hallmark/commit/${{ steps.check.outputs.sha }}.

            cc @deadmade
          add-paths: plugins/opt-in/hallmark/skills/hallmark
