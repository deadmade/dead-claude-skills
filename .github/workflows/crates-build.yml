name: Build crates

# The tui-review plugin's binary and web-mcp's server, for Windows and Linux x64 (no macOS or ARM builds): archives plus
# their checksums. release.yml calls this and attaches them to the vX.Y.Z release the installer downloads from
# (BIN_TARGETS in installer/core/binaries.ts). A PR that changes this file, or a run by hand, builds only.
on:
  pull_request:
    paths: ['.github/workflows/crates-build.yml']
  workflow_dispatch:
  workflow_call:
    inputs:
      # The release tag to build: each binary reports its crate's version, which the installer checks against its own.
      ref:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        crate: [tui-review, web-mcp]
        platform:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, archive: zip }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, archive: tar.gz }
    runs-on: ${{ matrix.platform.os }}
    env:
      CRATE: ${{ matrix.crate }}
      TARGET: ${{ matrix.platform.target }}
    defaults:
      run:
        shell: bash
        working-directory: crates/${{ matrix.crate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Rust toolchain
        run: rustup update stable && rustup default stable && rustup target add "$TARGET"

      - name: musl C toolchain
        if: contains(matrix.platform.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: crates/${{ matrix.crate }}
          key: ${{ matrix.platform.target }}

      - name: Build
        run: cargo build --release --locked --target "$TARGET"

      - name: Smoke test
        run: '"target/$TARGET/release/$CRATE" --version'

      - name: Package
        run: |
          name=$CRATE-$TARGET
          mkdir -p "$RUNNER_TEMP/dist"
          if [ "${{ matrix.platform.archive }}" = zip ]; then
            7z a -tzip "$RUNNER_TEMP/dist/$name.zip" "./target/$TARGET/release/$CRATE.exe" > /dev/null
          else
            tar -czf "$RUNNER_TEMP/dist/$name.tar.gz" -C "target/$TARGET/release" "$CRATE"
          fi
          cd "$RUNNER_TEMP/dist"
          for f in "$name".*; do sha256sum "$f" > "$f.sha256"; done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.crate }}-${{ matrix.platform.target }}
          path: ${{ runner.temp }}/dist/*
