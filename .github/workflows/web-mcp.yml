name: web-mcp

on:
  pull_request:
    paths:
      - 'crates/web-mcp/**'
      - 'plugins/shared/web-mcp/**'
      - '.github/workflows/web-mcp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: crates/web-mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain
        run: rustup update stable && rustup default stable && rustup component add clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: crates/web-mcp

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test
