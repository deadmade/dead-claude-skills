name: Sync mattpocock-picks

on:
  schedule:
    - cron: "15 6 * * 1" # Mondays 06:15 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      NEW_SKILLS_FILE: /tmp/mattpocock-new-skills.tsv
    steps:
      - uses: actions/checkout@v4

      - name: Sync skills from upstream
        run: node scripts/sync-mattpocock.mjs

      - name: Open issues for new upstream skills
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -s "$NEW_SKILLS_FILE" ]; then echo "No new upstream skills."; exit 0; fi
          while IFS=$'\t' read -r skill desc; do
            name="${skill##*/}"
            title="New upstream skill in mattpocock/skills: $name"
            if gh issue list --state all --limit 100 --search "$name in:title" --json title --jq '.[].title' \
              | grep -Fxq -- "$title"; then
              echo "Already flagged: $name"; continue
            fi
            body="$(printf '%s\n' \
              "mattpocock/skills now publishes \`$skill\`, which is neither vendored nor skipped." \
              "" \
              "> ${desc:-no description}" \
              "" \
              "Source: https://github.com/mattpocock/skills/tree/main/skills/$skill" \
              "" \
              "Decide in \`scripts/sync-mattpocock.mjs\`:" \
              "- **Include:** add \`$skill\` to \`SKILLS\`, bump the skill count check in \`.github/workflows/sync-mattpocock.yml\`, run the script." \
              "- **Skip:** add \`$skill\` to \`SKIPPED\`." \
              "" \
              "Check for overlap with superpowers before including it.")"
            gh issue create --title "$title" --body "$body"
          done < "$NEW_SKILLS_FILE"

      - name: Sanity checks
        id: check
        run: |
          jq empty .claude-plugin/marketplace.json plugins/mattpocock-picks/.claude-plugin/plugin.json
          test "$(find plugins/mattpocock-picks/skills -mindepth 2 -maxdepth 2 -name SKILL.md | wc -l)" -eq 14
          echo "sha=$(cat plugins/mattpocock-picks/UPSTREAM)" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: sync/mattpocock-picks
          delete-branch: true
          commit-message: "Sync mattpocock-picks to ${{ steps.check.outputs.sha }}"
          title: "Sync mattpocock-picks to ${{ steps.check.outputs.sha }}"
          body: |
            Automated sync of the curated skills from https://github.com/mattpocock/skills at
            https://github.com/mattpocock/skills/commit/${{ steps.check.outputs.sha }}.

            Review the diff before merging: merged changes reach every machine with mattpocock-picks installed.
          add-paths: plugins/mattpocock-picks
