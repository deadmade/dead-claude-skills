name: brv release

# A `brv-v<version>` tag builds brv for each platform and publishes a GitHub release with the archives and their
# checksums, which the installer downloads. A change to this file, or a run by hand, builds without publishing.
on:
  push:
    tags: ["brv-v*"]
    # Branch pushes build only when this file changed; tag pushes ignore path filters.
    branches: ["**"]
    paths: [".github/workflows/brv-release.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, archive: zip }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, archive: tar.gz }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, archive: tar.gz }
          - { os: macos-latest, target: aarch64-apple-darwin, archive: tar.gz }
          - { os: macos-latest, target: x86_64-apple-darwin, archive: tar.gz }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: plugins/tui-review/brv
    steps:
      - uses: actions/checkout@v7

      - name: The tag matches the crate's version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "${GITHUB_REF_NAME}" = "brv-v${version}" || { echo "tag ${GITHUB_REF_NAME} but Cargo.toml says ${version}"; exit 1; }

      - name: Rust toolchain
        run: rustup update stable && rustup default stable && rustup target add ${{ matrix.target }}

      - name: musl C toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugins/tui-review/brv
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Smoke test
        if: matrix.target != 'x86_64-apple-darwin'
        run: target/${{ matrix.target }}/release/brv --version

      - name: Package
        run: |
          name=brv-${{ matrix.target }}
          mkdir -p "$RUNNER_TEMP/dist"
          if [ "${{ matrix.archive }}" = zip ]; then
            7z a -tzip "$RUNNER_TEMP/dist/$name.zip" "./target/${{ matrix.target }}/release/brv.exe" > /dev/null
          else
            tar -czf "$RUNNER_TEMP/dist/$name.tar.gz" -C "target/${{ matrix.target }}/release" brv
          fi
          cd "$RUNNER_TEMP/dist"
          for f in "$name".*; do
            if command -v sha256sum > /dev/null; then sha256sum "$f"; else shasum -a 256 "$f"; fi > "$f.sha256"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: brv-${{ matrix.target }}
          path: ${{ runner.temp }}/dist/*

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "brv ${GITHUB_REF_NAME#brv-v}" \
            --notes "brv, the binary behind the tui-review plugin. The installer downloads the archive for your platform; or unpack it yourself and set its path with /plugin configure tui-review."
