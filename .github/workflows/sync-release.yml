name: Sync vendored releases

on:
  schedule:
    - cron: '15 6 * * 1' # Mondays 06:15 UTC
  workflow_dispatch:

# The sync App pushes the branch and opens the PR, so the workflow's own token only reads.
permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: [ponytail, superpowers]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sync the newest stable release
        id: sync
        run: node scripts/sync-release.mjs ${{ matrix.plugin }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY_FILE: /tmp/${{ matrix.plugin }}-pr-body.md

      - name: Claude Code, for plugin validate
        run: npm install -g @anthropic-ai/claude-code

      - name: Repo checks
        run: node scripts/check-repo.mjs

      - name: Skill scan
        run: npm run scan-skills

      # A PR opened with the workflow's token starts no other workflow; the sync App's lets test.yml run on it.
      - name: App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app.outputs.token }}
          branch: sync/${{ matrix.plugin }}
          delete-branch: true
          commit-message: 'Sync ${{ matrix.plugin }} to ${{ steps.sync.outputs.tag }}'
          title: 'Sync ${{ matrix.plugin }} to ${{ steps.sync.outputs.tag }}'
          body-path: /tmp/${{ matrix.plugin }}-pr-body.md
          add-paths: plugins/flows/packs/${{ matrix.plugin }}
