name: Sync secret-scan

on:
  schedule:
    - cron: '15 8 * * 1' # Mondays 08:15 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sync scanners from upstream
        run: node scripts/sync-secret-scan.mjs

      - name: Sanity checks
        run: |
          jq empty plugins/secret-scan/.claude-plugin/plugin.json plugins/secret-scan/patterns/secrets.json
          for f in plugins/secret-scan/scripts/*.sh; do bash -n "$f"; done
          echo "sha=$(cat plugins/secret-scan/UPSTREAM)" >> "$GITHUB_OUTPUT"
        id: check

      - name: Open pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: sync/secret-scan
          delete-branch: true
          commit-message: 'Sync secret-scan to ${{ steps.check.outputs.sha }}'
          title: 'Sync secret-scan to ${{ steps.check.outputs.sha }}'
          body: |
            Automated sync of the lite secret scanners and patterns from https://github.com/dwarvesf/claude-guardrails at
            https://github.com/dwarvesf/claude-guardrails/commit/${{ steps.check.outputs.sha }}.

            cc @deadmade
          add-paths: plugins/secret-scan
