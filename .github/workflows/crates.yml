name: crates

# Clippy and tests for each Rust crate a PR touches (its crate or its plugin), on Linux and Windows. tui-review also
# runs its speed and memory budgets, benchmarks and mod tests. A run by hand, or a change to this file, tests both.
on:
  pull_request:
    paths:
      - 'crates/tui-review/**'
      - 'plugins/shared/tui-review/**'
      - 'crates/web-mcp/**'
      - 'plugins/shared/web-mcp/**'
      - '.github/workflows/crates.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      crates: ${{ steps.changes.outputs.crates }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      # A PR's checkout is its merge commit, whose first parent is the base.
      - name: Crates touched
        id: changes
        run: |
          all='["tui-review","web-mcp"]'
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "crates=$all" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only HEAD^1 HEAD)
          if printf '%s\n' "$files" | grep -qx '.github/workflows/crates.yml'; then
            echo "crates=$all" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          crates=$(for c in tui-review web-mcp; do
            if printf '%s\n' "$files" | grep -qE "^(crates|plugins/shared)/$c/"; then echo "$c"; fi
          done | jq -Rnc '[inputs]')
          echo "crates=$crates" >> "$GITHUB_OUTPUT"

  test:
    needs: changes
    if: needs.changes.outputs.crates != '[]'
    strategy:
      fail-fast: false
      matrix:
        crate: ${{ fromJSON(needs.changes.outputs.crates) }}
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: crates/${{ matrix.crate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain
        run: rustup update stable && rustup default stable && rustup component add clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: crates/${{ matrix.crate }}

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test

      - name: Speed and memory budgets
        if: matrix.crate == 'tui-review'
        run: cargo test --release --test perf -- --ignored --nocapture 2>&1 | tee "$RUNNER_TEMP/tui-review-budgets.txt"

      - name: Benchmarks
        if: matrix.crate == 'tui-review'
        run: cargo bench --bench format --bench review -- --sample-count 50 | tee "$RUNNER_TEMP/tui-review-bench.txt"

      - name: Mod fixture from tui-review gen
        if: matrix.crate == 'tui-review'
        run: |
          cargo run --release -- gen --out "$RUNNER_TEMP/tui-review-fixture" > /dev/null
          node ../../plugins/shared/tui-review/tests/make-fixture.mjs "$RUNNER_TEMP/tui-review-fixture"

      - name: Mod tests and speed budgets
        if: matrix.crate == 'tui-review'
        working-directory: plugins/shared/tui-review
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate .
          claude plugin test .

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && matrix.crate == 'tui-review'
        with:
          name: tui-review-bench-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/tui-review-bench.txt
            ${{ runner.temp }}/tui-review-budgets.txt
