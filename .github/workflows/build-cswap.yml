name: Build cswap

# cswap.exe: claude-swap (https://github.com/realiti4/claude-swap) at the tag pinned in installer/cswap.json,
# compiled with Nuitka into one Windows exe. PRs that touch the pin build and smoke-test it; release.yml calls
# this workflow and attaches the exe to the vX.Y.Z release the installer downloads from.
on:
  pull_request:
    paths: [installer/cswap.json, .github/workflows/build-cswap.yml]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Read pin
        id: pin
        run: echo "tag=$(jq -r .upstream installer/cswap.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: realiti4/claude-swap
          ref: ${{ steps.pin.outputs.tag }}
          path: upstream

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Nuitka's C compiler cache, bytecode cache and tool downloads all live under NUITKA_CACHE_DIR. A run can only
      # restore caches from its own ref or master, so PRs and release tags reuse what a run on master saved.
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/nuitka-cache
          key: nuitka-4.3-py3.12-${{ steps.pin.outputs.tag }}
          restore-keys: nuitka-4.3-py3.12-

      - name: Install claude-swap and Nuitka
        run: pip install ./upstream nuitka==4.3 zstandard

      - name: Compile
        env:
          NUITKA_CACHE_DIR: ${{ runner.temp }}/nuitka-cache
        run: |
          printf 'from claude_swap.cli import main\nraise SystemExit(main())\n' > entry.py
          python -m nuitka --onefile --lto=no --assume-yes-for-downloads --output-filename=cswap.exe \
            --include-package=claude_swap --include-package-data=claude_swap --include-package-data=textual \
            --include-distribution-metadata=claude-swap entry.py

      - name: Smoke test
        run: |
          home="$RUNNER_TEMP/cswap-home"
          mkdir -p "$home"
          export USERPROFILE="$home" HOME="$home" APPDATA="$home/AppData/Roaming" LOCALAPPDATA="$home/AppData/Local"
          tag='${{ steps.pin.outputs.tag }}'
          test "$(./cswap.exe --version | tr -d '\r')" = "cswap ${tag#v}"
          ./cswap.exe help > /dev/null
          ./cswap.exe list --json | python -c "import json, sys; assert json.load(sys.stdin)['accounts'] == []"
          sha256sum cswap.exe > cswap.exe.sha256
          cat cswap.exe.sha256

      - uses: actions/upload-artifact@v5
        with:
          name: cswap-${{ steps.pin.outputs.tag }}
          path: |
            cswap.exe
            cswap.exe.sha256

