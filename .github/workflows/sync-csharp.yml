name: Sync csharp-skills

on:
  schedule:
    - cron: '30 6 * * 1' # Mondays 06:30 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sync skills from upstream
        run: node scripts/sync-csharp.mjs
        env:
          SYNC_REPORT: /tmp/csharp-sync-report.txt

      - name: Sanity checks
        run: |
          jq empty .claude-plugin/marketplace.json plugins/opt-in/implementation/csharp-skills/.claude-plugin/plugin.json
          test "$(ls plugins/opt-in/implementation/csharp-skills/skills | wc -l)" -eq 6
          test "$(find plugins/opt-in/implementation/csharp-skills/library -mindepth 2 -maxdepth 2 -name SKILL.md | wc -l)" -ge 90
          echo "sha=$(cat plugins/opt-in/implementation/csharp-skills/UPSTREAM)" >> "$GITHUB_OUTPUT"
        id: check

      - name: Write pull request body
        env:
          SHA: ${{ steps.check.outputs.sha }}
        run: |
          {
            echo "Automated sync of https://github.com/dotnet/skills at https://github.com/dotnet/skills/commit/$SHA."
            echo
            echo 'Sync report (added/removed skills, plugin parts not vendored, unmapped plugins, mentions of skipped agents):'
            echo
            echo '```text'
            cat /tmp/csharp-sync-report.txt 2>/dev/null || true
            echo '```'
            echo
            echo 'cc @deadmade'
          } > /tmp/csharp-pr-body.md

      - name: Skill scan
        run: npm run scan-skills

      - name: Open pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: sync/csharp-skills
          delete-branch: true
          commit-message: 'Sync csharp-skills to ${{ steps.check.outputs.sha }}'
          title: 'Sync csharp-skills to ${{ steps.check.outputs.sha }}'
          body-path: /tmp/csharp-pr-body.md
          add-paths: plugins/opt-in/implementation/csharp-skills
