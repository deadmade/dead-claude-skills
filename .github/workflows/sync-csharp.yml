name: Sync csharp-skills

on:
  schedule:
    - cron: '30 6 * * 1' # Mondays 06:30 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Sync skills from upstream
        run: node scripts/sync-csharp.mjs
        env:
          SYNC_REPORT: /tmp/csharp-sync-report.txt

      - name: Sanity checks
        run: |
          jq empty .claude-plugin/marketplace.json plugins/languages/csharp-skills/.claude-plugin/plugin.json
          test "$(ls plugins/languages/csharp-skills/skills | wc -l)" -eq 6
          test "$(find plugins/languages/csharp-skills/library -mindepth 2 -maxdepth 2 -name SKILL.md | wc -l)" -ge 90
          echo "sha=$(cat plugins/languages/csharp-skills/UPSTREAM)" >> "$GITHUB_OUTPUT"
        id: check

      - name: Write pull request body
        env:
          SHA: ${{ steps.check.outputs.sha }}
        run: |
          {
            echo "Automated sync of https://github.com/dotnet/skills at https://github.com/dotnet/skills/commit/$SHA."
            echo
            echo 'Sync report (added/removed skills, plugin parts not vendored, unmapped plugins, mentions of skipped agents):'
            echo
            echo '```text'
            cat /tmp/csharp-sync-report.txt 2>/dev/null || true
            echo '```'
            echo
            echo 'cc @deadmade'
          } > /tmp/csharp-pr-body.md

      - name: Open pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: sync/csharp-skills
          delete-branch: true
          commit-message: 'Sync csharp-skills to ${{ steps.check.outputs.sha }}'
          title: 'Sync csharp-skills to ${{ steps.check.outputs.sha }}'
          body-path: /tmp/csharp-pr-body.md
          add-paths: plugins/languages/csharp-skills
