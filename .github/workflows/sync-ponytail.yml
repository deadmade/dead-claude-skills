name: Sync ponytail

on:
  schedule:
    - cron: '15 6 * * 1' # Mondays 06:15 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sync the newest stable release
        id: sync
        run: node scripts/sync-ponytail.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY_FILE: /tmp/ponytail-pr-body.md

      # A PR opened with the workflow's token starts no other workflow, so test.yml never sees it: check here.
      - name: Claude Code, for plugin validate
        run: npm install -g @anthropic-ai/claude-code

      - name: Repo checks
        run: node scripts/check-repo.mjs

      - name: Open pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: sync/ponytail
          delete-branch: true
          commit-message: 'Sync ponytail to ${{ steps.sync.outputs.tag }}'
          title: 'Sync ponytail to ${{ steps.sync.outputs.tag }}'
          body-path: /tmp/ponytail-pr-body.md
          add-paths: plugins/shared/ponytail
