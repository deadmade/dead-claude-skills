name: Sync security-audit

on:
  schedule:
    - cron: '0 7 * * 1' # Mondays 07:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sync skill from upstream
        run: node scripts/sync-security-audit.mjs

      - name: Sanity checks
        run: |
          jq empty .claude-plugin/marketplace.json plugins/flows/packs/security-audit/.claude-plugin/plugin.json
          test -s plugins/flows/packs/security-audit/skills/security-audit/SKILL.md
          echo "sha=$(cat plugins/flows/packs/security-audit/UPSTREAM)" >> "$GITHUB_OUTPUT"
        id: check

      # Checked here too: without the repo's App, test.yml never runs on the PR.
      - name: Repo checks
        run: node scripts/check-repo.mjs

      - name: Skill scan
        run: npm run scan-skills

      # A PR opened with the workflow's token starts no other workflow; the repo's App's lets test.yml run on it.
      - name: App token
        id: app
        if: vars.BOT_APP_CLIENT_ID
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app.outputs.token || github.token }}
          branch: sync/security-audit
          delete-branch: true
          commit-message: 'Sync security-audit to ${{ steps.check.outputs.sha }}'
          title: 'Sync security-audit to ${{ steps.check.outputs.sha }}'
          body: |
            Automated sync of the security-audit skill from https://github.com/cloudflare/security-audit-skill at
            https://github.com/cloudflare/security-audit-skill/commit/${{ steps.check.outputs.sha }}.

            cc @deadmade
          add-paths: plugins/flows/packs/security-audit
