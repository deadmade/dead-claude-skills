name: Sync self-review

on:
  schedule:
    - cron: "30 7 * * 1" # Mondays 07:30 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Sync review passes from upstream
        run: node scripts/sync-self-review.mjs

      - name: Sanity checks
        id: check
        run: |
          jq empty .claude-plugin/marketplace.json plugins/self-review/.claude-plugin/plugin.json
          test "$(find plugins/self-review/agents -maxdepth 1 -name '*.md' | wc -l)" -eq 5
          test -f plugins/self-review/skills/self-review/references/upstream/code-review.md
          test -f plugins/self-review/skills/self-review/references/upstream/spec-standards-review.md
          echo "official=$(awk '$1 == "anthropics/claude-plugins-official" {print $2}' plugins/self-review/UPSTREAM)" >> "$GITHUB_OUTPUT"
          echo "matt=$(awk '$1 == "mattpocock/skills" {print $2}' plugins/self-review/UPSTREAM)" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: sync/self-review
          delete-branch: true
          commit-message: "Sync self-review to claude-plugins-official ${{ steps.check.outputs.official }} and mattpocock/skills ${{ steps.check.outputs.matt }}"
          title: "Sync self-review upstreams"
          body: |
            Automated sync of the review passes vendored in plugins/self-review:
            - https://github.com/anthropics/claude-plugins-official/commit/${{ steps.check.outputs.official }}
              (code-review command, pr-review-toolkit agents)
            - https://github.com/mattpocock/skills/commit/${{ steps.check.outputs.matt }} (engineering/code-review)

            cc @deadmade
          add-paths: plugins/self-review
