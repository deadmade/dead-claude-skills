name: Sync self-review

on:
  schedule:
    - cron: '30 7 * * 1' # Mondays 07:30 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sync review passes from upstream
        run: node scripts/sync-self-review.mjs

      - name: Sanity checks
        id: check
        run: |
          jq empty .claude-plugin/marketplace.json plugins/flows/.claude-plugin/plugin.json
          test "$(grep -l 'by scripts/sync-self-review.mjs.' plugins/flows/agents/*.md | wc -l)" -eq 5
          test -f plugins/flows/skills/self-review/references/upstream/code-review.md
          test -f plugins/flows/skills/self-review/references/upstream/spec-standards-review.md
          echo "official=$(awk '$1 == "anthropics/claude-plugins-official" {print $2}' plugins/flows/skills/self-review/UPSTREAM)" >> "$GITHUB_OUTPUT"
          echo "matt=$(awk '$1 == "mattpocock/skills" {print $2}' plugins/flows/skills/self-review/UPSTREAM)" >> "$GITHUB_OUTPUT"

      - name: Skill scan
        run: npm run scan-skills

      # A PR opened with the workflow's token starts no other workflow; the sync App's lets test.yml run on it.
      - name: App token
        id: app
        if: vars.SYNC_APP_CLIENT_ID
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app.outputs.token || github.token }}
          branch: sync/self-review
          delete-branch: true
          commit-message: 'Sync self-review to claude-plugins-official ${{ steps.check.outputs.official }} and mattpocock/skills ${{ steps.check.outputs.matt }}'
          title: 'Sync self-review upstreams'
          body: |
            Automated sync of the review passes /self-review runs, vendored in plugins/flows:
            - https://github.com/anthropics/claude-plugins-official/commit/${{ steps.check.outputs.official }}
              (code-review command, pr-review-toolkit agents)
            - https://github.com/mattpocock/skills/commit/${{ steps.check.outputs.matt }} (engineering/code-review)

            cc @deadmade
          add-paths: |
            plugins/flows/skills/self-review
            plugins/flows/agents
