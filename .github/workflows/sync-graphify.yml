name: Sync graphify

on:
  schedule:
    - cron: '45 6 * * 1' # Mondays 06:45 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sync skill from upstream
        run: node scripts/sync-graphify.mjs

      - name: Sanity checks
        id: check
        run: |
          jq empty .claude-plugin/marketplace.json plugins/shared/graphify/.claude-plugin/plugin.json plugins/shared/graphify/hooks/hooks.json
          test -f plugins/shared/graphify/skills/graphify/SKILL.md
          test "$(find plugins/shared/graphify/skills/graphify/references -maxdepth 1 -name '*.md' | wc -l)" -eq 8
          echo "sha=$(cat plugins/shared/graphify/UPSTREAM)" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: sync/graphify
          delete-branch: true
          commit-message: 'Sync graphify to ${{ steps.check.outputs.sha }}'
          title: 'Sync graphify to ${{ steps.check.outputs.sha }}'
          body: |
            Automated sync of the graphify Claude Code skill from https://github.com/Graphify-Labs/graphify at
            https://github.com/Graphify-Labs/graphify/commit/${{ steps.check.outputs.sha }}.

            cc @deadmade
          add-paths: plugins/shared/graphify
