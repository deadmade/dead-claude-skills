name: Sync pinned plugins

on:
  schedule:
    - cron: '0 7 * * 1' # Mondays 07:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin:
          - { name: superpowers, repo: obra/superpowers }
          - { name: ponytail, repo: DietrichGebert/ponytail }
    steps:
      - uses: actions/checkout@v7

      - name: Pin the newest stable tag
        id: pin
        run: node scripts/sync-plugins.mjs ${{ matrix.plugin.name }} ${{ matrix.plugin.repo }}

      - name: Open pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: sync/${{ matrix.plugin.name }}
          delete-branch: true
          commit-message: 'Pin ${{ matrix.plugin.name }} to ${{ steps.pin.outputs.tag }}'
          title: 'Pin ${{ matrix.plugin.name }} to ${{ steps.pin.outputs.tag }}'
          body: |
            Bumps the ${{ matrix.plugin.name }} pin in .claude-plugin/marketplace.json to
            https://github.com/${{ matrix.plugin.repo }}/releases/tag/${{ steps.pin.outputs.tag }}
            (commit ${{ steps.pin.outputs.sha }}).

            What changed: https://github.com/${{ matrix.plugin.repo }}/compare/${{ steps.pin.outputs.old }}...${{ steps.pin.outputs.tag }}

            Ships with the next release (`npm run release -- patch`). To decline this bump, leave the PR open:
            closing it brings it back next Monday.

            cc @deadmade
          add-paths: .claude-plugin/marketplace.json
