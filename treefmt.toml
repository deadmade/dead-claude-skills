# Run with `nix fmt`; the pre-commit hook checks staged files with it.
on-unmatched = "debug"
# Vendored upstream files and the generated hook config: reformatting them would churn every sync.
excludes = [
  "plugins/opt-in/hallmark/**",
  "plugins/flows/packs/**",
  "plugins/flows/agents/**",
  "plugins/shared/graphify/**",
  "plugins/opt-in/implementation/*-skills/library/**",
  "plugins/opt-in/implementation/*-skills/skills/**",
  "plugins/opt-in/implementation/*-skills/LICENSE",
  "plugins/opt-in/implementation/*-skills/UPSTREAM",
  "plugins/opt-in/implementation/postgres/skills/**",
  "plugins/flows/skills/self-review/references/upstream/**",
  # Generated by the flow cockpit's export_bindings test.
  "crates/flow-cockpit/bindings/**",
  # The views' libraries, copied unchanged from their npm releases (THIRD_PARTY.md).
  "crates/flow-cockpit/app/shell/vendor/**",
  # Test fixtures are real documents and templates, read as written.
  "crates/flow-cockpit/core/tests/fixtures/**",
  ".pre-commit-config.yaml",
  # npm writes it.
  "package-lock.json",
]

[formatter.alejandra]
command = "alejandra"
includes = ["*.nix"]

[formatter.prettier]
command = "prettier"
options = ["--write"]
includes = ["*.js", "*.mjs", "*.ts", "*.tsx", "*.json", "*.md", "*.yaml", "*.yml"]

[formatter.rustfmt]
command = "rustfmt"
options = ["--edition", "2024"]
includes = ["*.rs"]
