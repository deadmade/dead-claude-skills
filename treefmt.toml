# Run with `nix fmt`; the pre-commit hook checks staged files with it.
on-unmatched = "debug"
# Vendored upstream files and the generated hook config: reformatting them would churn every sync.
excludes = [
  "plugins/opt-in/hallmark/**",
  "plugins/shared/paper-lookup/skills/**",
  "plugins/shared/mattpocock-picks/**",
  "plugins/shared/pstack-picks/**",
  "plugins/shared/tob-picks/**",
  "plugins/shared/graphify/**",
  "plugins/opt-in/implementation/*-skills/library/**",
  "plugins/opt-in/implementation/*-skills/skills/**",
  "plugins/opt-in/implementation/*-skills/LICENSE",
  "plugins/opt-in/implementation/*-skills/UPSTREAM",
  "plugins/opt-in/implementation/postgres/skills/**",
  "plugins/shared/self-review/agents/**",
  "plugins/shared/self-review/skills/self-review/references/upstream/**",
  ".pre-commit-config.yaml",
]

[formatter.alejandra]
command = "alejandra"
includes = ["*.nix"]

[formatter.prettier]
command = "prettier"
options = ["--write"]
includes = ["*.js", "*.mjs", "*.ts", "*.tsx", "*.json", "*.md", "*.yaml", "*.yml"]

[formatter.rustfmt]
command = "rustfmt"
options = ["--edition", "2024"]
includes = ["*.rs"]
